<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle Global | VagasIO</title>
  <link rel="stylesheet" href="saas-shell.css?v=20260803-1">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="titulo-login">
    <div class="auth-brand">
      <div class="brand-mark">V</div>
      <div>
        <div class="brand-name" style="color:var(--wine-800)">Vagas<span>IO</span></div>
        <span class="brand-sub" style="color:var(--muted)">Controle global</span>
      </div>
    </div>
    <h1 class="auth-title" id="titulo-login">Acesso administrativo</h1>
    <p class="auth-subtitle">Gerencie empresas, usuários e a operação do VagasIO em um único ambiente.</p>
    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username" placeholder="Digite seu e-mail" required>
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <input class="input" id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
      </div>
      <button class="btn btn-primary" id="btn-login" type="submit">Entrar no painel</button>
      <div class="auth-error" id="erro" role="alert"></div>
    </form>
    <div class="auth-footer">Área restrita • Acesso protegido por autenticação</div>
  </main>
  <script src="auth-store.js?v=20260808-1"></script>
  <script>
    const API = 'https://recrutamento-api-novo.onrender.com';
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');
    const erro = document.getElementById('erro');
    if (SaaSAuthStore.hasAccess() || SaaSAuthStore.getLegacy()) {
      window.location.replace('dashboard.html');
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      erro.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      if (!email || !senha) { erro.textContent = 'Informe seu e-mail e sua senha.'; erro.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        const response = await fetch(API + '/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.erro || 'Não foi possível entrar.');
        if (data.requer_2fa) {
          SaaSAuthStore.setPending2FA(email, data.codigo_id || '');
          window.location.replace('2fa.html');
          return;
        }
        if (!data.token) throw new Error('A API não retornou uma sessão válida.');
        SaaSAuthStore.setSession({ token: data.token, refreshToken: data.refreshToken, usuario: data.usuario });
        window.location.replace('dashboard.html');
      } catch (error) {
        erro.textContent = error.message || 'Erro ao entrar.';
        erro.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Entrar no painel';
      }
    });
  </script>
</body>
</html>
