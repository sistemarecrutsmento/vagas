<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Admin · Vagas.io</title>
  <style>
    :root { --vinho: #722F37; --dourado: #C9A961; }
    body { font-family: -apple-system, sans-serif; background: #f7f5f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 360px; }
    h1 { color: var(--vinho); font-size: 22px; margin: 0 0 4px; }
    p { color: #666; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    input:focus { border-color: var(--vinho); outline: none; }
    button { width: 100%; padding: 12px; background: var(--vinho); color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .erro { color: #c00; font-size: 13px; margin-top: 8px; display: none; }
    .nav-links { margin-top: 20px; text-align: center; font-size: 13px; }
    .nav-links a { color: var(--vinho); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚙️ SaaS Admin</h1>
    <p>Administração global da plataforma Vagas.io</p>
    <label>E-mail</label>
    <input type="email" id="email" placeholder="admin@vagasio.com.br" />
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" />
    <button id="btn-login">Entrar</button>
    <div class="erro" id="erro"></div>
    <div class="nav-links">
      <a href="equipe.html">👥 Equipe</a>
      <a href="empresas.html">🏢 Empresas</a>
    </div>
  </div>
  <script>
    const API = 'https://recrutamento-api-novo.onrender.com';
    const btn = document.getElementById('btn-login');
    const erroEl = document.getElementById('erro');

    if (localStorage.getItem('admin_token')) {
      window.location.href = 'equipe.html';
    }

    btn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      erroEl.style.display = 'none';
      btn.disabled = true;
      try {
        const r = await fetch(API + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await r.json();
        if (data.requer_2fa) {
          localStorage.setItem('admin_login_email', email);
          localStorage.setItem('admin_login_2fa_id', data.codigo_id || '');
          window.location.href = '../admin/index.html?login=2fa';
          return;
        }
        if (!data.token) throw new Error(data.erro || 'Falha no login');
        localStorage.setItem('admin_token', data.token);
        window.location.href = 'equipe.html';
      } catch (e) {
        erroEl.textContent = e.message;
        erroEl.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('senha').addEventListener('keydown', e => {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
