<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificação de segurança | VagasIO</title><link rel="stylesheet" href="saas-shell.css?v=20260803-1">  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
</head><body class="auth-page"><main class="auth-card"><div class="auth-brand"><div class="brand-mark">V</div><div><div class="brand-name" style="color:var(--wine-800)">Vagas<span>IO</span></div><span class="brand-sub" style="color:var(--muted)">Controle global</span></div></div><h1 class="auth-title">Verificação em duas etapas</h1><p class="auth-subtitle">Digite o código de 6 dígitos enviado para o endereço de acesso administrativo.</p><form id="form"><div class="form-field"><label for="codigo">Código de verificação</label><input class="input" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required style="font-size:24px;letter-spacing:8px;text-align:center"></div><button class="btn btn-primary" id="verificar" type="submit">Verificar e entrar</button><div class="auth-error" id="erro" role="alert"></div></form><div style="text-align:center;margin-top:18px"><button class="btn btn-light" id="reenviar" type="button">Reenviar código</button></div><div class="auth-footer"><a href="index.html">← Voltar ao login</a></div></main><script src="auth-store.js?v=20260808-1"></script><script>
const API='https://recrutamento-api-novo.onrender.com',pending=SaaSAuthStore.getPending2FA(),codigoId=pending.codigoId,email=pending.email,$=id=>document.getElementById(id);if(!codigoId)location.replace('index.html');$('codigo').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6));$('form').onsubmit=async e=>{e.preventDefault();const b=$('verificar'),er=$('erro');er.style.display='none';if($('codigo').value.length!==6){er.textContent='Digite os 6 dígitos do código.';er.style.display='block';return}b.disabled=true;b.textContent='Verificando…';try{const r=await fetch(API+'/api/admin/2fa/verificar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo_id:codigoId,codigo:$('codigo').value})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.token)throw new Error(d.erro||'Código inválido.');SaaSAuthStore.setSession({token:d.token,refreshToken:d.refreshToken});SaaSAuthStore.clearPending2FA();location.replace('dashboard.html')}catch(x){er.textContent=x.message;er.style.display='block';$('codigo').value=''}finally{b.disabled=false;b.textContent='Verificar e entrar'}};let cooldown=false;$('reenviar').onclick=async()=>{if(cooldown)return;const b=$('reenviar'),er=$('erro');b.disabled=true;try{const r=await fetch(API+'/api/admin/2fa/reenviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo_id:codigoId})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Não foi possível reenviar o código.');cooldown=true;let n=60;b.textContent='Aguarde '+n+'s';const t=setInterval(()=>{n--;b.textContent=n?'Aguarde '+n+'s':'Reenviar código';if(!n){clearInterval(t);cooldown=false;b.disabled=false}},1000)}catch(x){er.textContent=x.message;er.style.display='block';b.disabled=false}};
</script></body></html>
