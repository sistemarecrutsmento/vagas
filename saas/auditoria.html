<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Auditoria · SaaS · Vagas.io</title>
  <style>
    :root{--vinho:#722F37;--vinho-claro:#8B3A45;--bg:#f7f5f2;--borda:#e8e4df;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:#1a1a1a;min-height:100vh;}
    header{background:var(--vinho);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
    .logo{color:#fff;font-size:18px;font-weight:800;text-decoration:none;}
    .logo span{color:#e8b86d;}
    nav a{color:rgba(255,255,255,.8);text-decoration:none;margin-left:20px;font-size:14px;padding:6px 10px;border-radius:6px;}
    nav a:hover,nav a.ativo{background:rgba(255,255,255,.15);color:#fff;}
    .hright{display:flex;align-items:center;gap:12px;}
    .avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;}
    main{max-width:1400px;margin:0 auto;padding:28px 24px;}
    .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .ph h1{font-size:22px;font-weight:700;}
    .ph p{color:#666;font-size:13px;margin-top:2px;}
    .filters{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
    .filters label{font-size:12px;font-weight:600;color:#555;display:flex;flex-direction:column;gap:4px;}
    .filters input,.filters select{padding:7px 10px;border:1.5px solid #ddd;border-radius:7px;font-size:13px;min-width:140px;}
    .filters input:focus,.filters select:focus{border-color:var(--vinho);outline:none;}
    .btn{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--vinho);color:#fff;}
    .btn:hover{opacity:.9;}
    .btn-sm{padding:6px 12px;font-size:12px;}
    .btn-ghost{background:transparent;border:1.5px solid var(--borda);color:#555;}
    .table-wrap{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.5px;background:#faf9f8;border-bottom:1px solid var(--borda);}
    tbody tr{border-bottom:1px solid #f0ece8;cursor:pointer;transition:background .12s;}
    tbody tr:hover{background:#faf7f4;}
    tbody td{padding:10px 14px;color:#333;vertical-align:top;}
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
    .b-success{background:#e8f5e9;color:#2e7d32;}
    .b-failure{background:#fce4ec;color:#c62828;}
    .b-blocked{background:#fff3e0;color:#e65100;}
    .b-admin{background:#e8eaf6;color:#3949ab;}
    .b-empresa{background:#e3f2fd;color:#1565c0;}
    .b-candidato{background:#f3e5f5;color:#6a1b9a;}
    .b-anonymous{background:#f5f5f5;color:#757575;}
    .pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;}
    .pagination button{padding:6px 12px;border:1px solid var(--borda);background:#fff;border-radius:6px;cursor:pointer;font-size:13px;}
    .pagination button.ativo{background:var(--vinho);color:#fff;border-color:var(--vinho);}
    .pagination button:disabled{opacity:.4;cursor:default;}
    .meta-trunc{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#999;font-size:11px;}
    .empty{text-align:center;padding:48px;color:#aaa;}
    .loading{text-align:center;padding:32px;color:#999;}
    /* Modal */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center;}
    .modal-bg.open{display:flex;}
    .modal{background:#fff;border-radius:14px;padding:28px 32px;max-width:620px;width:90%;max-height:80vh;overflow-y:auto;position:relative;}
    .modal h2{font-size:18px;margin-bottom:16px;}
    .modal-close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;cursor:pointer;color:#666;}
    .modal-row{display:flex;gap:8px;margin-bottom:10px;font-size:13px;}
    .modal-key{font-weight:600;color:#555;min-width:130px;}
    .modal-val{color:#333;word-break:break-all;}
    pre.meta-json{background:#f5f5f7;padding:12px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;}
    @media(max-width:900px){nav{display:none;} .filters{gap:8px;} thead th:nth-child(n+5){display:none;} tbody td:nth-child(n+5){display:none;}}
  </style>
</head>
<body>
<header>
  <a href="index.html" class="logo">Vagas<span>.io</span></a>
  <nav>
    <a href="empresas.html">🏢 Empresas</a>
    <a href="equipe.html">👥 Equipe</a>
    <a href="analytics.html">📊 Analytics</a>
    <a href="auditoria.html" class="ativo">🔍 Auditoria</a>
  </nav>
  <div class="hright">
    <div class="avatar" id="hd-av">A</div>
    <button class="btn btn-ghost btn-sm" onclick="sair()">Sair</button>
  </div>
</header>

<main>
  <div class="ph">
    <div>
      <h1>🔍 Auditoria do Sistema</h1>
      <p>Logs de segurança e ações — somente leitura</p>
    </div>
    <button class="btn" id="btn-atualizar" onclick="carregar()">🔄 Atualizar</button>
  </div>

  <div class="filters">
    <label>Usuário / E-mail
      <input type="text" id="f-usuario" placeholder="email ou user_id" maxlength="100">
    </label>
    <label>Ação
      <input type="text" id="f-acao" placeholder="ex: login.success" maxlength="100">
    </label>
    <label>Recurso
      <select id="f-recurso">
        <option value="">Todos</option>
        <option value="candidato">candidato</option>
        <option value="empresa">empresa</option>
        <option value="vaga">vaga</option>
        <option value="candidatura">candidatura</option>
        <option value="admin">admin</option>
      </select>
    </label>
    <label>De
      <input type="date" id="f-ini">
    </label>
    <label>Até
      <input type="date" id="f-fim">
    </label>
    <label>Limite
      <select id="f-limite">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </label>
    <button class="btn" onclick="pagAtual=1;carregar()">🔍 Filtrar</button>
    <button class="btn btn-ghost" onclick="limparFiltros()">✕ Limpar</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Usuário</th>
          <th>Tipo</th>
          <th>Ação</th>
          <th>Recurso</th>
          <th>Resultado</th>
          <th>IP</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pagination" id="pag"></div>
</main>

<!-- Modal detalhes -->
<div class="modal-bg" id="modal-bg" onclick="fecharModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="fecharModal()">×</button>
    <h2>Detalhes do Log</h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const API = 'https://recrutamento-api-novo.onrender.com';
const tok = localStorage.getItem('admin_token');
if (!tok) location.href = 'index.html';

let pagAtual = 1;
let totalPags = 1;

function sair(){localStorage.removeItem('admin_token');location.href='index.html';}
function $(id){return document.getElementById(id);}
function fmtDt(s){
  if(!s)return'—';
  const d=new Date(s);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function badgeRes(r){
  const map={'success':'b-success','failure':'b-failure','blocked':'b-blocked'};
  return `<span class="badge ${map[r]||'b-anonymous'}">${r||'—'}</span>`;
}
function badgeTipo(t){
  const map={'admin':'b-admin','empresa':'b-empresa','candidato':'b-candidato','anonymous':'b-anonymous'};
  return `<span class="badge ${map[t]||'b-anonymous'}">${t||'anon'}</span>`;
}

async function carregar(){
  const btn = $('btn-atualizar');
  btn.disabled = true; btn.textContent = '⏳ Carregando…';
  const params = new URLSearchParams({
    pagina: pagAtual,
    limite: $('f-limite').value
  });
  const usuario = $('f-usuario').value.trim();
  const acao    = $('f-acao').value.trim();
  const recurso = $('f-recurso').value;
  const ini     = $('f-ini').value;
  const fim     = $('f-fim').value;
  if(usuario) params.set('usuario', usuario);
  if(acao)    params.set('acao', acao);
  if(recurso) params.set('recurso', recurso);
  if(ini)     params.set('periodo_inicio', ini);
  if(fim)     params.set('periodo_fim', fim + 'T23:59:59');

  try {
    const r = await fetch(API+'/api/saas/auditoria?'+params, {
      headers:{Authorization:'Bearer '+tok}
    });
    if(r.status===401||r.status===403){sair();return;}
    const d = await r.json();
    renderTabela(d.logs||[]);
    renderPag(d.paginacao||{});
  } catch(e){
    $('tbody').innerHTML = `<tr><td colspan="8" class="empty">Erro ao carregar logs</td></tr>`;
  }
  btn.disabled = false; btn.textContent = '🔄 Atualizar';
}

function renderTabela(logs){
  if(!logs.length){
    $('tbody').innerHTML = `<tr><td colspan="8" class="empty">Nenhum log encontrado</td></tr>`;
    return;
  }
  $('tbody').innerHTML = logs.map(l => `
    <tr onclick="abrirModal(${l.id})">
      <td>${fmtDt(l.created_at)}</td>
      <td>${l.user_email||l.user_id||'—'}</td>
      <td>${badgeTipo(l.user_type)}</td>
      <td style="font-family:monospace;font-size:12px">${l.action||'—'}</td>
      <td>${l.resource_type||'—'}${l.resource_id?' #'+l.resource_id:''}</td>
      <td>${badgeRes(l.result)}</td>
      <td style="font-size:11px;color:#999">${l.ip||'—'}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();abrirModal(${l.id})">Ver</button></td>
    </tr>
  `).join('');
  // Guardar logs para o modal
  window._logsCache = {};
  logs.forEach(l => window._logsCache[l.id] = l);
}

function renderPag(p){
  totalPags = p.paginas || 1;
  const pag = $('pag');
  if(totalPags <= 1){pag.innerHTML='';return;}
  let html = '';
  html += `<button ${pagAtual===1?'disabled':''} onclick="irPag(${pagAtual-1})">‹ Ant</button>`;
  for(let i=Math.max(1,pagAtual-2);i<=Math.min(totalPags,pagAtual+2);i++){
    html += `<button class="${i===pagAtual?'ativo':''}" onclick="irPag(${i})">${i}</button>`;
  }
  html += `<button ${pagAtual===totalPags?'disabled':''} onclick="irPag(${pagAtual+1})">Próx ›</button>`;
  html += `<span style="font-size:12px;color:#999;margin-left:8px">${p.total} registros</span>`;
  pag.innerHTML = html;
}

function irPag(p){pagAtual=p;carregar();}

function limparFiltros(){
  ['f-usuario','f-acao','f-ini','f-fim'].forEach(id=>$(id).value='');
  $('f-recurso').value='';
  $('f-limite').value='50';
  pagAtual=1;
  carregar();
}

function abrirModal(id){
  const l = window._logsCache?.[id];
  if(!l){return;}
  const rows = [
    ['ID', l.id],
    ['Data/Hora', fmtDt(l.created_at)],
    ['Usuário ID', l.user_id||'—'],
    ['E-mail', l.user_email||'—'],
    ['Tipo', l.user_type||'—'],
    ['Ação', l.action],
    ['Recurso', l.resource_type||'—'],
    ['Recurso ID', l.resource_id||'—'],
    ['Resultado', l.result||'—'],
    ['IP', l.ip||'—'],
  ].map(([k,v])=>`<div class="modal-row"><span class="modal-key">${k}</span><span class="modal-val">${String(v)}</span></div>`).join('');
  const meta = l.metadata && Object.keys(l.metadata).length
    ? `<div style="margin-top:12px"><b style="font-size:12px;color:#555">Metadata</b><pre class="meta-json">${JSON.stringify(l.metadata, null, 2)}</pre></div>`
    : '';
  $('modal-body').innerHTML = rows + meta;
  $('modal-bg').classList.add('open');
}

function fecharModal(ev){
  if(!ev || ev.target===document.getElementById('modal-bg')||ev.target.classList.contains('modal-close')){
    $('modal-bg').classList.remove('open');
  }
}

// Carregar info do admin
fetch(API+'/api/admin/me',{headers:{Authorization:'Bearer '+tok}})
  .then(r=>r.ok?r.json():null)
  .then(d=>{if(d?.nome)$('hd-av').textContent=d.nome[0].toUpperCase();})
  .catch(()=>{});

carregar();
</script>
</body>
</html>
