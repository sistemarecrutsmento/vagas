<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=()">
<title>Demo Face | VagasIO Staging</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;max-width:760px;margin:0 auto;padding:20px}h1{color:#d4af37}video{width:100%;max-width:640px;background:#222;border-radius:12px;transform:scaleX(-1)}button{padding:12px 18px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.cmd{font-size:24px;margin:16px 0}.ok{color:#65d68a}.log{background:#222;padding:12px;border-radius:8px;white-space:pre-wrap;min-height:80px;font-size:13px}
</style>
</head>
<body>
<h1>Teste prático do Master Face</h1>
<p>Modo demonstração do staging: não exige login, não cadastra template e não envia vídeo ou descriptor para a API.</p>
<button id="start">Iniciar câmera e teste</button>
<div class="cmd" id="command">Aguardando início</div>
<video id="video" autoplay playsinline muted></video>
<p id="status">A câmera será usada somente nesta página.</p>
<div class="log" id="log"></div>
<script type="module">
const $=id=>document.getElementById(id), log=(m)=>{$('log').textContent+=m+'\n';console.info('[FACE-DEMO]',m)};
const commands=[['blink','Piscar os olhos'],['open_mouth','Abrir a boca'],['turn_left','Virar o rosto para a esquerda'],['turn_right','Virar o rosto para a direita'],['nod','Acenar com a cabeça']];
let detector;
function metrics(p,blend){const faceW=Math.max(Math.hypot(p[33].x-p[263].x,p[33].y-p[263].y),.001),nose=p[1],eyeMid={x:(p[33].x+p[263].x)/2,y:(p[33].y+p[263].y)/2};const a=Object.fromEntries((blend?.categories||[]).map(x=>[x.categoryName,x.score]));return {eyeBlink:((a.eyeBlinkLeft||0)+(a.eyeBlinkRight||0))/2,jawOpen:a.jawOpen||0,yaw:(nose.x-eyeMid.x)/faceW,nod:(nose.y-eyeMid.y)/faceW};}
async function vision(){if(detector)return detector;log('Carregando MediaPipe');const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm');log('Carregando WASM');const fs=await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');log('Carregando modelo');detector=await m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});log('MediaPipe e modelo carregados');return detector;}
async function run(cmd,label){$('command').textContent=label;$('status').textContent='Execute o comando mostrado acima';log('Comando: '+label);const start=performance.now();let neutral=[],first=null,samples=[],state='neutral',hold=0,down=0,back=0,done=false,last=0;while(performance.now()-start<15000){const r=detector.detectForVideo($('video'),performance.now()),p=r.faceLandmarks?.length===1?r.faceLandmarks[0]:null;if(p){const blend=r.faceBlendshapes?.[0],m=metrics(p,blend);samples.push(p);if(!first){neutral.push(m);if(neutral.length>=12){const spread=k=>Math.max(...neutral.map(x=>x[k]))-Math.min(...neutral.map(x=>x[k]));if(spread('yaw')<.08&&spread('nod')<.08){first=neutral[Math.floor(neutral.length/2)];state='ready';log('Posição neutra confirmada')}else neutral.shift();}}else{if(cmd==='blink'){if(state==='ready'&&m.eyeBlink>.45){state='closed';hold=0}else if(state==='closed'&&m.eyeBlink<.18){hold++;if(hold>=3)state='reopen'}else if(state==='reopen'&&m.eyeBlink>.45){hold++;done=hold>=3}}else if(cmd==='open_mouth'){if(m.jawOpen>.35)hold++;else if(hold<4)hold=0;done=hold>=5}else if(cmd==='turn_left'||cmd==='turn_right'){const hit=cmd==='turn_left'?m.yaw<first.yaw-.28:m.yaw>first.yaw+.28;if(hit)hold++;else hold=0;done=hold>=5}else if(cmd==='nod'){if(!down&&m.nod>first.nod+.10){down++;if(down>=4)state='down'}else if(state==='down'&&Math.abs(m.nod-first.nod)<.045){back++;done=back>=4}}if(performance.now()-last>700){log('face='+ (p?'1':'0')+' estado='+state+' blink='+m.eyeBlink.toFixed(2)+' jaw='+m.jawOpen.toFixed(2)+' yaw='+m.yaw.toFixed(2)+' nod='+m.nod.toFixed(2));last=performance.now();}}}else if(r.faceLandmarks?.length!==1){state='neutral';neutral=[];first=null;log('É necessário exatamente 1 rosto')}if(done)break;await new Promise(requestAnimationFrame);}if(!done)throw Error('Comando não confirmado em 15 segundos');$('command').textContent='✓ '+label;$('command').className='cmd ok';log('Comando confirmado por sequência temporal; frames='+samples.length);return samples[Math.floor(samples.length/2)];}
$('start').onclick=async()=>{ $('start').disabled=true;try{log('Solicitando câmera');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;await $('video').play();log('Câmera ativa');await vision();for(const c of commands){$('command').className='cmd';await run(c[0],c[1]);}$('status').textContent='Teste concluído com sucesso. Nenhum dado foi enviado ao backend.';log('TESTE FINALIZADO');}catch(e){$('status').textContent=e.message||String(e);log('ERRO: '+(e.stack||e));$('start').disabled=false;}};
</script>
</body></html>
