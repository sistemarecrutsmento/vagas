<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=()">
<title>Demo Face | VagasIO Staging</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;max-width:760px;margin:0 auto;padding:20px}h1{color:#d4af37}video{width:100%;max-width:640px;background:#222;border-radius:12px;transform:scaleX(-1)}button{padding:12px 18px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.cmd{font-size:24px;margin:16px 0}.ok{color:#65d68a}.log{background:#222;padding:12px;border-radius:8px;white-space:pre-wrap;min-height:80px;font-size:13px}
</style>
</head>
<body>
<h1>Teste prático do Master Face</h1>
<p>Modo demonstração do staging: não exige login, não cadastra template e não envia vídeo ou descriptor para a API.</p>
<button id="start">Iniciar câmera e teste</button>
<div class="cmd" id="command">Aguardando início</div>
<video id="video" autoplay playsinline muted></video>
<p id="status">A câmera será usada somente nesta página.</p>
<div class="log" id="log"></div>
<script type="module">
const $=id=>document.getElementById(id), log=(m)=>{$('log').textContent+=m+'\n';console.info('[FACE-DEMO]',m)};
const commands=[['blink','Piscar os olhos'],['open_mouth','Abrir a boca'],['turn_left','Virar o rosto para a esquerda'],['turn_right','Virar o rosto para a direita'],['nod','Acenar com a cabeça']];
let detector;
function metrics(p){const nose=p[1], leTop=p[159],leBottom=p[145],reTop=p[386],reBottom=p[374],up=p[13],lo=p[14],left=p[33],right=p[263];const width=Math.max(Math.abs(right.x-left.x),.001), eyeOpen=((leBottom.y-leTop.y)+(reBottom.y-reTop.y))/2/width;return {eyeOpen,mouthOpen:Math.abs(up.y-lo.y)/width,yaw:(nose.x-(left.x+right.x)/2)/width,nod:nose.y};}
async function vision(){if(detector)return detector;log('Carregando MediaPipe');const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm');log('Carregando WASM');const fs=await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');log('Carregando modelo');detector=await m.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:false});log('MediaPipe e modelo carregados');return detector;}
async function run(cmd,label){$('command').textContent=label;$('status').textContent='Execute o comando mostrado acima';log('Comando: '+label);const start=performance.now();let base=[],samples=[],done=false,last=0;while(performance.now()-start<15000){const r=detector.detectForVideo($('video'),performance.now()),p=r.faceLandmarks?.[0];if(p){const m=metrics(p);samples.push(p);if(base.length<8)base.push(m);const b=base[Math.min(base.length-1,7)];if(cmd==='blink')done=base.length>=8&&m.eyeOpen<b.eyeOpen*.58;if(cmd==='open_mouth')done=base.length>=8&&m.mouthOpen>Math.max(b.mouthOpen*1.55,.35);if(cmd==='turn_left')done=base.length>=8&&m.yaw<b.yaw-.35;if(cmd==='turn_right')done=base.length>=8&&m.yaw>b.yaw+.35;if(cmd==='nod')done=base.length>=8&&Math.abs(m.nod-b.nod)>0.12;if(performance.now()-last>1000){log('Rosto detectado; comando concluído: '+done);last=performance.now();}if(done)break;}await new Promise(requestAnimationFrame);}if(!done)throw Error('Comando não detectado em 15 segundos');$('command').textContent='✓ '+label;$('command').className='cmd ok';log('Comando concluído; pontos faciais capturados: '+samples[Math.floor(samples.length/2)].length);return samples[Math.floor(samples.length/2)];}
$('start').onclick=async()=>{ $('start').disabled=true;try{log('Solicitando câmera');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;await $('video').play();log('Câmera ativa');await vision();for(const c of commands){$('command').className='cmd';await run(c[0],c[1]);}$('status').textContent='Teste concluído com sucesso. Nenhum dado foi enviado ao backend.';log('TESTE FINALIZADO');}catch(e){$('status').textContent=e.message||String(e);log('ERRO: '+(e.stack||e));$('start').disabled=false;}};
</script>
</body></html>
