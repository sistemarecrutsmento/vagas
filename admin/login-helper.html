<!DOCTYPE html>
<html>
<head><title>Login Helper</title></head>
<body>
<h1>Login Helper</h1>
<p>Redirecionando...</p>
<script>
(async () => {
  const url = new URLSearchParams(location.search);
  const email = url.get('email') || 'fabio08dejesusjunior@gmail.com';
  const senha = url.get('senha') || '089339';
  const next = url.get('next') || 'analisar.html?id=26';

  try {
    const r = await fetch('https://recrutamento-api.onrender.com/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const j = await r.json();
    if (j.token) {
      localStorage.setItem('admin_token', j.token);
      document.body.innerHTML = '<p>✅ Logado como ' + email + '. Redirecionando pra ' + next + '...</p>';
      setTimeout(() => location.href = next, 800);
    } else {
      document.body.innerHTML = '<p>❌ Erro: ' + JSON.stringify(j) + '</p>';
    }
  } catch (e) {
    document.body.innerHTML = '<p>❌ ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
