<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base de Talentos — Admin</title>
  <style>
    :root {
      --vinho: #722F37; --vinho-escuro: #5A1F26; --dourado: #D4AF37;
      --branco: #FFFFFF; --preto: #1a1a1a; --cinza-medio: #6b7280;
      --cinza-claro: #f3f4f6; --borda: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--cinza-claro); color: var(--preto); }
    .app { display: flex; min-height: 100vh; }
    aside { width: 240px; background: var(--vinho); color: var(--branco); padding: 24px 0; flex-shrink: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .aside-logo { padding: 0 24px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; }
    .aside-logo h1 { font-size: 20px; font-weight: 800; color: #fff; margin: 0; }
    .aside-logo small { color: rgba(255,255,255,0.6); font-size: 12px; }
    .nav-item { display: block; padding: 12px 24px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; }
    .nav-item:hover { background: rgba(255,255,255,0.08); }
    .nav-item.ativo { background: var(--vinho-escuro); border-left: 3px solid var(--dourado); font-weight: 600; }
    .aside-user { margin-top: auto; padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
    .aside-user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--dourado); color: var(--preto); font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .aside-user-info { flex: 1; min-width: 0; }
    .aside-user-info .nome { font-size: 13px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; }
    .aside-user-info .empresa { font-size: 11px; color: rgba(255,255,255,0.65); overflow: hidden; text-overflow: ellipsis; }
    .btn-logout { padding: 6px 10px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 18px; }
    .btn-logout:hover { color: #fff; }
    main { flex: 1; padding: 32px; max-width: 100%; }
    .page-header h2 { color: var(--vinho); margin: 0 0 6px; }
    .page-header p { color: var(--cinza-medio); margin: 0 0 24px; font-size: 14px; }
    .filtros-bar { display: flex; gap: 12px; margin-bottom: 18px; align-items: center; flex-wrap: wrap; }
    .filtros-bar input, .filtros-bar select { padding: 10px 14px; border: 1px solid var(--borda); border-radius: 8px; font-size: 14px; background: var(--branco); }
    .filtros-bar input { flex: 1; min-width: 220px; }
    .filtros-bar .badge-total { padding: 6px 12px; background: #f5f5f5; color: var(--cinza-medio); border-radius: 999px; font-size: 12px; font-weight: 600; }
    .card { background: var(--branco); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #fafafa; }
    th { text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase; color: var(--cinza-medio); font-weight: 600; border-bottom: 1px solid var(--borda); }
    td { padding: 14px 16px; border-bottom: 1px solid var(--borda); font-size: 14px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #fafafa; }
    .empty { text-align: center; padding: 40px; color: var(--cinza-medio); }
    .talent-nome { font-weight: 600; color: var(--preto); }
    .talent-areas { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .talent-area-tag { display: inline-block; padding: 2px 8px; background: #f5f5f5; color: var(--cinza-medio); border-radius: 999px; font-size: 10px; }
    .talent-email { font-size: 12px; color: var(--cinza-medio); margin-top: 2px; }
    .status { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .status-em_andamento, .status-em_analise { background: #FFF4E5; color: #B45309; }
    .status-em_processo { background: #DBEAFE; color: #1E40AF; }
    .status-contratado, .status-aprovado { background: #E5F8E5; color: #166534; }
    .status-rejeitado, .status-reprovado { background: #FEE2E2; color: #991B1B; }
    .etapa-tag { display: inline-block; padding: 3px 8px; background: var(--vinho); color: var(--branco); border-radius: 999px; font-size: 10px; font-weight: 600; margin-top: 4px; }
    .btn { display: inline-block; padding: 8px 16px; background: var(--vinho); color: var(--branco); text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .btn:hover { background: var(--vinho-escuro); }
    .spinner { width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top: var(--vinho) solid; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) { aside { width: 100%; min-height: auto; } .app { flex-direction: column; } main { padding: 20px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="aside-logo">
        <h1>Admin</h1>
        <small>VagasIO</small>
      </div>
      <a class="nav-item" href="index.html">📊 Dashboard</a>
      <a class="nav-item" href="index.html?page=vagas">💼 Vagas</a>
      <a class="nav-item ativo" href="banco-talentos.html">👥 Base de Talentos</a>
      <a class="nav-item" href="candidaturas.html">📋 Vagas com Candidatos</a>
      <a class="nav-item" href="agenda.html">📅 Agenda</a>
      <a class="nav-item" href="equipe.html">👥 Equipe</a>
      <a class="nav-item" href="../" style="opacity:0.7;">🏡 Voltar pro site</a>
      <div class="aside-user">
        <div class="aside-user-avatar" id="aside-user-avatar">--</div>
        <div class="aside-user-info">
          <div class="nome" id="aside-user-nome">--</div>
          <div class="empresa" id="aside-user-empresa">--</div>
        </div>
        <a href="index.html" class="btn-logout" title="Sair">↪</a>
      </div>
    </aside>
    <main>
      <div class="page-header">
        <h2>👥 Base de Talentos</h2>
        <p>Todos os candidatos cadastrados na plataforma</p>
      </div>

      <div class="filtros-bar">
        <input id="busca" placeholder="🔎 Buscar por nome ou e-mail..." onkeyup="renderTalentos()">
        <select id="filtro-area" onchange="renderTalentos()">
          <option value="">Todas as áreas</option>
        </select>
        <span class="badge-total" id="badge-total">— candidatos</span>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Candidato</th>
              <th>Local</th>
              <th>Último status</th>
              <th>Cadastrado em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="talentos-tbody">
            <tr><td colspan="5" class="empty"><div class="spinner"></div> Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="banco-talentos.js?v=20260726103000_vagas_ativas_modal"></script>
</body>
</html>
