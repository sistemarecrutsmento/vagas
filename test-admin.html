<!DOCTYPE html>
<html><body>
<h1>Test Admin Login</h1>
<div id="status">aguardando...</div>
<div id="alert-login"></div>
<input type="email" id="login-email" value="fabio08dejesusjunior@gmail.com">
<input type="password" id="login-senha" value="089339">
<button id="btn-entrar" onclick="tentarLogin2()">Entrar</button>
<div id="result"></div>
<script>
async function tentarLogin2() {
  const r = document.getElementById('result');
  const btn = document.getElementById('btn-entrar');
  const alertEl = document.getElementById('alert-login');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  alertEl.innerHTML = '';
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => { ctrl.abort(); }, 15000);
    const resp = await fetch('https://recrutamento-api-novo.onrender.com/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha }),
      signal: ctrl.signal
    });
    clearTimeout(t);
    const data = await resp.json();
    if (resp.ok) {
      localStorage.setItem('admin_token', data.token);
      alertEl.innerHTML = '<div style="background:#dfd;padding:10px">✅ LOGOU!</div>';
      r.innerHTML = 'token salvo: ' + data.token.substring(0, 30) + '...';
      btn.textContent = '✓ Logado';
    } else {
      alertEl.innerHTML = '<div style="background:#fee;padding:10px">❌ ' + (data.erro || resp.status) + '</div>';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  } catch (e) {
    alertEl.innerHTML = '<div style="background:#fee;padding:10px">❌ ' + e.message + '</div>';
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body></html>
