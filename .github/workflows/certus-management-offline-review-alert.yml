name: Certus management offline-review dashboard regression
on:
  push:
    branches:
      - release/management-offline-review-alert-20261128
    paths:
      - 'certus/operacao.js'
      - 'certus/dashboard-offline-review.browser.test.cjs'
      - '.github/workflows/certus-management-offline-review-alert.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'certus/operacao.js'
      - 'certus/dashboard-offline-review.browser.test.cjs'
      - '.github/workflows/certus-management-offline-review-alert.yml'
jobs:
  offline-review-dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run focused browser regression and expose failure details
        shell: bash
        run: |
          set +e
          node --test --test-reporter=spec certus/dashboard-offline-review.browser.test.cjs 2>&1 | tee /tmp/offline-review-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/offline-review-test.log
            exit "$result"
          fi
