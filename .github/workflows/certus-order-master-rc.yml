name: CERTUS release-candidate safety checks
on:
  push:
    branches: [release/certus-order-master-rc-20261128]
    paths:
      - 'certus/operacao.js'
      - 'certus/terminal.js'
      - 'certus/terminal.html'
      - 'certus/service-worker.js'
      - 'certus/terminal-offline.test.cjs'
      - 'certus/terminal.performance.test.cjs'
      - 'certus/records-timesheet-layout.test.cjs'
      - 'certus/release-candidate-safety.test.cjs'
      - '.github/workflows/certus-order-master-rc.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check certus/operacao.js && node --check certus/terminal.js && node --check certus/release-candidate-safety.test.cjs
      - run: node --test --test-reporter=spec certus/release-candidate-safety.test.cjs certus/terminal-offline.test.cjs certus/terminal.performance.test.cjs certus/records-timesheet-layout.test.cjs
