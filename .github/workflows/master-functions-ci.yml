name: Certus Master functional-gap browser tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'certus/master.html'
      - 'certus/master.integration.test.js'
      - 'certus/master.browser.test.cjs'
      - 'certus/master-visual-audit.browser.test.cjs'
      - 'certus/operacao.js'
      - 'certus/operacao.css'
      - 'certus/operacao-mobile.css'
      - 'certus/pwa.js'
      - 'certus/service-worker.js'
      - 'certus/offline-clock.test.cjs'
      - 'certus/schedule-12x36-ui.test.cjs'
      - 'certus/records-timesheet-layout.test.cjs'
      - 'certus/index.html'
      - 'certus/service-worker.js'
      - 'certus/subscription-management.browser.test.cjs'
      - '.github/workflows/master-functions-ci.yml'
jobs:
  master-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install chromium
      - run: node --test --test-reporter=spec certus/master.integration.test.js certus/master.browser.test.cjs certus/master-visual-audit.browser.test.cjs certus/subscription-management.browser.test.cjs certus/records-timesheet-layout.test.cjs certus/offline-clock.test.cjs certus/schedule-12x36-ui.test.cjs
