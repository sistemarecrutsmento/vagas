name: Certus landing real-UI screenshot fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - 'certus/landing-captures.test.cjs'
      - '.github/workflows/certus-landing-screenshots.yml'
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p landing-captures && node --test --test-reporter=spec certus/landing-captures.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: certus-landing-real-ui-screenshots
          path: landing-captures/*.png
          if-no-files-found: error
          retention-days: 7
