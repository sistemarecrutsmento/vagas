name: Certus Master draft UI checks
on:
  push:
    branches:
      - draft/master-functional-dev-20261113
    paths:
      - 'certus/master.html'
      - 'certus/master.integration.test.js'
      - 'certus/master.browser.test.cjs'
      - '.github/workflows/certus-master-draft-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'certus/master.html'
      - 'certus/master.integration.test.js'
      - 'certus/master.browser.test.cjs'
      - '.github/workflows/certus-master-draft-tests.yml'
jobs:
  master-ui:
    # Pin to the newest supported runner for Playwright 1.55; ubuntu-latest moved to 26.04 and this version cannot install Chromium there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node --test certus/master.integration.test.js certus/master.browser.test.cjs
