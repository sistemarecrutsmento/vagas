name: Certus support workflow tests
on:
  push:
    branches: [main]
    paths:
      - 'certus/operacao.js'
      - 'certus/operacao.css'
      - 'certus/master.html'
      - 'certus/support-workflow.test.js'
      - 'certus/support-reference.browser.test.cjs'
      - '.github/workflows/support-workflow-tests.yml'
  pull_request:
    paths:
      - 'certus/operacao.js'
      - 'certus/operacao.css'
      - 'certus/master.html'
      - 'certus/support-workflow.test.js'
      - 'certus/support-reference.browser.test.cjs'
      - '.github/workflows/support-workflow-tests.yml'
jobs:
  support-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: node --test certus/support-workflow.test.js certus/support-reference.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-reference-visual-regression
          path: artifacts/*.png
          if-no-files-found: ignore
