<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vagas com Candidatos — Portal Empresa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="empresa.css">
  <style>
    /* Reusa .vagas-grid/.vaga-card do empresa.css (idêntico ao admin/candidaturas) */
    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .status-publica { background: #d4edda; color: #155724; }
    .status-pausada { background: #fff3cd; color: #856404; }
    .status-fechada { background: #e2e3e5; color: #383d41; }
    .status-rascunho { background: #cfe2ff; color: #084c93; }
    .vaga-card .card-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .vaga-card .card-topo h3 { margin: 0; flex: 1; min-width: 0; }
    .vaga-card .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat-mini { background: var(--cinza, #f5f5f5); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
    .stat-mini strong { color: #7B1F1F; }
    .vaga-card .btn-ver { display: block; width: 100%; text-align: center; padding: 10px; background: var(--vinho, #7B1F1F); color: #fff; border-radius: 6px; font-size: 13px; font-weight: 500; text-decoration: none; }
    .vaga-card .btn-ver:hover { background: var(--vinho-escuro, #5a1414); }
    .vaga-card .card-rodape { margin-top: auto; padding-top: 4px; }
  </style>
  <link rel="stylesheet" href="empresa-shell.css?v=20260803shell3">
</head>
<body>
  <button class="menu-toggle" onclick="document.querySelector('aside').classList.add('aberto'); document.querySelector('.app').classList.add('aside-aberto');" aria-label="Abrir menu">☰</button>

  <div class="app">
    <aside class="empresa-shell-sidebar" aria-label="Navegação do Portal Empresa">
      <button class="empresa-shell-close menu-close" type="button" onclick="this.closest('aside').classList.remove('empresa-shell-open','aberto');" aria-label="Fechar menu">✕</button>
      <div class="empresa-shell-logo aside-logo"><h1>VagasIO</h1><small>Portal da Empresa</small></div>
      <nav class="empresa-shell-nav">
      <a class="nav-item" href="index.html">📊 Dashboard</a>
      <a class="nav-item" href="vagas-todas.html">💼 Minhas Vagas</a>
      <a class="nav-item" href="base-candidatos.html">👥 Base de Talentos</a>
      <a class="nav-item ativo" href="vagas.html">📋 Vagas com Candidatos</a>
      <a class="nav-item" href="agenda.html">📅 Agenda</a>
      <a class="nav-item" href="chat.html">💬 Chat</a>
      <a class="nav-item" href="analytics.html">📈 Analytics</a>
      <a class="nav-item" href="notificacoes.html">🔔 Notificações</a>
      <a class="nav-item" href="perfil.html">⚙️ Perfil</a>
      <a class="nav-item" id="nav-equipe" style="display:none;" href="usuarios.html">👥 Equipe</a>
      </nav>
      <div class="nav-divisor">Links</div>
      <a class="nav-item" href="../candidato/">👤 Portal do candidato</a>
      <div class="empresa-shell-user aside-user">
        <div class="empresa-shell-avatar aside-user-avatar" id="avatar">--</div>
        <div class="empresa-shell-user-info aside-user-info"><div class="nome" id="user-nome">--</div><div class="empresa" id="user-empresa">--</div><span id="user-role" style="display:none"></span></div>
        <button class="empresa-shell-logout btn-logout" type="button" onclick="if (typeof empresaSair === 'function') empresaSair(); else { localStorage.clear(); location.href='login.html'; }" title="Sair">↪</button>
      </div>
    </aside>

    <main>
      <div class="page-header">
        <div>
          <h2>📋 Vagas com Candidatos</h2>
          <div class="sub">Apenas vagas liberadas para sua empresa</div>
        </div>
      </div>

      <div id="grid" class="vagas-grid">
        <div class="card"><div class="empty">Carregando...</div></div>
      </div>
    </main>
  </div>

  <script>
    const API = 'https://recrutamento-api-novo.onrender.com';
    const token = localStorage.getItem('empresa_token');
    if (!token && !localStorage.getItem('empresa_refresh')) window.location.href = 'login.html';

    const usuario = JSON.parse(localStorage.getItem('empresa_usuario') || '{}');
    document.getElementById('avatar').textContent = (usuario.nome || '?').split(' ').filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join('');
    document.getElementById('user-nome').textContent = usuario.nome || '--';
    document.getElementById('user-empresa').textContent = usuario.empresa_nome || '--';

    function sair() {
      if (confirm('Sair do portal?')) empresaSair();
    }

    function statusBadge(status) {
      const map = {
        'publica':  { cls: 'status-publica',  label: 'Pública' },
        'publicada':{ cls: 'status-publica',  label: 'Publicada' },
        'pausada':  { cls: 'status-pausada',  label: 'Pausada' },
        'fechada':  { cls: 'status-fechada',  label: 'Fechada' },
        'rascunho': { cls: 'status-rascunho', label: 'Rascunho' }
      };
      const k = (status || '').toLowerCase();
      const s = map[k];
      if (!s) return '';
      return '<span class="status-badge ' + s.cls + '">' + s.label + '</span>';
    }

    async function carregar() {
      const grid = document.getElementById('grid');
      try {
        const r = await fetch(API + '/api/empresa/vagas-com-candidaturas', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (r.status === 401 || r.status === 403) { sair(); return; }
        const data = await r.json();
        const vagas = data.vagas || [];

        if (vagas.length === 0) {
          grid.innerHTML = '<div class="card"><div class="empty">Nenhuma vaga com candidatos ainda.</div></div>';
          return;
        }

        grid.innerHTML = vagas.map(v => {
          const local = [v.cidade, v.estado].filter(Boolean).join(' / ') || '—';
          const total = v.total_geral || 0;
          const emAnalise = v.em_analise || 0;
          const contratados = parseInt(v.contratados) || 0;
          const reprovados = parseInt(v.reprovados) || 0;
          return `<a class="vaga-card" href="candidatos.html?vaga=${v.id}">
            <div class="card-topo">
              <h3>${v.titulo || '—'}</h3>
              ${statusBadge(v.status)}
            </div>
            <div class="local">${v.empresa || '—'} • ${local}</div>
            <div class="stats">
              <span class="stat-mini">👥 <strong>${total}</strong> total</span>
              <span class="stat-mini">🔍 <strong>${emAnalise}</strong> em análise</span>
              ${contratados > 0 ? `<span class="stat-mini">✅ <strong>${contratados}</strong> contratado(s)</span>` : ''}
              ${reprovados > 0 ? `<span class="stat-mini">❌ <strong>${reprovados}</strong> reprovado(s)</span>` : ''}
            </div>
            <div class="card-rodape">
              <span class="btn-ver">👁 Ver candidatos</span>
            </div>
          </a>`;
        }).join('');
      } catch (e) {
        grid.innerHTML = '<div class="card"><div class="empty">Erro ao carregar: ' + e.message + '</div></div>';
      }
    }

  </script>
<script src="auth-helper.js?v=fase3_2026_07_28"></script>
  <script src="empresa-auth-init.js?v=fase3_2026_07_28"></script>
  <script src="empresa-auth-patch.js?v=fase3_2026_07_28"></script>

  <script>
    // ===== INIT COMUM FASE 3 — RBAC frontend =====
    (async function() {
      setStorageKeys('empresa_token', 'empresa_refresh', 'empresa_usuario');

      // tenta refresh silencioso antes de qualquer coisa
      try { await authInit(); } catch (e) { console.warn('refresh falhou', e); }

      // guard: sem token -> vai pro login
      if (!localStorage.getItem('empresa_token')) {
        const path = window.location.pathname;
        if (!path.endsWith('login.html')) {
          window.location.href = 'login.html';
          return;
        }
      }

      // aguarda DOM
      const onReady = () => {
        // mostra link Equipe se for admin
        if (authRBAC.hasRole('admin_empresa')) {
          const navEq = document.getElementById('nav-equipe');
          if (navEq) navEq.style.display = '';
        }

        // preenche sidebar com dados do JWT
        const u = authRBAC.currentUser() || {};
        const avatar = document.getElementById('avatar');
        const nome = document.getElementById('user-nome');
        const empresa = document.getElementById('user-empresa');
        if (avatar && u.nome) avatar.textContent = u.nome.split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
        if (nome) nome.textContent = u.nome || '—';
        if (empresa) empresa.textContent = (u.role ? '[' + u.role + '] ' : '') + (u.empresa_nome || u.email || '—');

        // guarda de role por pagina: se existe um atributo data-roles exigido,
        // fazemos o guard UX (apenas visual; backend é autoridade)
        const required = document.querySelector('main')?.dataset?.roles;
        if (required && !authRBAC.hasRole.apply(null, required.split(','))) {
          // redireciona com aviso
          const main = document.querySelector('main');
          if (main) main.innerHTML = '<div style="text-align:center; padding:80px 20px;"><h2 style="color:#999;">🚫 Acesso restrito</h2><p style="color:#666; margin-top:12px;">Você não tem permissão para acessar esta página.</p><p style="margin-top:24px;"><a href="index.html" style="color:#722F37;">← Voltar ao Dashboard</a></p></div>';
        }
        carregar();
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', onReady);
      } else {
        onReady();
      }
    })();
  </script>
<script src="chat-rh-flutuante.js?v=20260726b"></script>
<script src="empresa-shell.js?v=20260803shell3"></script>
</body>
</html>
