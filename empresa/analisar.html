    async function docBaixarUm(docId) {
      const d = _docsCache.find(x => x.id === docId);
      if (!d || !d.arquivo_url) { alert('Arquivo não disponível.'); return; }
      try {
        const candidaturaIdAtual = new URLSearchParams(location.search).get('id');
        const tokenAtual = getEmpresaToken();
        const proxyUrl = candidaturaIdAtual
          ? API + '/api/empresa/candidatura/' + encodeURIComponent(candidaturaIdAtual) + '/documentos/' + encodeURIComponent(docId) + '/arquivo'
          : null;
        if (!proxyUrl || !tokenAtual) throw new Error('Sessão expirada');
        const r = await fetch(proxyUrl, { headers: { 'Authorization': 'Bearer ' + tokenAtual } });
        if (!r.ok) throw new Error('Falha ao baixar');
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = d.arquivo_nome || ('documento_' + docId);
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } catch (e) {
        alert('Não foi possível baixar o arquivo. Verifique sua sessão e tente novamente.');
      }
    }

    // === BAIXAR TUDO NUM ÚNICO PDF (pdf-lib, 100% client-side) ===
    let _docPDFLibLoading = null;
    async function loadPDFLib() {
      if (window.PDFLib) return window.PDFLib;
      if (_docPDFLibLoading) return _docPDFLibLoading;
      _docPDFLibLoading = (async () => {
        const urls = [
          'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
          'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'
        ];
        for (const src of urls) {
          try {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = src;
              s.onload = resolve;
              s.onerror = reject;
              document.head.appendChild(s);
            });
            if (window.PDFLib) return window.PDFLib;
          } catch (_) {}
        }
        throw new Error('Não foi possível carregar o gerador de PDF. Verifique sua conexão e tente novamente.');
      })();
      return _docPDFLibLoading;
    }

    async function docBaixarTudo() {
      const arquivos = _docsCache.filter(d => d.arquivo_url && (d.categoria === 'arquivo' || d.arquivo_nome || d.arquivo_tipo));
      if (!arquivos.length) { alert('Nenhum arquivo pra baixar.'); return; }
      const btn = document.getElementById('btn-baixar-tudo-pdf');
      const origTxt = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Gerando PDF...'; }

      try {
        const { PDFDocument, StandardFonts, rgb } = await loadPDFLib();
        const out = await PDFDocument.create();
        const fontBold = await out.embedFont(StandardFonts.HelveticaBold);
        const fontNorm = await out.embedFont(StandardFonts.Helvetica);
        const fontItalic = await out.embedFont(StandardFonts.HelveticaOblique);
        const A4 = { w: 595.28, h: 841.89 };
        const margin = 40;

        const Vinho = rgb(0.42, 0.06, 0.10);
        const Texto = rgb(0.10, 0.10, 0.10);
        const Cinza = rgb(0.45, 0.45, 0.45);
        const CinzaClaro = rgb(0.92, 0.92, 0.92);
        const Verde = rgb(0.09, 0.64, 0.29);
        const Vermelho = rgb(0.86, 0.16, 0.16);
        const Branco = rgb(1, 1, 1);

        const txt = (str, maxW, font, size) => {
          const words = String(str || '').split(/\s+/);
          const linhas = []; let linha = '';
          for (const w of words) {
            const test = linha ? linha + ' ' + w : w;
            if (font.widthOfTextAtSize(test, size) > maxW && linha) { linhas.push(linha); linha = w; }
            else linha = test;
          }
          if (linha) linhas.push(linha);
          return linhas;
        };
        const safe = (s) => String(s || '').replace(/[\u0000-\u001F\u007F-\u00A0]/g, ' ');

        const cand = window.currentCandidatura || {};
        const candNome = cand.nome || 'Candidato';
        const candDoc = cand.cpf || '';
        const candVaga = cand.titulo || 'Vaga';

        // === Capa ===
        const capa = out.addPage([A4.w, A4.h]);
        capa.drawRectangle({ x: 0, y: A4.h - 120, width: A4.w, height: 120, color: Vinho });
        capa.drawText('Documentos de Contratação', { x: margin, y: A4.h - 60, size: 22, font: fontBold, color: Branco });
        capa.drawText(safe(candNome), { x: margin, y: A4.h - 95, size: 14, font: fontNorm, color: Branco });
        let yy = A4.h - 160;
        const labelInfo = [
          ['Vaga', candVaga],
          ['CPF', candDoc],
          ['Gerado em', new Date().toLocaleString('pt-BR')]
        ];
        for (const [k, v] of labelInfo) {
          capa.drawText(k + ':', { x: margin, y: yy, size: 11, font: fontBold, color: Vinho });
          capa.drawText(safe(v), { x: margin + 100, y: yy, size: 11, font: fontNorm, color: Texto });
          yy -= 20;
        }
        const totalKB = arquivos.reduce((acc, d) => acc + (d.arquivo_tamanho || 0), 0);
        capa.drawText('Total de arquivos: ' + arquivos.length + ' (' + (totalKB / 1024).toFixed(1) + ' KB)',
          { x: margin, y: yy, size: 10, font: fontItalic, color: Cinza });

        // === Uma página por documento ===
        for (let i = 0; i < arquivos.length; i++) {
          const doc = arquivos[i];
          const label = (_obrigatoriosDocs.find(o => o.tipo === doc.tipo) || {}).label || doc.tipo;
          if (btn) btn.textContent = '⏳ Processando ' + (i + 1) + '/' + arquivos.length + '...';

          try {
            // Baixa pelo proxy autenticado da API: evita bloqueio CORS dos
            // provedores de arquivo e garante que a empresa só acesse seu documento.
            const candidaturaIdAtual = new URLSearchParams(location.search).get('id');
            const tokenAtual = getEmpresaToken();
            const proxyUrl = candidaturaIdAtual && doc.id
              ? API + '/api/empresa/candidatura/' + encodeURIComponent(candidaturaIdAtual) + '/documentos/' + encodeURIComponent(doc.id) + '/arquivo'
              : doc.arquivo_url;
            const r = await fetch(proxyUrl, { headers: tokenAtual ? { 'Authorization': 'Bearer ' + tokenAtual } : {} });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const bytes = await r.arrayBuffer();
            let img = null;
            const isPdf = (doc.arquivo_nome || '').toLowerCase().endsWith('.pdf') || (doc.arquivo_url || '').toLowerCase().indexOf('.pdf') > -1;
            try {
              if (isPdf) {
                const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
                const pages = await out.copyPages(src, src.getPageIndices());
                pages.forEach(p => out.addPage(p));
              } else {
                img = await out.embedJpg(bytes).catch(async () => await out.embedPng(bytes));
                if (!img) throw new Error('formato não suportado');
                const pagina = out.addPage([A4.w, A4.h]);
                pagina.drawRectangle({ x: 0, y: A4.h - 50, width: A4.w, height: 50, color: Vinho });
                pagina.drawText((i + 1) + '. ' + safe(label), { x: margin, y: A4.h - 30, size: 13, font: fontBold, color: Branco });
                const maxW = A4.w - margin * 2, maxH = A4.h - 100;
                const ratio = Math.min(maxW / img.width, maxH / img.height);
                const w = img.width * ratio, h = img.height * ratio;
                const x = (A4.w - w) / 2;
                const yImg = (A4.h - 50 - h) / 2;
                pagina.drawImage(img, { x, y: yImg, width: w, height: h });
              }
            } catch (innerErr) {
              const errPage = out.addPage([A4.w, A4.h]);
              errPage.drawText('Atenção: Não foi possível incorporar:', { x: margin, y: A4.h - 60, size: 12, font: fontBold, color: Vermelho });
              errPage.drawText(safe(label) + ' (' + safe(doc.arquivo_nome || doc.tipo) + ')',
                { x: margin, y: A4.h - 80, size: 10, font: fontNorm, color: Texto });
              errPage.drawText('Link original:', { x: margin, y: A4.h - 110, size: 9, font: fontBold, color: Cinza });
              const linhas = txt(safe(doc.arquivo_url), A4.w - margin * 2, fontNorm, 8);
              linhas.forEach((linha, idx) => {
                errPage.drawText(linha, { x: margin, y: A4.h - 125 - idx * 10, size: 8, font: fontNorm, color: Cinza });
              });
            }
          } catch (e) {
            console.error('Erro ao processar doc', doc.tipo, e);
          }
        }

        // === Sumário no final ===
        const sumario = out.addPage([A4.w, A4.h]);
        sumario.drawRectangle({ x: 0, y: A4.h - 50, width: A4.w, height: 50, color: Vinho });
        sumario.drawText('Sumário', { x: margin, y: A4.h - 30, size: 14, font: fontBold, color: Branco });
        let sy = A4.h - 90;
        arquivos.forEach((a, i) => {
          if (sy < margin + 40) return;
          const label = (_obrigatoriosDocs.find(o => o.tipo === a.tipo) || {}).label || a.tipo;
          const statusTxt = a.status === 'aprovado' ? '✓ aprovado' : a.status === 'retornado' ? '📨 a reenviar' : a.status === 'reprovado' ? '✗ reprovado' : '⏳ pendente';
          const cor = a.status === 'aprovado' ? Verde : a.status === 'reprovado' ? Vermelho : Cinza;
          sumario.drawText((i + 1) + '.', { x: margin, y: sy, size: 11, font: fontBold, color: Texto });
          sumario.drawText(safe(label), { x: margin + 25, y: sy, size: 11, font: fontNorm, color: Texto });
          sumario.drawText(statusTxt, { x: margin + 350, y: sy, size: 10, font: fontBold, color: cor });
          sy -= 18;
          if (a.justificativa_admin) {
            const linhas = txt('"' + safe(a.justificativa_admin) + '"', A4.w - margin * 2, fontItalic, 9);
            linhas.slice(0, 2).forEach((l, idx) => {
              sumario.drawText(l, { x: margin + 25, y: sy - idx * 11, size: 9, font: fontItalic, color: Cinza });
            });
            sy -= 24;
          } else {
            sy -= 4;
          }
        });

        const pdfBytes = await out.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const nomeArq = 'documentos_' + (candNome || 'candidato').replace(/[^\w]+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
        a.download = nomeArq;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        if (btn) { btn.disabled = false; btn.textContent = origTxt || '📥 Baixar tudo (PDF)'; }
      } catch (e) {
        console.error(e);
        alert('Erro ao gerar PDF: ' + e.message);
        if (btn) { btn.disabled = false; btn.textContent = origTxt || '📥 Baixar tudo (PDF)'; }
      }
    }

    function atualizarBotaoAprovarTudo() {
      const btn = document.getElementById('btn-aprovar-tudo');
      if (!btn) return;
      const stats = window._docsStatsCache || {};
      // Libera quando: todos enviados E nenhum retornado/reprovado pendente
      // (pendentes são aprovados direto pela ação global, sem precisar revisar 1 a 1)
      const podeAprovar = stats.total > 0
        && stats.enviados === stats.total
        && stats.retornados === 0
        && stats.reprovados === 0;
      if (podeAprovar) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
        btn.textContent = stats.aprovados === stats.total
          ? '✅ Aprovar tudo e avançar etapa'
          : `✅ Aprovar ${stats.total} doc(s) e avançar etapa`;
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
        const falta = (stats.pendentes || 0) + (stats.retornados || 0) + (stats.reprovados || 0);
        const faltaTexto = stats.enviados < stats.total
          ? `Faltam ${stats.total - stats.enviados} documento(s) a enviar`
          : `${falta} pendente(s) de aprovação`;
        btn.textContent = '🔒 ' + faltaTexto;
      }
    }

    async function retornarDocumento(docId) {
      const doc = _docsCache.find(d => d.id === docId);
      const label = doc ? (doc.tipo || '') : 'este documento';
      const msg = prompt(
        'Retornar "' + label + '" para o candidato?\n\n' +
        'Escreva uma mensagem personalizada explicando o que precisa ser corrigido. ' +
        'O candidato será notificado e poderá reenviar o documento.',
        ''
      );
      if (msg === null) return; // cancelou
      if (!msg.trim()) {
        alert('A mensagem é obrigatória para retornar o documento.');
        return;
      }
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/documento/' + docId + '/revisar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ acao: 'retornar', justificativa: msg.trim() })
        });
        const data = await r.json();
        if (!r.ok) { alert('Erro: ' + (data.erro || 'Falha ao retornar')); return; }
        // Atualiza cache local
        const idx = _docsCache.findIndex(d => d.id === docId);
        if (idx >= 0) {
          _docsCache[idx] = { ..._docsCache[idx], status: (data.documento && data.documento.status) || 'retornado', justificativa_admin: msg.trim(), revisado_em: new Date().toISOString() };
        }
        // Re-renderiza a seção
        const card = document.getElementById('card-documentos');
        if (card) {
          const novaHtml = renderizarDocumentos();
          card.querySelector('.doc-lista-wrapper').innerHTML = novaHtml;
          atualizarDocsCount();
        }
        alert('Documento retornado. O candidato será notificado e poderá reenviar.');
      } catch (e) {
        alert('Erro: ' + escapeHtml(e.message || 'Erro interno'));
      }
    }

    async function revisarDocumento(docId, acao) {
      // Apenas "reverter" (voltar pra pendente) — aprovar/reprovar agora são via ação global
      if (acao === 'reverter') {
        if (!confirm('Reverter este documento para status pendente?')) return;
      } else {
        return;
      }
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/documento/' + docId + '/revisar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ acao })
        });
        const data = await r.json();
        if (!r.ok) { alert('Erro: ' + (data.erro || 'Falha ao revisar')); return; }
        const idx = _docsCache.findIndex(d => d.id === docId);
        if (idx >= 0) {
          _docsCache[idx] = { ..._docsCache[idx], status: 'pendente', justificativa_admin: null, revisado_em: new Date().toISOString() };
        }
        const card = document.getElementById('card-documentos');
        if (card) {
          card.querySelector('.doc-lista-wrapper').innerHTML = renderizarDocumentos();
          atualizarDocsCount();
        }
      } catch (e) {
        alert('Erro: ' + escapeHtml(e.message || 'Erro interno'));
      }
    }

    // === AÇÃO GLOBAL: aprovar tudo e avançar etapa ===
    async function aprovarTodosEAvancar() {
      const stats = window._docsStatsCache || {};
      if (!stats.total) return alert('Nenhum documento configurado para esta vaga.');
      if (stats.enviados < stats.total) {
        return alert('O candidato ainda não enviou todos os documentos. Faltam ' + (stats.total - stats.enviados) + '.');
      }
      if (stats.retornados > 0) {
        return alert('Há ' + stats.retornados + ' documento(s) marcado(s) como "a reenviar". Aguarde o candidato reenviar antes de aprovar.');
      }
      if (stats.reprovados > 0) {
        return alert('Há ' + stats.reprovados + ' documento(s) reprovado(s) que o candidato precisa reenviar antes da aprovação final.');
      }
      if (!confirm('Aprovar TODOS os documentos e avançar para a próxima etapa?\n\n' +
                   'Esta ação não pode ser desfeita. O candidato será notificado de que avançou no processo.')) {
        return;
      }
      const token = localStorage.getItem('empresa_token');
      const id = new URLSearchParams(location.search).get('id');
      const btn = document.getElementById('btn-aprovar-tudo');
      if (btn) { btn.disabled = true; btn.textContent = 'Aprovando...'; }
      try {
        const r = await fetch(API + '/api/empresa/candidatura/' + id + '/aprovar-documentos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({})
        });
        const data = await r.json();
        if (!r.ok) { alert('Erro: ' + (data.erro || 'Falha ao aprovar')); if (btn) { btn.disabled = false; btn.textContent = '✅ Aprovar tudo e avançar etapa'; } return; }
        const msg = data.contratados
          ? '🎉 Documentos aprovados! Candidato CONTRATADO com sucesso.'
          : '✅ Documentos aprovados! Candidato avançou para a etapa ' + data.novaEtapa + '/' + data.totalEtapas + '.';
        alert(msg);
        // Recarrega a página pra mostrar a timeline atualizada
        location.reload();
      } catch (e) {
        alert('Erro: ' + escapeHtml(e.message || 'Erro interno'));
        if (btn) { btn.disabled = false; btn.textContent = '✅ Aprovar tudo e avançar etapa'; }
      }
    }

    // === AÇÃO GLOBAL: Aprovar TUDO e avançar etapa ===
    async function aprovarTodosEAvancar() {
      const stats = window._docsStatsCache || {};
      if (stats.retornados > 0) {
        return alert('Há ' + stats.retornados + ' documento(s) marcado(s) como "a reenviar". Aguarde o candidato reenviar antes de aprovar.');
      }
      if (stats.reprovados > 0) {
        return alert('Há ' + stats.reprovados + ' documento(s) reprovado(s). Reverter para pendente antes de aprovar.');
      }
      if (stats.aprovados < stats.total) {
        return alert('Apenas ' + stats.aprovados + '/' + stats.total + ' documentos aprovados.');
      }
      if (!confirm('Confirmar a aprovação de TODOS os ' + stats.total + ' documentos e avançar a etapa do candidato?')) return;

      const btn = document.getElementById('btn-aprovar-tudo');
      const id = new URLSearchParams(location.search).get('id');
      if (btn) { btn.disabled = true; btn.textContent = 'Aprovando...'; }
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/candidatura/' + id + '/aprovar-documentos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
        });
        const data = await r.json();
        if (!r.ok) { alert('Erro: ' + (data.erro || 'Falha ao aprovar')); if (btn) { btn.disabled = false; btn.textContent = '✅ Aprovar tudo e avançar etapa'; } return; }
        const msg = data.contratados
          ? '🎉 Documentos aprovados! Candidato CONTRATADO com sucesso.'
          : '✅ Documentos aprovados! Candidato avançou para a etapa ' + data.novaEtapa + '/' + data.totalEtapas + '.';
        alert(msg);
        location.reload();
      } catch (e) {
        alert('Erro: ' + escapeHtml(e.message || 'Erro interno'));
        if (btn) { btn.disabled = false; btn.textContent = '✅ Aprovar tudo e avançar etapa'; }
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }
    function safeUrl(value) {
      try {
        const url = new URL(String(value || ''), window.location.origin);
        return ['http:', 'https:'].includes(url.protocol) ? escapeHtml(url.href) : '';
      } catch (_) { return ''; }
    }
    // ====== Modal de Proposta (etapa 5) ======
    let _propostaCandId = null;
    function abrirModalProposta(candidaturaId) {
      _propostaCandId = candidaturaId;
      document.getElementById('modal-proposta').classList.add('aberto');
      // Limpa
      document.getElementById('proposta-texto').value = '';
      document.getElementById('proposta-pdf').value = '';
      const status = document.getElementById('proposta-status');
      if (status) status.textContent = '';
    }
    function fecharModalProposta() {
      document.getElementById('modal-proposta').classList.remove('aberto');
    }
    async function enviarProposta() {
      if (!_propostaCandId) return;
      const texto = document.getElementById('proposta-texto').value.trim();
      const fileInput = document.getElementById('proposta-pdf');
      const file = fileInput.files[0];
      if (!texto && !file) {
        alert('Digite o texto da proposta OU anexe um PDF.');
        return;
      }
      const btn = document.querySelector('#modal-proposta .btn-enviar-proposta');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }
      const status = document.getElementById('proposta-status');
      if (status) status.textContent = 'Enviando proposta...';
      try {
        let pdfUrl = null;
        if (file) {
          if (file.type !== 'application/pdf' || file.size > 6 * 1024 * 1024) {
            alert('Apenas arquivos PDF de até 6 MB são aceitos.');
            if (btn) { btn.disabled = false; btn.textContent = '📨 Enviar Proposta'; }
            return;
          }
          // Converte para base64 (data URL)
          pdfUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }
        const r = await fetch(API + '/api/empresa/candidatura/' + _propostaCandId + '/proposta', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('empresa_token'), 'Content-Type': 'application/json' },
          body: JSON.stringify({ texto, pdf_url: pdfUrl, pdf_nome: file ? file.name : null })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.erro || 'Erro ao enviar');
        if (status) status.innerHTML = '✅ Proposta enviada! Recarregando...';
        setTimeout(() => { location.reload(); }, 1200);
      } catch (e) {
        if (status) status.textContent = '❌ ' + e.message;
        if (btn) { btn.disabled = false; btn.textContent = '📨 Enviar Proposta'; }
      }
    }
  </script>

  <!-- Modal de Proposta -->
  <div id="modal-proposta" class="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px">
    <div class="modal-content" style="background:white;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,0.3)">
      <div style="padding:20px;border-bottom:1px solid #EEE;display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0;color:var(--vinho);font-size:20px">📨 Enviar Proposta</h2>
        <button onclick="fecharModalProposta()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999">×</button>
      </div>
      <div style="padding:24px">
        <p style="color:#666;margin-bottom:16px;font-size:14px">A proposta será enviada ao candidato. Quando ele aceitar, a candidatura avança automaticamente para a etapa <strong>Coleta de Documentos</strong>. Se recusar, a candidatura é finalizada como reprovada.</p>

        <label style="display:block;font-weight:600;margin-bottom:6px;color:#333">Texto da proposta *</label>
        <textarea id="proposta-texto" rows="6" placeholder="Ex: Estamos oferecendo R$ 5.000 + benefícios (VR, VT, plano de saúde). Data de início: 01/09/2026..." style="width:100%;padding:12px;border:1px solid #DDD;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical"></textarea>

        <label style="display:block;font-weight:600;margin:16px 0 6px;color:#333">📄 PDF da proposta (opcional)</label>
        <input type="file" id="proposta-pdf" accept="application/pdf" style="width:100%;padding:8px;border:1px solid #DDD;border-radius:8px;font-size:13px">
        <small style="color:#888;display:block;margin-top:4px">Se anexar, o candidato também poderá baixar o PDF.</small>

        <div id="proposta-status" style="margin-top:12px;font-size:14px;color:#666"></div>

        <div style="display:flex;gap:8px;margin-top:20px;justify-content:flex-end">
          <button onclick="fecharModalProposta()" style="padding:10px 18px;background:#EEE;border:none;border-radius:6px;cursor:pointer;font-weight:500">Cancelar</button>
          <button class="btn-enviar-proposta" onclick="enviarProposta()" style="padding:10px 18px;background:#7C3AED;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600">📨 Enviar Proposta</button>
        </div>
      </div>
    </div>
  </div>
  <style>
    #modal-proposta.aberto { display: flex !important; }
  </style>
</body>
</html>
