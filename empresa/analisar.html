<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Analisar Candidato — Portal Empresa</title>
  <style>
    :root { --vinho:#6B0F1A; --vinho-claro:#8B1A2B; --cinza:#F5F5F5; --cinza-medio:#999; --cinza-escuro:#2A2A2A; --branco:#fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--cinza); color: var(--cinza-escuro); padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { background: var(--branco); padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; position: relative; }
    .header .btn-voltar { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--cinza-medio); color: var(--cinza-escuro); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
    .header .btn-voltar:hover { background: var(--cinza); border-color: var(--vinho); color: var(--vinho); }
    .header .btn-voltar svg { width: 18px; height: 18px; }
    .header h1 { color: var(--vinho); font-size: 24px; margin-bottom: 4px; padding-left: 110px; }
    .header .sub { color: var(--cinza-medio); font-size: 14px; padding-left: 110px; }
    .status-pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-top: 8px; }
    .status-em_andamento { background: #FFF4E5; color: #B45309; }
    .status-aprovado { background: #E5F8E5; color: #166534; }
    .status-reprovado { background: #FEE2E2; color: #991B1B; }
    .status-contratado { background: #DBEAFE; color: #1E40AF; }
    .card { background: var(--branco); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
    .card h2 { font-size: 16px; color: var(--vinho); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--cinza); }

    /* === Accordion (cards colapsáveis) === */
    .card-colapsavel > .card-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
      margin: -20px -20px 0 -20px; padding: 16px 20px;
      border-bottom: 1px solid var(--cinza);
      border-radius: 12px 12px 0 0;
      transition: background 0.15s;
    }
    .card-colapsavel > .card-header:hover { background: #faf7f0; }
    .card-colapsavel > .card-header h2 { margin: 0; padding: 0; border: none; flex: 1; min-width: 0; }
    /* h2 com conteúdo flexível (ex: título + botão de ação) */
    .card-colapsavel > .card-header h2.flex { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .card-colapsavel > .card-header .card-toggle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #f1ecdf; color: var(--vinho);
      font-size: 14px; transition: background 0.15s, color 0.15s;
      flex-shrink: 0; margin-left: 12px; padding: 0;
    }
    .card-colapsavel > .card-header .card-toggle svg { display: none; }
    .card-colapsavel > .card-header .card-toggle .chevron-baixo { display: block; }
    .card-colapsavel > .card-header .card-toggle .chevron-cima { display: none; }
    .card-colapsavel.aberto > .card-header .card-toggle {
      background: var(--dourado); color: var(--cinza-escuro);
    }
    .card-colapsavel.aberto > .card-header .card-toggle .chevron-baixo { display: none; }
    .card-colapsavel.aberto > .card-header .card-toggle .chevron-cima { display: block; }
    .card-colapsavel > .card-body {
      max-height: 0; overflow: hidden; transition: max-height 0.35s ease;
    }
    .card-colapsavel.aberto > .card-body { max-height: 5000px; }
    .card-colapsavel.aberto > .card-header { border-radius: 12px 12px 0 0; }
    .dados-pessoais-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--cinza); }
    .dados-pessoais-header h2 { margin: 0; padding: 0; border: none; }
    .dados-foto { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--cinza-claro); }
    .dados-foto-vazia { display: inline-flex; align-items: center; justify-content: center; font-size: 22px; color: var(--cinza-medio); border: 1px solid var(--cinza); }
    .exp-lista { display: flex; flex-direction: column; gap: 10px; }
    .exp-item-admin { display: flex; gap: 12px; padding: 12px 14px; border-left: 3px solid var(--vinho); background: #FAFAFA; border-radius: 4px; }
    .exp-item-num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--vinho); color: white; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
    .exp-item-corpo { flex: 1; min-width: 0; }
    .exp-item-titulo { font-size: 14px; color: var(--preto); margin-bottom: 2px; }
    .exp-item-periodo { font-size: 12px; color: var(--cinza-medio); margin-bottom: 4px; }
    .exp-item-desc { font-size: 13px; color: #444; margin-top: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { font-size: 14px; }
    .field-label { color: var(--cinza-medio); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .field-value { color: var(--cinza-escuro); font-size: 15px; font-weight: 500; }
    .timeline { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; }
    .etapa { flex: 1; min-width: 110px; padding: 10px 12px; border-radius: 8px; background: #F0F0F0; color: #BBB; font-size: 12px; text-align: center; position: relative; }
    .etapa.concluida { background: #DCFCE7; color: #166534; }
    .etapa.atual { background: var(--vinho); color: var(--branco); font-weight: 600; }
    .etapa .num { font-size: 11px; opacity: 0.8; margin-bottom: 2px; }
    .acoes { display: flex; gap: 12px; padding: 20px; background: var(--branco); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    /* Filial/viewer é estritamente leitura: não apresentar controles acionáveis. */
    body.viewer-readonly button:not(.btn-voltar), body.viewer-readonly form button { display: none !important; }
    .aviso-etapa { flex: 1; text-align: center; color: var(--cinza-medio); font-size: 14px; padding: 12px; background: #F9F6F0; border-radius: 8px; border-left: 3px solid var(--vinho-claro); }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-aprovar { background: #16A34A; color: white; }
    .btn-aprovar:hover { background: #15803D; }
    .btn-reprovar { background: #DC2626; color: white; }
    .btn-reprovar:hover { background: #B91C1C; }
    .btn-reabrir { background: var(--cinza-escuro); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .aviso-bloq { width: 100%; margin-top: 10px; padding: 10px 12px; background: var(--amarelo-bg); color: var(--amarelo); border-radius: 6px; font-size: 13px; border: 1px solid var(--amarelo); }
    .empty { text-align: center; padding: 40px; color: var(--cinza-medio); }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid var(--vinho); border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
    .alert-erro { background: #FEE2E2; color: #991B1B; }
    .alert-sucesso { background: #DCFCE7; color: #166534; }
    .hist-item { padding: 10px; border-left: 3px solid var(--vinho); margin-bottom: 8px; background: #FAFAFA; font-size: 13px; }
    .hist-item small { color: var(--cinza-medio); }
    .badge-etapa { display: inline-block; background: var(--vinho); color: white; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    a { color: var(--vinho); }

    /* ===== Documentos ===== */
    .doc-lista { display: grid; gap: 10px; }
    .doc-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--cinza); border-radius: 10px; background: #FAFAFA; }
    .doc-row.status-aprovado { border-color: #16A34A; background: #F0FDF4; }
    .doc-row.status-reprovado { border-color: #DC2626; background: #FEF2F2; }
    .doc-info { flex: 1; min-width: 0; }
    .doc-tipo { font-size: 14px; font-weight: 600; color: var(--cinza-escuro); }
    .doc-valor { font-size: 13px; color: var(--cinza-medio); margin-top: 2px; word-break: break-all; }
    .doc-valor a { color: var(--vinho); text-decoration: underline; }
    .doc-pendente { font-size: 12px; color: var(--cinza-medio); font-style: italic; }
    .doc-justificativa { font-size: 12px; color: #991B1B; margin-top: 4px; font-style: italic; }
    .doc-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .doc-badge-pendente { background: #FEF3C7; color: #92400E; }
    .doc-badge-aprovado { background: #DCFCE7; color: #166534; }
    .doc-badge-reprovado { background: #FEE2E2; color: #991B1B; }
    .doc-badge-vazio { background: var(--cinza); color: var(--cinza-medio); }
    .doc-acoes { display: flex; gap: 6px; flex-shrink: 0; }
    .doc-btn { padding: 6px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
    .doc-btn-aprovar { background: #16A34A; color: white; }
    .doc-btn-aprovar:hover { background: #15803D; }
    .doc-btn-baixar { background: #2563EB; color: white; }
    .doc-btn-baixar:hover { background: #1D4ED8; }
    .doc-btn-reprovar { background: #DC2626; color: white; }
    .doc-btn-reprovar:hover { background: #B91C1C; }
    .doc-btn-retornar { background: #EA580C; color: white; }
    .doc-btn-retornar:hover { background: #C2410C; }
    .doc-btn-reverter { background: var(--cinza-medio); color: white; }
    .doc-btn-reverter:hover { background: var(--cinza-escuro); }
    @media (max-width: 700px) {
      body { padding: 12px; }
      .header { padding: 16px; }
      .header .btn-voltar { position: static; transform: none; margin-bottom: 12px; }
      .header h1, .header .sub { padding-left: 0; }
      .header h1 { font-size: 20px; }
      .grid-2 { grid-template-columns: 1fr; }
      .acoes { flex-direction: column; padding: 14px; }
      .acoes .btn { width: 100%; }
      .doc-row { align-items: flex-start; flex-wrap: wrap; }
      .doc-acoes { width: 100%; }
      .doc-acoes .doc-btn { flex: 1; }
      .card { padding: 16px; }
      .card-colapsavel > .card-header { margin: -16px -16px 0; padding: 14px 16px; }
    }
  </style>

  <script>
    // Deep links continuam funcionando, mas entram no shell do Portal Empresa.
    // Com embed=1 o documento permanece exatamente nesta página, dentro do iframe.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (window.top === window.self && params.get('embed') !== '1' && /^\d+$/.test(String(id || ''))) {
        window.location.replace('index.html?page=analisar&candidatura_id=' + encodeURIComponent(id));
      }
    })();
  </script>

<body>
  <div class="container">
    <div id="content">
      <div class="card"><div class="empty"><div class="spinner"></div>Carregando...</div></div>
    </div>
  </div>

<script>
  // A análise roda dentro de um iframe do Portal Empresa. Ela usa somente o
  // access token já mantido pelo shell no mesmo domínio. Não carregamos aqui
  // os scripts globais de refresh: eles podem disputar a primeira consulta
  // do iframe e prender a tela no spinner em navegadores móveis.
  function getEmpresaToken() {
    try { return localStorage.getItem('empresa_token') || ''; } catch (_) { return ''; }
  }
  // Role is signed in the JWT by login-empresa. Never use a client role to
  // authorize requests; this is only presentation (the API remains authoritative).
  function getEmpresaRole() {
    try {
      const p = getEmpresaToken().split('.')[1];
      if (!p) return '';
      return JSON.parse(atob(p.replace(/-/g, '+').replace(/_/g, '/'))).role || '';
    } catch (_) { return ''; }
  }
  window.__empresaRole = getEmpresaRole();
  if (window.__empresaRole === 'viewer') document.body.classList.add('viewer-readonly');
</script>
  <script>
    const API = window.VAGASIO_API_BASE;
    function entrarVideoEmpresa(id) { sessionStorage.setItem('vagasio_video_interview_id', String(id)); sessionStorage.setItem('vagasio_video_other_name', String(window.__activeCandidateName || 'Candidato')); location.href = 'video-call.html'; }
    async function fetchEmpresaComTimeout(url, options = {}, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    // Accordion: expandir/recolher card colapsável
    function toggleCard(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle('aberto');
      // Salva estado pra não recolher toda hora no F5
      try {
        const aberto = el.classList.contains('aberto');
        localStorage.setItem('card_' + id, aberto ? '1' : '0');
      } catch (e) {}
    }

    // Restaura estado dos cards colapsáveis. Alguns cards são criados
    // dinamicamente depois do DOMContentLoaded, por isso esta função também
    // é chamada após a renderização da candidatura.
    function restaurarEstadoCards() {
      document.querySelectorAll('.card-colapsavel').forEach(el => {
        try {
          const salvo = localStorage.getItem('card_' + el.id);
          el.classList.toggle('aberto', salvo === '1');
        } catch (e) {}
      });
    }
    document.addEventListener('DOMContentLoaded', restaurarEstadoCards);

    function voltar() {
      // Dentro do SPA, retorna para a origem real registrada pelo shell.
      if (window.top !== window.self) {
        const topWin = window.top;
        const topParams = new URLSearchParams(topWin.location.search);
        const origem = topParams.get('voltar_para') || 'candidatos';
        const vagaId = topParams.get('voltar_vaga_id');
        if (origem === 'candidatos-vaga' && vagaId && typeof topWin.abrirVagaCands === 'function') {
          topWin.history.replaceState(null, '', 'index.html?page=candidaturas');
          topWin.abrirVagaCands(vagaId);
        } else if (typeof topWin.irPara === 'function' && ['dashboard','vagas','candidatos','candidaturas','propostas','contratacoes','talentos','relatorios','agenda','equipe','configuracoes'].includes(origem)) {
          topWin.history.replaceState(null, '', 'index.html?page=' + encodeURIComponent(origem));
          topWin.irPara(origem, { keepQuery: true });
        } else {
          topWin.location.href = 'index.html?page=candidatos';
        }
        return;
      }
      // Mantém o comportamento original quando a página for aberta isoladamente.
      if (document.referrer && document.referrer.includes(location.host)) history.back();
      else location.href = 'index.html';
    }

    (async () => {
      const content = document.getElementById('content');
      const token = getEmpresaToken();
      if (!token) {
        content.innerHTML = '<div class="card"><div class="alert alert-erro">Você não está logado. <a href="login.html">Faça login</a> primeiro.</div></div>';
        return;
      }

      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        content.innerHTML = '<div class="card"><div class="alert alert-erro">ID da candidatura não informado.</div></div>';
        return;
      }

      let candidatura; window.__activeCandidateName = 'Candidato';
      try {
        const request = { headers: { 'Authorization': 'Bearer ' + token }, __native: true };
        const r = await fetchEmpresaComTimeout(API + '/api/empresa/candidatura/' + id, request);
        if (r.status === 401 || r.status === 403) {
          content.innerHTML = '<div class="card"><div class="alert alert-erro">Sessão expirada. <a href="login.html" target="_top">Faça login</a> novamente.</div></div>';
          return;
        }
        const data = await r.json();
        if (!r.ok) {
          content.innerHTML = '<div class="card"><div class="alert alert-erro">' + escapeHtml(data.erro || 'Erro ao carregar') + '</div></div>';
          return;
        }
        candidatura = data.candidatura || data; window.__activeCandidateName = candidatura?.candidato?.nome || candidatura?.nome || candidatura?.candidato_nome || 'Candidato';
        // Garante que a entrevista persista no primeiro render após F5,
        // mesmo quando a resposta principal vier sem o array completo.
        try {
          const er = await fetchEmpresaComTimeout(API + '/api/empresa/candidatura/' + id + '/entrevistas', request);
          if (er.ok) {
            const ed = await er.json();
            candidatura.entrevistas = ed.entrevistas || candidatura.entrevistas || [];
          }
        } catch (_) { /* a renderização principal continua disponível */ }
      } catch (e) {
        content.innerHTML = '<div class="card"><div class="alert alert-erro">Erro: ' + escapeHtml(e.message || 'Erro interno') + '</div></div>';
        return;
      }

      // Carrega documentos se estiver na fase de coleta (índice 6 = Coleta Documentos)
      // ou após (índice 7 = Contratação). Para vagas menores, ajusta abaixo.
      const etapaNum = Number(candidatura.etapa_atual || 0);
      let docsCard = '';
      let etapasCandidatura = candidatura.etapas;
      if (typeof etapasCandidatura === 'string') {
        try { etapasCandidatura = JSON.parse(etapasCandidatura); } catch (_) { etapasCandidatura = []; }
      }
      etapasCandidatura = Array.isArray(etapasCandidatura) ? etapasCandidatura : [];
      // Só consulta documentos quando a vaga realmente possui uma etapa de
      // coleta. Sem etapas configuradas, dados de teste não podem bloquear a tela.
      const idxColetaEsperado = etapasCandidatura.length ? etapasCandidatura.length - 2 : Infinity;
      if (etapasCandidatura.length && etapaNum >= idxColetaEsperado) {
        try {
          await carregarDocumentos(id);
          if (_obrigatoriosDocs.length) {
            docsCard = '<div class="card card-colapsavel" id="card-documentos">' +
              '<div class="card-header" onclick="toggleCard(\'card-documentos\')">' +
                '<h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0">' +
                  '<span>📄 Documentos de Contratação <span id="docs-count-header" style="font-size:12px;color:var(--cinza-medio);font-weight:400;margin-left:8px"></span></span>' +
                '</h2>' +
                '<span class="card-toggle">' +
                  '<svg class="chevron-baixo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
                  '<svg class="chevron-cima" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="6 15 12 9 18 15"></polyline></svg>' +
                '</span>' +
              '</div>' +
              '<div class="card-body">' +
                '<div id="docs-resumo" style="font-size:13px;color:var(--cinza-medio);line-height:1.7;padding:14px 0;border-bottom:1px solid var(--cinza);margin-bottom:14px">' +
                  '<strong style="color:var(--vinho);font-size:14px">Resumo:</strong> ' +
                  '<span id="docs-count-line">0/16 enviados</span> · ' +
                  '<span style="color:#16A34A">● <span id="docs-count-aprov">0</span> aprovados</span> · ' +
                  '<span style="color:#EAB308">● <span id="docs-count-reenv">0</span> a reenviar</span> · ' +
                  '<span style="color:#DC2626">● <span id="docs-count-repr">0</span> reprovados</span> · ' +
                  '<span style="color:var(--cinza-medio)">● <span id="docs-count-pend">16</span> pendentes</span>' +
                '</div>' +
                '<p style="font-size:13px;color:var(--cinza-medio);margin-bottom:14px">Use os botões em cada documento para <strong>aprovar</strong>, <strong>retornar</strong> (com mensagem ao candidato) ou <strong>baixar</strong> individualmente. Quando <strong>todos</strong> estiverem aprovados, clique no botão abaixo para avançar a etapa de uma vez.</p>' +
                '<div class="doc-lista-wrapper" id="doc-lista-wrapper">' + renderizarDocumentos() + '</div>' +
                '<div style="margin-top:18px;padding-top:18px;border-top:1px solid var(--cinza);display:flex;gap:10px;flex-wrap:wrap">' +
                  '<button id="btn-aprovar-tudo" class="btn" style="background:#16A34A;color:white;font-size:15px;padding:14px 20px;flex:1;min-width:200px" onclick="aprovarTodosEAvancar()">✅ Aprovar tudo e avançar etapa</button>' +
                  '<button id="btn-baixar-tudo-pdf" class="btn" style="background:var(--dourado);color:var(--cinza-escuro);font-size:15px;padding:14px 20px;flex:1;min-width:200px" onclick="docBaixarTudo()">📥 Baixar tudo (PDF único)</button>' +
                  '<p style="font-size:12px;color:var(--cinza-medio);margin-top:8px;text-align:center;width:100%">O botão "Aprovar tudo" só fica disponível quando todos os documentos estiverem aprovados.</p>' +
                '</div>' +
              '</div>' +
            '</div>';
          }
          // Atualiza contador no header (X/Y aprovados)
          setTimeout(atualizarDocsCount, 0);
        } catch (e) {
          console.error('Erro ao carregar documentos:', e);
        }
      }
      try {
        render(candidatura, docsCard);
      } catch (e) {
        console.error('Erro ao renderizar análise:', e);
        content.innerHTML = '<div class="card"><div class="alert alert-erro">Não foi possível montar os detalhes deste candidato. ' + escapeHtml(e.message || 'Verifique os dados da candidatura.') + '</div></div>';
        return;
      }
      window.currentCandidatura = candidatura;
      carregarEntrevistasExistentes(id);
      // Reaplica estado dos accordions (cards podem ter sido criados dinâmicamente)
      restaurarEstadoCards();
      // Chat agora é via bolinha flutuante — sem polling embutido
    })();

    // Carrega entrevistas já existentes e pré-popula o card (modo edição/confirmação)
    async function carregarEntrevistasExistentes(candidaturaId) {
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/candidatura/' + candidaturaId + '/entrevistas', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!r.ok) return;
        const data = await r.json();
        const entrevistas = data.entrevistas || [];
        if (entrevistas.length === 0) return;

        // Pega a mais recente que ainda está agendada (status='agendada')
        const ativa = entrevistas.find(e => e.status === 'agendada') || entrevistas[0];
        // Converte data_hora pra formato do input datetime-local (YYYY-MM-DDTHH:MM)
        const d = new Date(ativa.data_hora);
        const pad = n => String(n).padStart(2, '0');
        const dataLocal = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                          'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());

        const card = document.getElementById('card-agendamento-entrevista');
        if (!card) return;

        const dataFmt = d.toLocaleString('pt-BR', {
          weekday: 'long', day: '2-digit', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

        card.outerHTML =
          '<div class="card" id="card-agendamento-entrevista" style="border-top: 4px solid #16A34A; background: #F0FDF4;">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
              '<h2 style="margin:0; color:#166534;">✅ Entrevista Agendada</h2>' +
              '<div style="display:flex; gap:8px;">' +
                '<button class="btn" style="background:#FFF; color:#166534; border:1px solid #16A34A;" onclick="editarEntrevista(' + JSON.stringify(ativa).replace(/"/g, '&quot;') + ')">✏️ Editar</button>' +
                '<button class="btn" style="background:#FFF; color:#991B1B; border:1px solid #DC2626;" onclick="cancelarEntrevista(' + ativa.id + ')">🗑️ Cancelar</button>' +
              '</div>' +
            '</div>' +
            '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; font-size:14px;">' +
              '<div><strong style="color:#166534;">📅 Data e Hora:</strong><br>' + dataFmt + '</div>' +
              '<div><strong style="color:#166534;">📍 Local:</strong><br>' + escapeHtml(ativa.local || '—') + '</div>' +
              (ativa.video_room_id || ativa.video_provider === 'vagasio' ? '<div style="grid-column: 1 / -1; margin-top:4px; padding:12px; background:#FFF; border:1px solid #BBF7D0; border-radius:8px;"><strong style="color:#166534;">🎥 Videochamada VagasIO</strong><br><button type="button" onclick="entrarVideoEmpresa(' + ativa.id + ')" style="margin-top:8px; padding:10px 16px; background:#16A34A; color:white; border:0; border-radius:6px; font-weight:600; cursor:pointer;">Entrar na videochamada VagasIO</button></div>' : '') +
            '</div>' +
            '<div style="margin-top:12px; padding:10px; background:#FFF; border-radius:6px; font-size:12px; color:#166534; border:1px solid #BBF7D0;">' +
              '💡 Esta entrevista já está visível na aba <strong>📅 Agenda</strong> do seu Dashboard.' +
            '</div>' +
          '</div>';

        // Esconde o botão "Confirmar" do form de baixo (se houver) e guarda os valores pra reaproveitar
        window._entrevistaAtual = ativa;
      } catch (e) {
        console.warn('Falha ao carregar entrevistas existentes:', e);
      }
    }

    function editarEntrevista(entrevista) {
      // Recarrega a página com a entrevista no formulário de edição
      // Alternativa: trocar o card de volta pro modo form
      const card = document.getElementById('card-agendamento-entrevista');
      if (!card) return location.reload();
      // Como outerHTML substitui, vamos pedir reload — simples e robusto
      location.reload();
    }

    async function cancelarEntrevista(entrevistaId) {
      if (!confirm('Tem certeza que deseja cancelar esta entrevista?')) return;
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/entrevista/' + entrevistaId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ status: 'cancelada' })
        });
        if (!r.ok) throw new Error('Falha ao cancelar');
        alert('✅ Entrevista cancelada.');
        location.reload();
      } catch (e) {
        alert('❌ Erro: ' + e.message);
      }
    }

    function render(c, docsCard) {
      const content = document.getElementById('content');
      // Dados de teste/legados podem trazer etapas como JSON string, array de
      // objetos ou até nulo. Normalizamos antes de montar a timeline para que
      // um campo vazio nunca interrompa a renderização inteira.
      const etapasPadrao = ['Inscrição', 'Triagem', 'RH', 'Gestor', 'Proposta', 'Coleta de Documentos', 'Contratação'];
      let etapasRaw = c.etapas;
      if (typeof etapasRaw === 'string') {
        try { etapasRaw = JSON.parse(etapasRaw); } catch (_) { etapasRaw = []; }
      }
      const etapas = (Array.isArray(etapasRaw) ? etapasRaw : [])
        .map(e => typeof e === 'string' ? e : (e && e.nome))
        .map(e => String(e || '').trim())
        .filter(Boolean);
      if (!etapas.length) etapas.push(...etapasPadrao);
      // etapa_atual do banco = 0-indexed da PRÓXIMA etapa a fazer (etapa_atual=0 = Inscrição,
      // etapa_atual=1 = Triagem após Inscrição concluída, etc).
      // etapaAtual = 1-indexed da etapa em andamento (etapa_atual + 1), usado no display.
      // As comparações abaixo (ehProposta, ehTriagem, etc) usam etapa_atual direto (0-indexed)
      // porque o backend grava os valores com esse significado (linha 1528 do server.js).
      const etapaAtualBanco = Number(c.etapa_atual || 0);
      const etapaAtual = etapaAtualBanco + 1;
      const totalEtapas = etapas.length || 1;
      // Os índices variam quando a empresa customiza etapas. Resolva pelo
      // nome para manter o fluxo correto tanto em vagas de 7 etapas quanto
      // em vagas legadas de 8 etapas (com uma etapa intermediária extra).
      const ehTriagem = etapaAtualBanco === 1;
      const idxEtapaProposta = etapas.findIndex(n => /proposta/i.test(n));
      const ehProposta = etapaAtualBanco === (idxEtapaProposta >= 0 ? idxEtapaProposta : 4);
      // Entrevista gestor = índice 3 (quando existir; a comparação por nome
      // abaixo também cobre vagas customizadas).
      const ehEntrevistaGestor = etapaAtualBanco === 3;
      const status = c.status || 'em_andamento';


      // Observações por etapa (comentários internos do admin)
      const observacoes = (c.observacoes_etapas && typeof c.observacoes_etapas === 'object') ? c.observacoes_etapas : {};

      // Detecta etapas de entrevista por NOME (case-insensitive)
      // "Entrevista RH" e "Entrevista com Gestor" / "Entrevista Gestor" / "Entrevista com o Gestor"
      const idxEtapaRH = etapas.findIndex(n => /entrevista.*rh|rh.*entrevista/i.test(n));
      const idxEtapaGestor = etapas.findIndex(n => /entrevista.*gestor|gestor.*entrevista/i.test(n));
      // Etapas já atingidas (para mostrar os comentários como histórico)
      // etapa_atual (0-indexed) indica quantas etapas foram concluídas. idx+1 é 1-indexed.
      // Se idx+1 <= etapa_atual+1 (=etapaAtual), a etapa já passou.
      const etapaRHAtingida = idxEtapaRH >= 0 && (idxEtapaRH + 1) <= etapaAtual;
      const etapaGestorAtingida = idxEtapaGestor >= 0 && (idxEtapaGestor + 1) <= etapaAtual;
      // Etapa de coleta de documentos (por nome)
      const idxEtapaColeta = etapas.findIndex(n => /coleta.*documento|documento.*coleta/i.test(n));
      const ehEtapaColeta = idxEtapaColeta >= 0 && idxEtapaColeta === etapaAtualBanco;

      // Timeline interativa: cada bolinha é clicável e rola até a seção correspondente
      const timeline = etapas.map((nome, i) => {
        const idx = i + 1;
        let cls = '';
        if (idx < etapaAtual) cls = 'concluida';
        else if (idx === etapaAtual) cls = 'atual';
        // onclick="scrollSecao('etapa-X')" — rola até a seção dessa etapa
        return '<div class="etapa ' + cls + '" onclick="scrollSecao(\'etapa-' + idx + '\')" style="cursor:pointer" title="Ir para detalhes da etapa ' + idx + '">' +
          '<div class="num">' + idx + '/' + totalEtapas + '</div>' + escapeHtml(nome) + '</div>';
      }).join('');

      // Helper: formata data
      const fmtData = v => {
        if (!v) return null;
        const s = String(v);
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
          const [a, m, d] = s.substring(0, 10).split('-');
          return d + '/' + m + '/' + a;
        }
        return s;
      };
      const fmtDataHora = v => {
        if (!v) return '';
        const d = new Date(v);
        if (isNaN(d.getTime())) return String(v);
        return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      };

      // Endereço completo
      const endCompleto = [
        c.logradouro ? escapeHtml(c.logradouro) : null,
        c.numero ? ', ' + escapeHtml(c.numero) : null,
        c.complemento ? ' — ' + escapeHtml(c.complemento) : null,
        c.bairro ? '<br>' + escapeHtml(c.bairro) : null,
        (c.cd_cidade || c.cidade) ? '<br>' + escapeHtml(c.cd_cidade || c.cidade) : null,
        (c.cd_estado || c.estado) ? ' / ' + escapeHtml(c.cd_estado || c.estado) : null,
        c.cep ? '<br>CEP ' + escapeHtml(c.cep) : null
      ].filter(Boolean).join('');

      // Experiências (array + campo antigo "experiencia")
      const exps = Array.isArray(c.experiencias) ? c.experiencias : [];
      let expsHtml = '';
      if (exps.length > 0) {
        expsHtml = '<div class="exp-lista">' + exps.map((e, i) => {
          const ini = fmtData(e.inicio) || '';
          // Backend retorna 'emprego_atual' (não 'atual')
          const isAtual = e.emprego_atual || e.atual;
          const fim = e.fim ? (fmtData(e.fim)) : (isAtual ? 'Atual' : '');
          return '<div class="exp-item-admin">' +
            '<div class="exp-item-num">' + (i + 1) + '</div>' +
            '<div class="exp-item-corpo">' +
              '<div class="exp-item-titulo"><strong>' + escapeHtml(e.cargo || '—') + '</strong> em ' + escapeHtml(e.empresa || '—') + '</div>' +
              '<div class="exp-item-periodo">' + ini + (fim ? ' — ' + fim : '') + '</div>' +
              (e.descricao ? '<div class="exp-item-desc">' + escapeHtml(e.descricao) + '</div>' : '') +
            '</div>' +
            '</div>';
        }).join('') + '</div>';
      } else if (c.experiencia) {
        expsHtml = '<div style="padding:10px;border-left:3px solid var(--vinho);background:#FAFAFA;font-size:14px;white-space:pre-wrap">' + escapeHtml(c.experiencia) + '</div>';
      } else {
        expsHtml = '<p style="color:var(--cinza-medio);font-size:14px">Nenhuma experiência informada.</p>';
      }

      // Formação: formacao pode ser string simples ('Superior completo', 'Graduação'...) OU código curto ('superior'). Mapear para label amigável.
      const FORMACAO_LABELS = {
        'fundamental': 'Ensino Fundamental',
        'medio': 'Ensino Médio',
        'tecnico': 'Ensino Técnico',
        'superior': 'Ensino Superior',
        'pos': 'Pós-graduação',
        'mestrado': 'Mestrado',
        'doutorado': 'Doutorado'
      };
      const SITUACAO_LABELS = {
        'concluido': 'Concluído',
        'cursando': 'Cursando',
        'trancado': 'Trancado',
        'incompleto': 'Incompleto'
      };
      function labelFormacao(v) {
        if (!v) return null;
        const s = String(v).toLowerCase().trim();
        return FORMACAO_LABELS[s] || (v.charAt(0).toUpperCase() + v.slice(1));
      }
      function labelSituacao(v) {
        if (!v) return null;
        const s = String(v).toLowerCase().trim();
        return SITUACAO_LABELS[s] || (v.charAt(0).toUpperCase() + v.slice(1));
      }
      let formacaoHtml = '<p style="color:var(--cinza-medio);font-size:14px">Não informada.</p>';
      const f = c.formacao && typeof c.formacao === 'object' ? c.formacao : null;
      const esc = (f && f.escolaridade) || (typeof c.formacao === 'string' ? c.formacao : null) || c.escolaridade;
      const escLabel = labelFormacao(esc) || esc;
      const curso = (f && f.curso) || c.curso;
      const inst = (f && f.instituicao) || c.instituicao;
      const sitRaw = (f && f.situacao) || c.situacao;
      const sit = labelSituacao(sitRaw);
      const concl = fmtData((f && f.data_conclusao) || c.data_conclusao);
      if (esc || curso || inst) {
        formacaoHtml =
          '<div class="field-value" style="font-weight:600">' + escapeHtml(escLabel || '—') + '</div>' +
          (curso ? '<div class="field-value" style="margin-top:6px">' + escapeHtml(curso) + '</div>' : '') +
          (inst ? '<div class="field-value" style="font-weight:400;color:var(--cinza-medio);margin-top:2px">' + escapeHtml(inst) + '</div>' : '') +
          ((sit || concl) ? '<div class="field-value" style="font-weight:400;font-size:13px;color:var(--cinza-medio);margin-top:4px">' + escapeHtml(sit || '') + (concl ? ' • Conclusão: ' + escapeHtml(concl) : '') + '</div>' : '');
      }

      // Sobre Você
      const sobre = c.sobre_voce || c.sobre;
      const sobreHtml = sobre
        ? '<p style="font-size:14px;line-height:1.6;white-space:pre-wrap">' + escapeHtml(sobre) + '</p>'
        : '<p style="color:var(--cinza-medio);font-size:14px">Não informado.</p>';

      // Histórico: só mostrar até a etapa atual (não inventar movimentações futuras)
      const hist = Array.isArray(c.historico) ? c.historico : [];
      const histFiltrado = hist.filter(h => (h.etapa == null) || (h.etapa <= etapaAtual));
      // Se o histórico está vazio mas já passou da etapa 1, mostra pelo menos a entrada de criação
      let histHtml;
      if (histFiltrado.length === 0) {
        histHtml = '<p style="color:var(--cinza-medio);font-size:14px">Nenhuma movimentação registrada ainda.</p>';
      } else {
        histHtml = histFiltrado.map(h => {
          const dataFmt = fmtDataHora(h.data);
          const acaoLabel = h.acao === 'avancar' ? '▶ Avançou para próxima etapa' :
                            h.acao === 'reprovar' ? '✖ Reprovado' :
                            h.acao === 'reabrir' ? '↻ Candidatura reaberta' :
                            h.acao === 'aprovar' ? '✅ Aprovado' :
                            h.acao === 'inscricao' ? '📝 Inscrição realizada' :
                            (h.status || 'Movimentação');
          // Nome da etapa (se existir)
          // No banco, h.etapa é 0-indexed (etapa 0 = Inscrição, etapa 1 = Triagem, etc).
          // Exibimos 1-indexed pra ficar igual à timeline.
          const etapaNum = (h.etapa != null) ? h.etapa + 1 : null;
          // Status visual do item: derivado da POSIÇÃO da etapa na esteira, não de h.status
          // (porque h.status é o status DA CANDIDATURA no momento, igual em todos os itens)
          let statusLabel = '';
          if (etapaNum != null) {
            if (h.acao === 'reprovar' || h.status === 'rejeitado' || h.status === 'reprovado') {
              statusLabel = 'reprovado';
            } else if (h.acao === 'reabrir') {
              statusLabel = 'reaberto';
            } else if (etapaNum < etapaAtual) {
              statusLabel = 'concluída';
            } else if (etapaNum === etapaAtual) {
              statusLabel = 'em andamento';
            } else {
              statusLabel = '—';
            }
          } else if (h.status) {
            statusLabel = h.status === 'em_andamento' ? 'em andamento' :
                          h.status === 'em_analise' ? 'em análise' :
                          h.status === 'contratado' ? 'contratado' :
                          h.status === 'rejeitado' ? 'reprovado' :
                          h.status === 'reprovado' ? 'reprovado' :
                          h.status;
          }
          const etapaNome = (etapaNum != null && etapas[etapaNum - 1]) ? etapas[etapaNum - 1] : null;
          const acaoLabelEsc = escapeHtml(acaoLabel);
          return '<div class="hist-item" id="etapa-' + (etapaNum != null ? etapaNum : '0') + '">' +
            '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
              '<strong>' + acaoLabelEsc + '</strong>' +
              (etapaNum != null ? ' <span class="badge-etapa">Etapa ' + etapaNum + (etapaNome ? ' — ' + escapeHtml(etapaNome) : '') + '</span>' : '') +
              (statusLabel ? ' <span style="font-size:11px;padding:2px 8px;background:#EEE;border-radius:999px;color:#555">[' + escapeHtml(statusLabel) + ']</span>' : '') +
            '</div>' +
            (h.mensagem ? '<div style="margin-top:4px;font-size:13px;color:#444">"' + escapeHtml(h.mensagem) + '"</div>' : '') +
            '<div style="margin-top:4px;font-size:11px;color:var(--cinza-medio)">' +
              (dataFmt ? escapeHtml(dataFmt) : '') +
              (h.por ? ' • por ' + escapeHtml(h.por) : '') +
            '</div>' +
          '</div>';
        }).join('');
      }

      // Botões de ação gerais: ▶ Avançar e ✖ Reprovar
      // - Disponíveis em qualquer etapa em_andamento / em_analise
      // - Exceção: na etapa de Coleta de Documentos, "▶ Avançar" fica bloqueado até todos os docs serem aprovados
      //   (o admin usa o botão verde "Aprovar tudo e avançar etapa" dentro do card de Documentos)
      let acoesHtml = '';
      const _stats = window._docsStatsCache || { total: 0, aprovados: 0, reprovados: 0, pendentes: 0 };
      const _tudoAprovado = _stats.total === 0 || (_stats.aprovados === _stats.total && _stats.reprovados === 0 && _stats.pendentes === 0);
      const _bloqueiaAvancar = ehEtapaColeta && !_tudoAprovado;
      const _temDocs = idxEtapaColeta >= 0 && etapaAtual >= (idxEtapaColeta + 1);

      // Mensagem pra step final (contratação)
      const ehUltimaEtapa = etapaAtual >= totalEtapas;
      const labelAvancar = ehUltimaEtapa ? '✅ Contratar' : '▶ Avançar para próxima etapa';

      if (status === 'em_andamento' || status === 'aprovado' || status === 'em_analise') {
        const _botaoAvancarDisabled = _bloqueiaAvancar ? 'disabled style="opacity:0.5;cursor:not-allowed"' : '';
        const _botaoAvancarOnclick = _bloqueiaAvancar
          ? ''
          : 'onclick="acao(' + c.id + ',\'avancar\')"';
        const _avancarTitle = _bloqueiaAvancar ? 'title="Aprove todos os documentos antes de avançar (use o botão no card de Documentos)"' : '';

        const _hintColeta = ehEtapaColeta && !_tudoAprovado
          ? '<div class="aviso-bloq" style="background:#FEF3C7;color:#92400E;border-left:4px solid #F59E0B;margin-top:8px">📄 <strong>Coleta de Documentos em andamento.</strong> Aprove todos os documentos abaixo (botão verde "Aprovar tudo e avançar etapa") para liberar o avanço.</div>'
          : '';

        acoesHtml = '<div class="acoes">' +
          '<button class="btn btn-primary" ' + _botaoAvancarDisabled + ' ' + _botaoAvancarOnclick + ' ' + _avancarTitle + '>' + labelAvancar + '</button>' +
          '<button class="btn btn-reprovar" onclick="acao(' + c.id + ',\'reprovar\')">✖ Reprovar</button>' +
          (ehProposta ? '<button class="btn" style="background:#7C3AED;color:white" onclick="abrirModalProposta(' + c.id + ')">📨 ' + (c.proposta_enviada_em ? 'Reenviar / Editar Proposta' : 'Enviar Proposta') + '</button>' : '') +
          (ehProposta && c.proposta_enviada_em ? '<div class="aviso-bloq" style="background:#EDE9FE;color:#5B21B6;border-left:4px solid #7C3AED;margin-top:8px;text-align:left">📨 <strong>Proposta enviada</strong>' + (c.proposta_aceita_em ? ' — ✅ aceita pelo candidato' : c.proposta_recusada_em ? ' — ❌ recusada' : ' — aguardando aceite do candidato') + '</div>' : '') +
          _hintColeta +
        '</div>';
      } else if (status === 'reprovado' || status === 'rejeitado') {
        acoesHtml = '<div class="acoes">' +
          // (Removido link "Ver documentos anexados" — tudo agora é inline no card-documentos)
          '<button class="btn btn-reabrir" onclick="acao(' + c.id + ',\'reabrir\')">↻ Reabrir</button>' +
        '</div>';
      } else if (status === 'contratado') {
        acoesHtml = '<div class="acoes">' +
          '<div class="aviso-bloq" style="background:#DCFCE7;color:#166534;border-left:4px solid #16A34A">🎉 Candidato contratado!</div>' +
          '<button class="btn btn-reabrir" onclick="acao(' + c.id + ',\'reabrir\')">↻ Reabrir</button>' +
        '</div>';
      }

      // Card de agendamento de entrevista (jul/2026)
      // Se já existe entrevista ativa pra essa etapa → mostra card de confirmação (read-only)
      const entrevistaAtiva = (c.entrevistas || []).find(e => Number(e.etapa) === etapaAtualBanco && e.status !== 'cancelada');
      const podeAgendarAqui = (idxEtapaRH >= 0 && (idxEtapaRH + 1) === etapaAtual) || (idxEtapaGestor >= 0 && (idxEtapaGestor + 1) === etapaAtual);

      // === Card READ-ONLY da entrevista já agendada (com botão "❌ Falhou") ===
      let cardEntrevistaJaAgendada = '';
      if (podeAgendarAqui && entrevistaAtiva) {
        const e = entrevistaAtiva;
        const dataFmt = new Date(e.data_hora).toLocaleString('pt-BR', {
          weekday: 'long', day: '2-digit', month: 'long', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        // A sala autenticada VagasIO é o único provedor online ativo.
        const isVagasio = !!e.video_room_id || e.video_provider === 'vagasio';
        const isOnline = isVagasio || /online|videochamada/i.test(e.local || '');

    // Rola suavemente até a seção do id informado

    // Salva a observação interna de uma etapa (sem mudar status/etapa da candidatura)
    async function salvarComentarioEtapa(candidaturaId, etapaNum) {
      // Pega o textarea certo: o botão que chamou a função está dentro de um card com data-etapa
      let comentario = '';
      const btns = document.querySelectorAll('button[onclick*="salvarComentarioEtapa"]');
      let btnClicou = null;
      for (const b of btns) {
        if (b.onclick && b.onclick.toString().includes(`salvarComentarioEtapa(${candidaturaId},${etapaNum})`)) {
          btnClicou = b;
          break;
        }
      }
      if (btnClicou) {
        const card = btnClicou.closest('.card');
        const ta = card ? card.querySelector('textarea') : null;
        if (ta) comentario = ta.value || '';
      }
      comentario = (comentario || '').trim();
      if (!comentario) {
        alert('Digite um comentário antes de salvar.');
        return;
      }
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/candidatura/' + candidaturaId + '/comentario', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ etapa: etapaNum, comentario: comentario })
        });
        const data = await r.json();
        if (r.ok) {
          alert('✅ Comentário salvo.');
        } else {
          alert('Erro: ' + (data.erro || 'Não foi possível salvar'));
        }
      } catch (e) {
        alert('Erro: ' + escapeHtml(e.message || 'Erro interno'));
      }
    }

    // Alterna entre Online (VagasIO) e Presencial (campo de endereço)
    function alternarFormatoEntrevista() {
      const formato = document.getElementById('entrevista-formato').value;
      const enderecoBox = document.getElementById('entrevista-endereco-box');
      const onlineMsg = document.getElementById('entrevista-online-msg');
      if (formato === 'presencial') {
        enderecoBox.style.display = 'block';
        onlineMsg.style.display = 'none';
      } else {
        enderecoBox.style.display = 'none';
        onlineMsg.style.display = 'block';
      }
    }

    // Cancela a entrevista ativa (libera novo agendamento)
    async function cancelarEntrevistaExistente(entrevistaId) {
      const motivo = prompt('A entrevista falhou. Quer descrever o motivo?\n\n(Cancelar texto = "Candidato/recrutador não compareceu")') || 'Candidato/recrutador não compareceu';
      if (motivo === null) return; // usuário cancelou
      const token = localStorage.getItem('empresa_token');
      const btn = document.querySelector('#card-agendamento-entrevista button[onclick*="cancelarEntrevistaExistente"]');
      const originalText = btn ? btn.innerHTML : '';
      try {
        if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Cancelando...'; }
        const r = await fetch(API + '/api/empresa/entrevista/' + entrevistaId + '/cancelar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ motivo })
        });
        const res = await r.json();
        if (!r.ok) throw new Error(res.erro || 'Falha ao cancelar');
        // Recarrega a página → volta o form de novo agendamento
        render(currentCandidatura);
      } catch (e) {
        alert('Erro ao cancelar: ' + escapeHtml(e.message || 'Erro interno'));
        if (btn) { btn.disabled = false; btn.innerHTML = originalText; }
      }
    }

    async function salvarEntrevista(candidaturaId, etapaNum) {
      const card = document.getElementById('card-agendamento-entrevista');
      const btn = card.querySelector('button');
      const dataVal = document.getElementById('entrevista-data').value;
      const duracaoVal = document.getElementById('entrevista-duracao').value;
      const formatoVal = document.getElementById('entrevista-formato').value;
      const enderecoVal = document.getElementById('entrevista-endereco').value;
      const obsVal = document.getElementById('entrevista-obs').value;
      const token = localStorage.getItem('empresa_token');

      if (!dataVal) return alert('Por favor, selecione a data e hora da entrevista.');

      // Se presencial, exige endereço
      if (formatoVal === 'presencial' && !enderecoVal.trim()) {
        return alert('Por favor, informe o endereço da entrevista presencial.');
      }

      const isOnline = formatoVal === 'online';
      const btnOriginalText = isOnline ? '⏳ Criando sala VagasIO...' : '⏳ Salvando...';

      try {
        btn.disabled = true;
        btn.innerHTML = btnOriginalText;

        // Monta o body. Para online: NÃO envia link_reuniao (backend gera).
        // Para presencial: envia o local com endereço (sem link).
        const body = {
          candidatura_id: candidaturaId,
          etapa: etapaNum,
          data_hora: dataVal,
          duracao_minutos: parseInt(duracaoVal),
          local: isOnline ? 'Videochamada VagasIO' : ('Presencial — ' + enderecoVal.trim()),
          observacoes: obsVal || (isOnline ? 'Entrevista online via Videochamada VagasIO.' : 'Entrevista presencial.')
        };
        // Só envia link_reuniao se o backend precisar gerar (não envia nada, deixa gerar)
        if (!isOnline) {
          // presencial: não envia link, backend não vai gerar
          body.link_reuniao = null;
        }

        const r = await fetch(API + '/api/empresa/entrevista', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify(body)
        });

        const res = await r.json();
        if (!r.ok) throw new Error(res.erro || 'Falha ao agendar');

        // Sala VagasIO e local salvo; historical Meet links are not activated
        const linkGerado = ''; // historical link_reuniao is never an active video provider
        const videoRoomId = (res.video && res.video.room_id) || (res.entrevista && res.entrevista.video_room_id) || '';
        const localSalvo = (res.entrevista && res.entrevista.local) || (isOnline ? 'Videochamada VagasIO' : ('Presencial — ' + enderecoVal.trim()));
        const isPresencialFinal = !videoRoomId && !isOnline;

        // Troca o card pelo modo de confirmação (sem recarregar a página!)

    // ============ DOCUMENTOS ============
    // Carrega + renderiza a lista de documentos da etapa de coleta (etapa 5)
    let _obrigatoriosDocs = []; // cache do schema vindo da API
    let _docsCache = [];        // cache dos docs do candidato

    async function carregarDocumentos(candidaturaId) {
      try {
        const token = getEmpresaToken();
        const r = await fetchEmpresaComTimeout(API + '/api/empresa/candidatura/' + candidaturaId + '/documentos', {
          headers: { 'Authorization': 'Bearer ' + token },
          __native: true
        });
        if (!r.ok) {
          _obrigatoriosDocs = []; _docsCache = [];
          return '';
        }
        const data = await r.json();
        _obrigatoriosDocs = data.obrigatorios || [];
        _docsCache = data.documentos || [];
      } catch (e) {
        console.error('docs:', e);
        _obrigatoriosDocs = []; _docsCache = [];
        return '';
      }
      // Não envia nada se candidato não tem nenhum doc e nem tá na etapa 5
      // (a função é chamada só quando etapa >= 5 mesmo assim; deixamos a UI decidir)
      return renderizarDocumentos();
    }

    // Atualiza contadores no Resumo do card de Documentos
    function atualizarDocsCount() {
      const total = _obrigatoriosDocs.length;
      // Header antigo (X/Y aprovados) — continua mostrando no header do card
      const elH = document.getElementById('docs-count-header');
      if (elH) elH.textContent = total ? '(' + _docsCache.filter(d => d.status === 'aprovado').length + '/' + total + ' aprovados)' : '';
      if (!total) return;
      // Novo bloco "Resumo" — calcula status por documento
      // Cada documento é obrigatório; status por tipo:
      // - 'aprovado' = OK
      // - 'retornado' = a reenviar
      // - 'reprovado' = reprovado (não vai aceitar)
      // - null/enviado-outros = pendente (candidato ainda não enviou ou ainda na triagem)
      const porTipo = {};
      for (const d of _docsCache) porTipo[d.tipo] = d;
      let aprovados = 0, reenviar = 0, reprovados = 0, enviados = 0;
      for (const o of _obrigatoriosDocs) {
        const d = porTipo[o.tipo];
        if (!d) continue;
        enviados++;
        if (d.status === 'aprovado') aprovados++;
        else if (d.status === 'retornado') reenviar++;
        else if (d.status === 'reprovado') reprovados++;
      }
      const pendentes = total - enviados;
      const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      setText('docs-count-line', enviados + '/' + total + ' enviados');
      setText('docs-count-aprov', aprovados);
      setText('docs-count-reenv', reenviar);
      setText('docs-count-repr', reprovados);
      setText('docs-count-pend', pendentes);
    }

    function renderizarDocumentos() {
      if (!_obrigatoriosDocs.length) return '';
      // Indexa docs existentes por tipo
      const porTipo = {};
      for (const d of _docsCache) porTipo[d.tipo] = d;

      const fmt = (n) => n ? (n / 1024).toFixed(1) + ' KB' : '';
      const fmtData = (s) => s ? new Date(s).toLocaleString('pt-BR') : '';

      let html = '<div class="doc-lista">';
      for (const o of _obrigatoriosDocs) {
        const d = porTipo[o.tipo];
        const status = d ? d.status : null;
        const isArquivo = o.categoria === 'arquivo';
        let valorHtml = '';
        if (isArquivo) {
          if (d && d.arquivo_url) {
            // O conteúdo passa pelo proxy autenticado da API; nunca abrimos a URL do storage diretamente.
            valorHtml = '<div class="doc-valor"><button type="button" class="doc-link" onclick="docBaixarUm(' + d.id + ')">📎 ' + escapeHtml(d.arquivo_nome || 'ver arquivo') + '</button> <span style="color:var(--cinza-medio)">(' + fmt(d.arquivo_tamanho) + ')</span></div>';
          } else {
            valorHtml = '<div class="doc-pendente">⏳ Candidato ainda não enviou</div>';
          }
        } else {
          // Campo de texto
          if (d && d.valor_texto) {
            valorHtml = '<div class="doc-valor">' + escapeHtml(d.valor_texto) + '</div>';
          } else {
            valorHtml = '<div class="doc-pendente">⏳ Candidato ainda não preencheu</div>';
          }
        }
        // Justificativa (se reprovado ou retornado)
        if (d && (d.status === 'reprovado' || d.status === 'retornado') && d.justificativa_admin) {
          valorHtml += '<div class="doc-justificativa">Mensagem ao candidato: ' + escapeHtml(d.justificativa_admin) + '</div>';
        }
        // Status badge
        let badge = '';
        if (!d) badge = '<span class="doc-badge doc-badge-vazio">vazio</span>';
        else if (d.status === 'aprovado') badge = '<span class="doc-badge doc-badge-aprovado">✓ aprovado</span>';
        else if (d.status === 'retornado') badge = '<span class="doc-badge doc-badge-retornado">📨 a reenviar</span>';
        else if (d.status === 'reprovado') badge = '<span class="doc-badge doc-badge-reprovado">✗ reprovado</span>';
        else badge = '<span class="doc-badge doc-badge-pendente">⏳ pendente</span>';

        // Botões individuais por documento:
        // 📥 Baixar (apenas p/ arquivos enviados)
        // ✅ Aprovar (se ainda não aprovado)
        // 📨 Retornar (com mensagem pro candidato)
        // ↩️ Reverter (se aprovado -> volta pra pendente)
        let acoesHtml = '';
        if (d) {
          acoesHtml = '<div class="doc-acoes">';
          if (isArquivo && d.arquivo_url) {
            acoesHtml += '<button class="doc-btn doc-btn-baixar" onclick="docBaixarUm(' + d.id + ')">📥 Baixar</button>';
          }
          if (d.status !== 'aprovado') {
            acoesHtml += '<button class="doc-btn doc-btn-aprovar" onclick="docRevisar(' + d.id + ',\'aprovar\')">✅ Aprovar</button>';
            acoesHtml += '<button class="doc-btn doc-btn-retornar" onclick="docRetornar(' + d.id + ')">📨 Retornar</button>';
          }
          if (d.status === 'aprovado') {
            acoesHtml += '<button class="doc-btn doc-btn-reverter" onclick="docRevisar(' + d.id + ',\'reverter\')">↩️ Reverter</button>';
          }
          acoesHtml += '</div>';
        }

        html += '<div class="doc-row ' + (d ? 'status-' + d.status : '') + '">';
        html += '  <div class="doc-info">';
        html += '    <div class="doc-tipo">' + escapeHtml(o.label) + ' ' + badge + '</div>';
        html += '    ' + valorHtml;
        if (d && d.enviado_em) html += '<div class="doc-valor" style="font-size:11px">Enviado em ' + fmtData(d.enviado_em) + (d.revisado_em ? ' • Revisado em ' + fmtData(d.revisado_em) : '') + '</div>';
        html += '  </div>';
        html += '  ' + acoesHtml;
        html += '</div>';
      }
      html += '</div>';

      // Resumo
      const total = _obrigatoriosDocs.length;
      const enviados = _docsCache.length;
      const aprovados = _docsCache.filter(d => d.status === 'aprovado').length;
      const retornados = _docsCache.filter(d => d.status === 'retornado').length;
      const reprovados = _docsCache.filter(d => d.status === 'reprovado').length;
      const pendentes = Math.max(0, total - aprovados - retornados - reprovados);
      window._docsStatsCache = { total, enviados, aprovados, retornados, reprovados, pendentes };
      const resumo = '';  // Removido: resumo duplicava embaixo. Agora só fica no topo do card.

      // Atualiza estado do botão global (será chamado depois do DOM estar montado)
      setTimeout(() => atualizarBotaoAprovarTudo(), 0);

      return html + resumo;
    }

    // === Ações individuais por documento (consolidadas da antiga validar-documentos.html) ===

    async function docRevisar(docId, acao) {
      // acao = 'aprovar' ou 'reverter'
      if (acao === 'aprovar' && !confirm('Aprovar este documento?')) return;
      if (acao === 'reverter' && !confirm('Reverter este documento para status pendente?')) return;
      try {
        const token = localStorage.getItem('empresa_token');
        const r = await fetch(API + '/api/empresa/documento/' + docId + '/revisar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ acao })
        });
        const data = await r.json();
        if (!r.ok) { alert('Erro: ' + (data.erro || 'Falha ao revisar')); return; }
        const idx = _docsCache.findIndex(d => d.id === docId);
        if (idx >= 0) {
          _docsCache[idx] = {
            ..._docsCache[idx],
            status: data.documento ? data.documento.status : (acao === 'aprovar' ? 'aprovado' : 'pendente'),
            justificativa_admin: null,
            revisado_em: new Date().toISOString()
          };
        }
        // Re-renderiza
        const card = document.getElementById('card-documentos');
        if (card) {
          card.querySelector('.doc-lista-wrapper').innerHTML = renderizarDocumentos();
          atualizarDocsCount();
          atualizarBotaoAprovarTudo();
        }
      } catch (e) {
        alert('Erro: ' + escapeHtml(e.message || 'Erro interno'));
      }
    }

    async function docRetornar(docId) {
      const d = _docsCache.find(x => x.id === docId);
      const label = d ? (d.tipo || 'este documento') : 'este documento';
      const msg = prompt(
        'Retornar "' + label + '" para o candidato?\n\n' +
        'Escreva uma mensagem explicando o que precisa ser corrigido/enviado:\n(mínimo 10 caracteres)',
        d && d.justificativa_admin ? d.justificativa_admin : ''
      );
      if (msg === null) return;
      if (msg.trim().length < 10) { alert('Mensagem muito curta (mínimo 10 caracteres).'); return; }

        const token = localStorage.getItem('empresa_token');

          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ acao: 'retornar', justificativa: msg.trim() })
        });
        const data = await r.json();
        if (!r.ok) { alert('Erro: ' + (data.erro || 'Falha ao retornar')); return; }
        const idx = _docsCache.findIndex(x => x.id === docId);
        if (idx >= 0) {
          _docsCache[idx] = {
            ..._docsCache[idx],

            revisado_em: new Date().toISOString()
          };

          card.querySelector('.doc-lista-wrapper').innerHTML = renderizarDocumentos();
