<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analytics · Portal Empresa · Vagas.io</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="empresa.css">
  <style>
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
    .kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px 20px;}
    .kpi-val{font-size:28px;font-weight:800;color:var(--vinho);}
    .kpi-lbl{font-size:12px;color:var(--cinza-medio);margin-top:4px;}
    .kpi-sub{font-size:11px;color:#aaa;margin-top:2px;}
    .secao{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:20px;margin-bottom:20px;}
    .secao h3{font-size:15px;font-weight:700;margin-bottom:16px;}
    .funil{display:flex;flex-direction:column;gap:8px;}
    .funil-step{display:flex;align-items:center;gap:12px;font-size:14px;}
    .funil-bar{flex:1;height:26px;background:#f5f5f7;border-radius:6px;overflow:hidden;}
    .funil-fill{height:100%;background:linear-gradient(90deg,var(--vinho),var(--vinho-claro));border-radius:6px;transition:width .5s ease;}
    .funil-cnt{min-width:60px;text-align:right;font-weight:700;font-size:14px;}
    .funil-lbl{min-width:160px;font-size:13px;color:#555;}
    .ranking{list-style:none;}
    .ranking li{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
    .ranking li:last-child{border:none;}
    .rank-num{width:22px;height:22px;border-radius:50%;background:var(--vinho);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .rank-nome{flex:1;margin:0 10px;font-weight:500;}
    .rank-cnt{font-size:13px;font-weight:700;color:var(--vinho);}
    .evolucao-table td,.evolucao-table th{padding:7px 12px;font-size:12px;border:1px solid #eee;}
    .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-end;}
    .filtros label{font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:4px;}
    .filtros select,.filtros input{padding:7px 10px;border:1.5px solid #ddd;border-radius:7px;font-size:13px;}
    .filtros select:focus,.filtros input:focus{border-color:var(--vinho);outline:none;}
    @media(max-width:768px){.kpis{grid-template-columns:repeat(2,1fr)}.funil-lbl{min-width:100px;font-size:11px}}
  </style>
</head>
<body>

<!-- header padrão via empresa-auth-init.js -->
<div id="app-root">
  <header id="main-header" class="header">
    <div class="header-content">
      <div class="logo-area">
        <span class="logo-text">Vagas<span style="color:var(--dourado)">.io</span></span>
      </div>
      <div class="header-actions" id="header-actions"></div>
    </div>
  </header>

  <div class="container" style="padding-top:24px">
    <!-- breadcrumb -->
    <nav style="font-size:13px;color:#888;margin-bottom:18px">
      <a href="index.html" style="color:var(--vinho);text-decoration:none">Dashboard</a>
      <span style="margin:0 6px">›</span> Analytics
    </nav>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <h1 style="font-size:22px;font-weight:700">📊 Analytics</h1>
        <p style="color:var(--cinza-medio);font-size:14px;margin-top:3px">Desempenho das suas vagas e candidatos</p>
      </div>
      <button class="btn btn-primary" id="btn-att" onclick="carregar()">🔄 Atualizar</button>
    </div>

    <!-- filtros -->
    <div class="filtros">
      <label>Período
        <select id="f-periodo">
          <option value="7">Últimos 7 dias</option>
          <option value="30" selected>Últimos 30 dias</option>
          <option value="60">Últimos 60 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>
      </label>
      <label>Vaga
        <select id="f-vaga" style="min-width:180px">
          <option value="">Todas as vagas</option>
        </select>
      </label>
      <button class="btn btn-primary btn-sm" onclick="pagAtual=1;carregar()">Aplicar</button>
    </div>

    <!-- KPIs -->
    <div class="kpis" id="kpis">
      <div class="kpi"><div class="kpi-val" id="k-vis">—</div><div class="kpi-lbl">Visualizações de vagas</div></div>
      <div class="kpi"><div class="kpi-val" id="k-cand">—</div><div class="kpi-lbl">Candidaturas recebidas</div></div>
      <div class="kpi"><div class="kpi-val" id="k-conv">—</div><div class="kpi-lbl">Taxa de conversão</div><div class="kpi-sub">visualização → candidatura</div></div>
      <div class="kpi"><div class="kpi-val" id="k-chat">—</div><div class="kpi-lbl">Chats iniciados</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <!-- Funil -->
      <div class="secao">
        <h3>🎯 Funil de Recrutamento</h3>
        <div class="funil" id="funil"></div>
      </div>

      <!-- Ranking vagas -->
      <div class="secao">
        <h3>🏆 Vagas mais visualizadas</h3>
        <ol class="ranking" id="ranking-vagas"></ol>
      </div>
    </div>

    <!-- Evolução por período -->
    <div class="secao">
      <h3>📅 Candidaturas por dia</h3>
      <div id="evolucao-wrap" style="overflow-x:auto">
        <table class="evolucao-table" style="border-collapse:collapse;width:100%">
          <thead><tr id="ev-head"></tr></thead>
          <tbody><tr id="ev-body"></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="empresa-auth-init.js?v=20260726"></script>
<script>
const API = 'https://recrutamento-api-novo.onrender.com';
let pagAtual = 1;

function tok(){ return localStorage.getItem('empresa_token') || ''; }
function $(id){ return document.getElementById(id); }

async function carregarVagas(){
  try {
    const r = await fetch(API+'/api/empresa/vagas?status=publicada&limit=50', {
      headers:{Authorization:'Bearer '+tok()}
    });
    if(!r.ok) return;
    const d = await r.json();
    const vagas = d.vagas||d||[];
    const sel = $('f-vaga');
    vagas.forEach(v => {
      const o = document.createElement('option');
      o.value = v.id; o.textContent = v.titulo;
      sel.appendChild(o);
    });
  } catch(_){}
}

async function carregar(){
  const btn = $('btn-att');
  btn.disabled = true; btn.textContent = '⏳…';
  const periodo = $('f-periodo').value;
  const vaga_id = $('f-vaga').value;
  const params  = new URLSearchParams({ periodo, ...(vaga_id && { vaga_id }) });
  try {
    const r = await fetch(API+'/api/empresa/analytics?'+params, {
      headers:{ Authorization: 'Bearer '+tok() }
    });
    if(r.status===401||r.status===403){ return; }
    const d = await r.json();
    renderKpis(d);
    renderFunil(d.funil||{});
    renderRanking(d.vagas_top||[]);
    renderEvolucao(d.evolucao||[]);
  } catch(e){
    console.warn('[analytics]', e.message);
  }
  btn.disabled = false; btn.textContent = '🔄 Atualizar';
}

function renderKpis(d){
  $('k-vis').textContent  = (d.visualizacoes||0).toLocaleString('pt-BR');
  $('k-cand').textContent = (d.candidaturas||0).toLocaleString('pt-BR');
  const conv = d.visualizacoes ? ((d.candidaturas/d.visualizacoes)*100).toFixed(1)+'%' : '—';
  $('k-conv').textContent = conv;
  $('k-chat').textContent = (d.chats||0).toLocaleString('pt-BR');
}

function renderFunil(f){
  const steps = [
    ['👁️ Visualizações', f.visualizacoes||0],
    ['📝 Candidaturas',  f.candidaturas||0],
    ['📅 Entrevistas',   f.entrevistas||0],
    ['📨 Propostas',     f.propostas||0],
    ['✅ Contratações',  f.contratacoes||0],
  ];
  const max = steps[0][1] || 1;
  $('funil').innerHTML = steps.map(([lbl,cnt]) =>
    `<div class="funil-step">
      <div class="funil-lbl">${lbl}</div>
      <div class="funil-bar"><div class="funil-fill" style="width:${Math.round((cnt/max)*100)}%"></div></div>
      <div class="funil-cnt">${cnt.toLocaleString('pt-BR')}</div>
    </div>`
  ).join('');
}

function renderRanking(vagas){
  if(!vagas.length){
    $('ranking-vagas').innerHTML = '<li style="color:#aaa;padding:16px 0;text-align:center">Sem dados no período</li>';
    return;
  }
  $('ranking-vagas').innerHTML = vagas.slice(0,8).map((v,i) =>
    `<li>
      <span class="rank-num">${i+1}</span>
      <span class="rank-nome">${v.titulo||'Vaga #'+v.vaga_id}</span>
      <span class="rank-cnt">${(v.visualizacoes||v.cnt||0).toLocaleString('pt-BR')} <span style="font-size:11px;font-weight:400;color:#999">vis.</span></span>
    </li>`
  ).join('');
}

function renderEvolucao(ev){
  if(!ev.length){
    $('ev-head').innerHTML = '<th style="padding:8px;color:#aaa">Sem dados no período</th>';
    $('ev-body').innerHTML = '';
    return;
  }
  // Agrupar por data
  const datas = [...new Set(ev.map(e=>e.dia))].sort();
  $('ev-head').innerHTML = ['<th style="padding:8px 12px;background:#faf9f8;font-size:11px">Evento</th>',
    ...datas.map(d=>`<th style="padding:8px 12px;background:#faf9f8;font-size:11px;white-space:nowrap">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</th>`)
  ].join('');
  const eventos = [...new Set(ev.map(e=>e.evento))].filter(e=>e==='candidatura_enviada'||e==='vaga_visualizada');
  $('ev-body').parentElement.innerHTML = `<tbody>${
    eventos.map(ev_nome => {
      const cells = datas.map(d => {
        const row = ev.find(e=>e.dia===d&&e.evento===ev_nome);
        return `<td style="text-align:center;color:#555">${row?row.cnt:0}</td>`;
      }).join('');
      return `<tr><td style="font-size:12px;padding:8px 12px;font-weight:600">${ev_nome==='candidatura_enviada'?'📝 Candidaturas':'👁️ Visualizações'}</td>${cells}</tr>`;
    }).join('')
  }</tbody>`;
}

// Init
carregarVagas();
carregar();
</script>
</body>
</html>
