<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Esqueci minha senha · Empresa · Vagas.io</title>
  <style>
    :root{--vinho:#722F37;--vinho-claro:#8B3A45;--bg:#F5F5F5;--borda:#E5E5E5;--verde:#28A745;--vermelho:#C62828;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1a1a1a;}
    .card{max-width:420px;width:100%;background:#fff;border-radius:12px;padding:40px 32px;box-shadow:0 4px 24px rgba(0,0,0,.06);}
    .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}
    .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--vinho),#4A1F25);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;}
    .logo-text{font-size:22px;font-weight:800;color:#1a1a1a;}
    h2{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px;}
    .sub{font-size:14px;color:#666;text-align:center;margin-bottom:28px;line-height:1.5;}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
    input{width:100%;padding:11px 14px;border:1.5px solid var(--borda);border-radius:8px;font-size:15px;outline:none;transition:.2s;}
    input:focus{border-color:var(--vinho);}
    .btn{display:block;width:100%;padding:13px;background:var(--vinho);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px;transition:.2s;}
    .btn:hover{background:var(--vinho-claro);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .msg{padding:12px 14px;border-radius:8px;font-size:14px;margin-top:14px;display:none;}
    .msg.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;display:block;}
    .msg.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;display:block;}
    .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--vinho);text-decoration:none;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">V</div>
    <span class="logo-text">Vagas.io</span>
  </div>
  <h2>Recuperar senha</h2>
  <p class="sub">Informe o e-mail da sua conta empresarial.<br>Vamos enviar um link de redefinição.</p>

  <div id="form-area">
    <div>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@empresa.com" required autocomplete="email"/>
    </div>
    <button class="btn" id="btn-enviar" onclick="enviar()">Enviar link de recuperação</button>
  </div>

  <div class="msg" id="msg"></div>
  <a href="login.html" class="back">← Voltar para o login</a>
</div>

<script>
const API = 'https://recrutamento-api-novo.onrender.com';

async function enviar() {
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  try {
    const r = await fetch(API + '/api/empresa/esqueci-senha', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    // Sempre exibir mensagem neutra (não revelar se conta existe)
    msg.className = 'msg ok';
    msg.textContent = '✅ Se este e-mail estiver cadastrado, você receberá o link em breve. Verifique sua caixa de entrada e spam.';
    document.getElementById('form-area').style.display = 'none';
  } catch {
    msg.className = 'msg err';
    msg.textContent = '❌ Erro de conexão. Tente novamente em instantes.';
    btn.disabled = false; btn.textContent = 'Enviar link de recuperação';
  }
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') enviar();
});
</script>
</body>
</html>
