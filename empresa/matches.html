<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidatos Compatíveis — Portal Empresa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="empresa.css">
  <style>
    .match-card { background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:18px 20px; margin-bottom:14px; display:flex; gap:16px; align-items:flex-start; }
    .match-score-circle { width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#fff; flex-shrink:0; }
    .score-alto   { background:#16a34a; }
    .score-medio  { background:#d97706; }
    .score-baixo  { background:#dc2626; }
    .match-info { flex:1; min-width:0; }
    .match-info h3 { font-size:15px; font-weight:700; margin-bottom:3px; }
    .match-info .sub-info { font-size:12px; color:#888; margin-bottom:8px; }
    .match-criterios { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
    .crit-chip { font-size:11px; padding:2px 8px; border-radius:12px; font-weight:500; }
    .crit-ok   { background:#d1fae5; color:#065f46; }
    .crit-miss { background:#fee2e2; color:#991b1b; }
    .match-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn-sm { padding:6px 14px; font-size:12px; border:none; border-radius:6px; cursor:pointer; font-weight:600; text-decoration:none; display:inline-block; }
    .btn-primary-sm { background:#722F37; color:#fff; }
    .btn-primary-sm:hover { background:#5C252C; }
    .btn-secondary-sm { background:#f5f5f5; color:#333; border:1px solid #ddd; }
    .empty { text-align:center; padding:60px 20px; color:#888; }
    .filtro-bar { display:flex; gap:10px; margin-bottom:20px; align-items:center; flex-wrap:wrap; }
    .filtro-bar label { font-size:13px; font-weight:600; color:#555; }
    .filtro-bar input[type=range] { width:140px; }
    #score-min-label { font-size:13px; font-weight:700; color:#722F37; min-width:30px; }
    .vaga-info-topo { background:#fff; border:1px solid #e5e5e5; border-radius:10px; padding:16px 20px; margin-bottom:20px; }
    .vaga-info-topo h3 { font-size:16px; font-weight:700; margin-bottom:4px; }
    .vaga-info-topo .tags-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .tag-chip { background:#f3e8ff; color:#722F37; border:1px solid #d9b8f0; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:500; }
  </style>
</head>
<body>
  <button class="menu-toggle" onclick="document.querySelector('aside').classList.add('aberto');document.querySelector('.app').classList.add('aside-aberto');">☰</button>

  <div class="app">
    <aside>
      <button class="menu-close" onclick="document.querySelector('aside').classList.remove('aberto');document.querySelector('.app').classList.remove('aside-aberto');">✕</button>
      <div class="aside-logo"><h1>VagasIO</h1><small>Portal da Empresa</small></div>
      <a class="nav-item" href="index.html">📊 Dashboard</a>
      <a class="nav-item ativo" href="vagas.html">📋 Vagas com Candidatos</a>
      <a class="nav-item" href="base-candidatos.html">🔍 Base de Candidatos</a>
      <a class="nav-item" href="agenda.html">📅 Agenda</a>
      <a class="nav-item" href="chat.html">💬 Chat</a>
      <a class="nav-item" href="perfil.html">⚙️ Perfil</a>
      <a class="nav-item" id="nav-equipe" href="usuarios.html" style="display:none;">👥 Equipe</a>
      <div class="nav-divisor">Links</div>
      <a class="nav-item" href="../candidato/">👤 Portal do candidato</a>
      <div class="aside-user">
        <div class="aside-user-avatar" id="avatar">--</div>
        <div class="aside-user-info">
          <div class="nome" id="user-nome">--</div>
          <div class="empresa" id="user-empresa">--</div>
        </div>
        <button class="btn-logout" onclick="sair()" title="Sair">↪</button>
      </div>
    </aside>

    <main>
      <a class="voltar" href="javascript:history.back()">← Voltar</a>
      <div class="page-header">
        <div>
          <h2>🎯 Candidatos Compatíveis</h2>
          <div class="sub" id="sub-titulo">Carregando...</div>
        </div>
      </div>

      <div id="vaga-info" class="vaga-info-topo" style="display:none;"></div>

      <div class="filtro-bar">
        <label>Score mínimo:</label>
        <input type="range" id="score-min" min="0" max="90" step="10" value="0"
          oninput="document.getElementById('score-min-label').textContent=this.value+'%'; filtrarLista()">
        <span id="score-min-label">0%</span>
        <label style="margin-left:16px;">Ordenar:</label>
        <select id="ordem" onchange="filtrarLista()" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
          <option value="desc">Maior compatibilidade</option>
          <option value="asc">Menor compatibilidade</option>
        </select>
      </div>

      <div id="contador" style="font-size:13px;color:#888;margin-bottom:14px;"></div>
      <div id="lista"></div>
    </main>
  </div>

  <script src="auth-helper.js?v=fase4_2026_07_28"></script>
  <script src="empresa-auth-init.js?v=fase4_2026_07_28"></script>
  <script src="empresa-auth-patch.js?v=fase4_2026_07_28"></script>
  <script>
    const API = 'https://recrutamento-api-novo.onrender.com';
    let todosMatches = [];

    const qs = new URLSearchParams(location.search);
    const vagaId = parseInt(qs.get('vaga_id') || qs.get('vaga') || '0');

    (async function iniciar() {
      try { await authInit(); } catch (_) {}
      if (!vagaId) {
        document.getElementById('lista').innerHTML = '<div class="empty">Vaga não identificada. <a href="vagas.html">Voltar para vagas</a></div>';
      } else {
        carregarMatches();
      }
    })();

    async function carregarMatches() {
      const token = localStorage.getItem('empresa_token');
      if (!token) { location.href = 'login.html'; return; }
      try {
        const r = await fetch(`${API}/api/empresa/vagas/${vagaId}/matches`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const d = await r.json();
        if (!r.ok) {
          document.getElementById('lista').innerHTML = `<div class="empty">${esc(d.erro || 'Erro ao carregar')}</div>`;
          return;
        }
        todosMatches = d.matches || [];
        // Info da vaga
        if (d.vaga) {
          const vi = document.getElementById('vaga-info');
          vi.style.display = '';
          vi.innerHTML = `
            <h3>${esc(d.vaga.titulo)}</h3>
            <div style="font-size:13px;color:#888;">${esc(d.vaga.cidade || '')}${d.vaga.estado ? ' · ' + esc(d.vaga.estado) : ''} | ${esc(d.vaga.area || '')} | Nível: ${esc(d.vaga.nivel || '—')}</div>
            ${d.vaga.tags && d.vaga.tags.length ? `<div class="tags-row">${d.vaga.tags.map(t => `<span class="tag-chip">${esc(t)}</span>`).join('')}</div>` : ''}
          `;
          document.getElementById('sub-titulo').textContent = `${todosMatches.length} candidatos avaliados para "${d.vaga.titulo}"`;
        }
        filtrarLista();
      } catch (e) {
        document.getElementById('lista').innerHTML = '<div class="empty">Erro de conexão.</div>';
      }
    }

    function filtrarLista() {
      const minScore = parseInt(document.getElementById('score-min').value) || 0;
      const ordem = document.getElementById('ordem').value;
      let lista = todosMatches.filter(m => m.score >= minScore);
      lista.sort((a, b) => ordem === 'asc' ? a.score - b.score : b.score - a.score);
      document.getElementById('contador').textContent = `${lista.length} candidato(s) exibido(s) de ${todosMatches.length} avaliados`;
      renderLista(lista);
    }

    function renderLista(lista) {
      const el = document.getElementById('lista');
      if (!lista.length) {
        el.innerHTML = '<div class="empty">Nenhum candidato com esse score mínimo.</div>';
        return;
      }
      el.innerHTML = lista.map(m => {
        const scoreClass = m.score >= 70 ? 'score-alto' : m.score >= 40 ? 'score-medio' : 'score-baixo';
        const pontos = (m.detalhes || []).filter(d => d.pontos > 0);
        const lacunas = (m.detalhes || []).filter(d => d.pontos === 0 && d.possivel > 0);
        return `
          <div class="match-card">
            <div class="match-score-circle ${scoreClass}">${m.score}%</div>
            <div class="match-info">
              <h3>${esc(m.candidato_nome)}</h3>
              <div class="sub-info">
                ${esc(m.candidato_email || '')}
                ${m.cidade ? ' · ' + esc(m.cidade) : ''}
                ${m.estado ? '/' + esc(m.estado) : ''}
              </div>
              <div class="match-criterios">
                ${pontos.map(d => `<span class="crit-chip crit-ok">✔ ${esc(d.criterio)}</span>`).join('')}
                ${lacunas.slice(0,3).map(d => `<span class="crit-chip crit-miss">✗ ${esc(d.criterio)}</span>`).join('')}
              </div>
              <div class="match-actions">
                <a href="candidato.html?id=${m.candidato_id}" class="btn-sm btn-primary-sm">Ver perfil</a>
                <a href="candidatos.html?vaga=${vagaId}" class="btn-sm btn-secondary-sm">Ver candidaturas</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function sair() {
      if (typeof empresaSair === 'function') { empresaSair(); return; }
      ['empresa_token','empresa_refresh','empresa_usuario'].forEach(k => localStorage.removeItem(k));
      location.href = 'login.html';
    }
  </script>
</body>
</html>
