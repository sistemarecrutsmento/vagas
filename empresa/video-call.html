<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videochamada da entrevista — VagasIO</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:20px;color:#211a20}button{padding:10px 14px;border:0;border-radius:8px;background:#722f37;color:#fff;margin:4px}button:disabled{opacity:.5}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%;min-height:220px;background:#111;border-radius:10px}#status{padding:12px;background:#f5f2ef;border-radius:8px;margin:12px 0}</style><h1>Entrevista por vídeo</h1><div id="status">Verificando autorização…</div><button id="join">Entrar</button><button id="leave" disabled>Sair</button><button id="end" disabled>Encerrar para todos</button><div class="videos"><video id="local" autoplay muted playsinline></video><video id="remote" autoplay playsinline></video></div><script>
const API='https://recrutamento-api-novo.onrender.com', id=sessionStorage.getItem('vagasio_video_interview_id'); let cfg,room,credential,ws,pc,stream,remote=false,closing=false,queue=[];
const $=x=>document.getElementById(x), msg=x=>$('status').textContent=x;
function token(){return localStorage.getItem('candidato_token')||localStorage.getItem('empresa_token')||localStorage.getItem('admin_token')||''}
function decodeJwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(_){return {}}}
async function setup(){if(!id)return msg('Entrevista não identificada. Volte à agenda.');const t=token();if(!t)return msg('Faça login para entrar.');const h={Authorization:'Bearer '+t};let r=await fetch(API+'/api/video/config',{headers:h,cache:'no-store'});if(!r.ok)return msg('Videochamada não disponível para este acesso.');cfg=await r.json();r=await fetch(API+'/api/video/rooms',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({interview_id:Number(id)})});if(!r.ok)return msg('Sala indisponível. O Google Meet continua disponível.');room=(await r.json()).room.room_id; r=await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/token',{method:'POST',headers:h});if(!r.ok)return msg('Não foi possível autorizar sua entrada.');credential=await r.json();credential.userId=credential.userId||decodeJwt(credential.token).user_id;$('end').disabled=credential.role!=='recruiter';msg('Sala pronta. Clique em Entrar.');}
async function join(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];remote=true};pc.onicecandidate=e=>e.candidate&&send({type:'candidate',candidate:e.candidate});ws=new WebSocket(cfg.signalUrl+'?token='+encodeURIComponent(credential.token));ws.onopen=()=>send({type:'join',room:credential.roomId,candidature_id:credential.candidatureId,interview_id:credential.interviewId,user_id:String(credential.userId),role:credential.role});ws.onmessage=async e=>{const raw=JSON.parse(e.data),m=raw.data&&typeof raw.data==='object'?{...raw,...raw.data}:raw;if(m.type==='ready'&&credential.role==='recruiter'){await pc.setLocalDescription(await pc.createOffer());send({type:'offer',offer:pc.localDescription})}else if(m.type==='offer'){await pc.setRemoteDescription(m.offer);await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',answer:pc.localDescription})}else if(m.type==='answer')await pc.setRemoteDescription(m.answer);else if(m.type==='candidate'){if(remote)await pc.addIceCandidate(m.candidate);else queue.push(m.candidate)}else if(m.type==='call-ended'){closing=true;leave();msg('O recrutador encerrou a chamada.')}};ws.onclose=()=>{if(!closing)msg('Conexão perdida. Recarregue a página para reconectar.');};$('join').disabled=true;$('leave').disabled=false;msg('Conectado; aguardando o outro participante…')}catch(e){msg('Câmera/microfone indisponível. Você ainda pode usar o Google Meet.')}}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}function leave(){closing=true;if(ws)ws.close();if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop());$('join').disabled=false;$('leave').disabled=true}async function end(){if(credential?.role!=='recruiter')return;await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/end',{method:'POST',headers:{Authorization:'Bearer '+token()}});send({type:'end-call'});msg('Chamada encerrada.');leave()}$('join').onclick=join;$('leave').onclick=leave;$('end').onclick=end;setup();
</script></html>
