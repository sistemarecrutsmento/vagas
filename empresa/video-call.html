<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videochamada — VagasIO</title><style>
:root{--wine:#682d3b;--wine-dark:#4d202b;--gold:#c9a66b;--bg:#f6f3f0;--ink:#241d22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,system-ui,-apple-system,sans-serif;min-height:100vh}.topbar{height:72px;background:linear-gradient(110deg,var(--wine-dark),var(--wine));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);box-shadow:0 3px 14px #32151d35}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px}.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--gold);color:var(--wine-dark);display:grid;place-items:center;font-weight:900}.session-title{font-size:14px;opacity:.9}.top-actions{display:flex;align-items:center;gap:16px}.leave-top{border:1px solid #ffffff77;background:#ffffff12;color:#fff;border-radius:9px;padding:10px 17px;cursor:pointer}.layout{max-width:1180px;margin:0 auto;padding:30px 22px 120px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.heading h1{font-size:25px;margin:0 0 5px}.heading p{margin:0;color:#786e70}.status-pill{background:#fff;border:1px solid #e7dfdb;border-radius:999px;padding:9px 14px;color:#6b5a5d}.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.video-card{position:relative;background:#fff;border:1px solid #eadfdc;border-radius:18px;padding:10px;box-shadow:0 8px 24px #43202d10;min-height:330px}.video-card video{width:100%;height:100%;min-height:310px;object-fit:cover;background:#201b1e;border-radius:13px}.video-card.remote video{background:linear-gradient(135deg,#3b2730,#1f1a1d)}.video-label{position:absolute;left:22px;bottom:20px;background:#171116d9;color:#fff;border-radius:9px;padding:8px 11px;font-weight:600}.video-label small{display:block;color:#d7c5c7;font-weight:400;margin-top:2px}.video-menu{position:absolute;right:22px;bottom:20px;background:#171116d9;color:#fff;border:0;border-radius:9px;padding:8px 11px}.bottom-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;border:1px solid #e5dcd8;border-radius:18px;box-shadow:0 10px 30px #27141a27;display:flex;align-items:center;gap:8px;padding:9px 12px;z-index:5}.control{border:0;background:#f5f1ef;color:var(--wine-dark);border-radius:12px;min-width:70px;padding:10px 9px;cursor:pointer}.control:hover,.control.active{background:#ead9c4}.control.off{background:#f5d8d6;color:#9b2d2d}.control-icon{font-size:19px;display:block}.control-label{display:block;font-size:11px;margin-top:3px}.control.danger{background:var(--wine);color:#fff;min-width:78px}.control.danger:hover{background:#4b1d28}.join-wrap{display:flex;justify-content:center;margin-top:20px}.join-wrap button{border:0;border-radius:10px;background:var(--wine);color:#fff;padding:12px 22px;font-weight:700;cursor:pointer}.join-wrap button:disabled,.leave-top:disabled,.control:disabled{opacity:.45;cursor:not-allowed}@media(max-width:700px){.topbar{height:62px;padding:0 16px}.session-title{display:none}.layout{padding:22px 14px 120px}.heading{align-items:flex-start;gap:12px}.heading h1{font-size:20px}.videos{grid-template-columns:1fr;gap:14px}.video-card{min-height:230px}.video-card video{min-height:220px}.bottom-bar{width:calc(100% - 20px);justify-content:space-between;gap:2px;padding:7px 5px}.control{min-width:0;flex:1;padding:8px 3px}.control-label{font-size:9px}.leave-top{padding:8px 10px;font-size:12px}}
</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">V</span><span>VagasIO</span></div><div class="session-title">Entrevista online</div><div class="top-actions"><button id="leave-top" class="leave-top" type="button">Sair</button></div></header><main class="layout"><section class="heading"><div><h1>Entrevista por vídeo</h1><p>Conexão segura para sua entrevista.</p></div><div id="status" class="status-pill">Verificando autorização…</div></section><section class="videos"><article class="video-card"><video id="local" autoplay muted playsinline></video><div class="video-label">Você<small>Câmera e microfone locais</small></div><button class="video-menu" type="button" aria-label="Opções da sua câmera">•••</button></article><article class="video-card remote"><video id="remote" autoplay playsinline></video><div class="video-label">Outro participante<small>Aguardando conexão</small></div><button class="video-menu" type="button" aria-label="Opções do outro participante">•••</button></article></section><div class="join-wrap"><button id="join" type="button" disabled>Entrar na entrevista</button></div></main><nav class="bottom-bar" aria-label="Controles da entrevista"><button id="cam-toggle" class="control" type="button"><span class="control-icon">▣</span><span class="control-label">Câmera</span></button><button id="mic-toggle" class="control" type="button"><span class="control-icon">◉</span><span class="control-label">Microfone</span></button><button id="share-toggle" class="control" type="button"><span class="control-icon">⇧</span><span class="control-label">Compartilhar tela</span></button><button id="leave" class="control danger" type="button" disabled><span class="control-icon">☎</span><span class="control-label">Sair</span></button><button id="end" class="control danger" type="button" disabled hidden><span class="control-label">Encerrar</span></button></nav><script src="../_shared/runtime-config.js"></script><script>const API=window.VAGASIO_API_BASE,id=sessionStorage.getItem('vagasio_video_interview_id');let cfg,room,credential,ws,pc,stream,queue=[],closing=false,reconnectTimer,reconnects=0;
const $=x=>document.getElementById(x),msg=x=>$('status').textContent=x;function token(){return localStorage.getItem('candidato_token')||localStorage.getItem('empresa_token')||localStorage.getItem('admin_token')||''}function decodeJwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(_){return {}}}
async function setup(){if(!id)return msg('Entrevista não identificada. Volte à agenda.');const t=token();if(!t)return msg('Faça login para entrar.');const h={Authorization:'Bearer '+t};let r=await fetch(API+'/api/video/config',{headers:h,cache:'no-store'});if(!r.ok)return msg('Videochamada VagasIO indisponível. Tente novamente.');cfg=await r.json();r=await fetch(API+'/api/video/rooms',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({interview_id:Number(id)})});if(!r.ok)return msg('Sala VagasIO indisponível. Tente novamente.');room=(await r.json()).room.room_id;r=await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/token',{method:'POST',headers:h});if(!r.ok)return msg('Não foi possível autorizar sua entrada. Tente novamente.');credential=await r.json();if(!credential?.token||!credential?.roomId){credential=null;return msg('Autorização da sala inválida. Tente novamente.');}credential.userId=credential.userId||decodeJwt(credential.token).user_id;if(!credential.userId){credential=null;return msg('Identidade da entrevista inválida. Tente novamente.');}$('end').disabled=credential.role!=='recruiter';$('join').disabled=false;msg('Sala pronta. Clique em Entrar.');}
async function drain(){if(!pc||!pc.remoteDescription)return;while(queue.length)try{await pc.addIceCandidate(queue.shift())}catch(_){queue=[]}}
async function connect(){ws=new WebSocket(cfg.signalUrl+'?token='+encodeURIComponent(credential.token));ws.onopen=()=>{reconnects=0;send({type:'join',room:credential.roomId,candidature_id:credential.candidatureId,interview_id:credential.interviewId,user_id:String(credential.userId),role:credential.role});msg('Conectado; aguardando o outro participante…')};ws.onmessage=async e=>{const raw=JSON.parse(e.data),m=raw.data&&typeof raw.data==='object'?{...raw,...raw.data}:raw;if(m.type==='ready'&&credential.role==='recruiter'){await pc.setLocalDescription(await pc.createOffer());send({type:'offer',offer:pc.localDescription})}else if(m.type==='offer'){await pc.setRemoteDescription(m.offer);await drain();await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',answer:pc.localDescription})}else if(m.type==='answer'){await pc.setRemoteDescription(m.answer);await drain()}else if(m.type==='candidate'){if(pc.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch(_){}else queue.push(m.candidate)}else if(m.type==='call-ended'){closing=true;leave();msg('O recrutador encerrou a chamada.')}};ws.onclose=()=>{if(!closing){msg('Conexão perdida. Tentando reconectar…');if(reconnects++<5)reconnectTimer=setTimeout(connect,Math.min(1000*2**reconnects,10000));else msg('Conexão perdida. Clique em Entrar para tentar novamente.')}}}
async function join(){try{if(!credential?.token||!cfg?.signalUrl){return msg('A entrevista ainda não está autorizada. Aguarde a configuração terminar.');}if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream}if(!pc){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send({type:'candidate',candidate:e.candidate});pc.oniceconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.iceConnectionState))msg('Conexão de vídeo instável. Tentando recuperar…')}};closing=false;$('join').disabled=true;$('leave').disabled=false;connect()}catch(e){msg('Câmera/microfone indisponível. Verifique as permissões e tente novamente.')}}function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}function leave(){closing=true;clearTimeout(reconnectTimer);if(ws)ws.close();if(pc)pc.close();pc=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('join').disabled=false;$('leave').disabled=true}async function end(){if(credential?.role!=='recruiter')return;await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/end',{method:'POST',headers:{Authorization:'Bearer '+token()}});send({type:'end-call'});msg('Chamada encerrada.');leave()}
let screenStream=null;
function bindMediaControls(){
 const cam=document.getElementById('cam-toggle'), mic=document.getElementById('mic-toggle'), share=document.getElementById('share-toggle');
 cam.onclick=()=>{const t=stream?.getVideoTracks?.()[0];if(!t)return; t.enabled=!t.enabled;cam.classList.toggle('off',!t.enabled);cam.querySelector('.control-label').textContent=t.enabled?'Câmera':'Câmera desligada';};
 mic.onclick=()=>{const t=stream?.getAudioTracks?.()[0];if(!t)return; t.enabled=!t.enabled;mic.classList.toggle('off',!t.enabled);mic.querySelector('.control-label').textContent=t.enabled?'Microfone':'Microfone desligado';};
 share.onclick=async()=>{try{if(screenStream){const old=stream?.getVideoTracks?.()[0];const sender=pc?.getSenders?.().find(s=>s.track&&s.track.kind==='video');if(sender&&old)await sender.replaceTrack(old);screenStream.getTracks().forEach(t=>t.stop());screenStream=null;share.classList.remove('active');share.querySelector('.control-label').textContent='Compartilhar tela';return;}screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});const track=screenStream.getVideoTracks()[0];const sender=pc?.getSenders?.().find(s=>s.track&&s.track.kind==='video');if(sender)await sender.replaceTrack(track);share.classList.add('active');share.querySelector('.control-label').textContent='Parar compartilhamento';track.onended=()=>share.click();}catch(_){msg('Compartilhamento de tela cancelado.');}};
}
document.getElementById('leave-top').onclick=leave;document.getElementById('leave').disabled=true;bindMediaControls();$('join').onclick=join;$('leave').onclick=leave;$('end').onclick=end;setup();
</script></html></script></body></html>
