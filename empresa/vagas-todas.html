<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Vagas · Portal Empresa · Vagas.io</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --vinho:#722F37; --vinho-escuro:#4A1F25; --vinho-claro:#8B3A45; --branco:#FFF; --preto:#1A1A1A; --cinza-escuro:#3A3A3A; --cinza:#F5F5F5; --cinza-medio:#666; --borda:#E5E5E5; --dourado:#D4A155; --verde:#2E7D32; --amarelo:#F57C00; --vermelho:#C62828; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#FAFAFA; color:var(--preto); }
    .menu-toggle { display:none; position:fixed; top:12px; left:12px; z-index:1100; background:var(--vinho); color:#fff; border:0; border-radius:8px; width:40px; height:40px; font-size:20px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.2); }
    .menu-close { display:none; position:absolute; top:12px; right:12px; background:transparent; color:#fff; border:0; font-size:22px; cursor:pointer; padding:4px 8px; }
    @media (max-width:700px) {
      .menu-toggle { display:block; }
      .app.aside-aberto .menu-toggle { display:none; }
      aside { position:fixed; top:0; left:0; height:100vh; z-index:1000; transform:translateX(-100%); transition:transform .25s ease; }
      aside.aberto { transform:translateX(0); box-shadow:4px 0 24px rgba(0,0,0,.4); }
      aside.aberto .menu-close { display:block; }
      main { padding:20px 16px; padding-top:64px; }
      .page-header { flex-direction:column; align-items:flex-start; }
      .vagas-lista-cabecalho { display:none; }
      .vaga-card { grid-template-columns:1fr !important; }
    }
    aside { width:240px; background:var(--vinho); color:#fff; padding:24px 0; flex-shrink:0; display:flex; flex-direction:column; min-height:100vh; }
    .aside-logo { padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:16px; }
    .aside-logo h1 { font-size:20px; font-weight:800; color:#fff; }
    .aside-logo small { color:rgba(255,255,255,.6); font-size:12px; }
    .nav-item { display:block; padding:12px 24px; color:rgba(255,255,255,.8); text-decoration:none; font-size:14px; font-weight:500; border-left:3px solid transparent; cursor:pointer; transition:background .2s; }
    .nav-item:hover { background:rgba(255,255,255,.1); color:#fff; }
    .nav-item.ativo { background:rgba(255,255,255,.15); color:#fff; border-left-color:#fff; }
    .aside-user { margin-top:auto; padding:16px 24px; border-top:1px solid rgba(255,255,255,.1); display:flex; align-items:center; gap:10px; }
    .aside-user-avatar { width:36px; height:36px; border-radius:50%; background:var(--dourado); color:var(--preto); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .aside-user-info { flex:1; min-width:0; }
    .aside-user-info .nome { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .aside-user-info .empresa { font-size:11px; color:rgba(255,255,255,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btn-logout { background:rgba(255,255,255,.1); color:#fff; border:0; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:14px; }
    .btn-logout:hover { background:rgba(255,255,255,.2); }
    .app { display:flex; min-height:100vh; }
    main { flex:1; padding:32px; overflow-y:auto; }
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap; }
    .page-header h2 { font-size:24px; font-weight:700; }
    .page-header p { color:#888; font-size:14px; margin-top:2px; }
    .empty { text-align:center; padding:40px; color:#888; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--borda); border-top-color:var(--vinho); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* Toolbar */
    .vagas-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .vagas-toolbar-busca { position:relative; flex:1; min-width:180px; }
    .vagas-toolbar-busca input { width:100%; padding:10px 14px 10px 38px; border:1px solid var(--borda); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; }
    .vagas-toolbar-busca input:focus { outline:0; border-color:var(--vinho); }
    .vagas-toolbar-icone-busca { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#999; font-size:14px; }
    .vagas-toolbar-select { padding:10px 14px; border:1px solid var(--borda); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; cursor:pointer; }
    /* Lista */
    .vagas-lista-wrap { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06); overflow:hidden; }
    .vagas-lista-cabecalho { display:grid; grid-template-columns:1fr 110px 80px; padding:14px 18px; background:#FAFAFA; border-bottom:1px solid var(--borda); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; color:#888; }
    .vaga-card { display:grid; grid-template-columns:1fr 110px 80px; padding:16px 18px; border-bottom:1px solid #F0F0F0; align-items:center; gap:12px; transition:background .15s; text-decoration:none; color:inherit; }
    .vaga-card:hover { background:#FAFAFA; }
    .vaga-card:last-child { border-bottom:0; }
    .vaga-info { min-width:0; }
    .vaga-titulo { font-size:15px; font-weight:600; color:#1A1A1A; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .vaga-local { font-size:12px; color:#666; }
    .vaga-meta { display:flex; gap:12px; margin-top:4px; font-size:12px; color:#666; }
    .vaga-candidatos { text-align:center; }
    .vaga-candidatos-num { font-size:20px; font-weight:700; color:var(--vinho); line-height:1; }
    .vaga-candidatos-label { font-size:11px; color:#888; margin-top:2px; }
    .vaga-status { display:inline-block; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; text-align:center; }
    .vaga-status.publicada { background:#FDF2F4; color:var(--vinho); }
    .vaga-status.fechada { background:#F5F5F5; color:#888; }
    .vaga-status.pausada { background:#FEF3C7; color:#92400E; }
    .vaga-status.rascunho { background:#FEF3C7; color:#92400E; }
    /* Paginação */
    .vagas-paginacao { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; margin-top:12px; font-size:13px; color:#666; }
    .vagas-pag-btns { display:flex; gap:4px; }
    .vagas-pag-btn { min-width:32px; height:32px; padding:0 8px; background:#fff; border:1px solid var(--borda); border-radius:6px; cursor:pointer; font-size:13px; color:#444; }
    .vagas-pag-btn:hover { background:#FAFAFA; }
    .vagas-pag-btn.ativo { background:var(--vinho); color:#fff; border-color:var(--vinho); }
    .vagas-pag-btn:disabled { opacity:.4; cursor:not-allowed; }
  </style>
</head>
<body>
  <button class="menu-toggle" onclick="document.querySelector('aside').classList.add('aberto'); document.querySelector('.app').classList.add('aside-aberto');" aria-label="Abrir menu">☰</button>
  <div class="app">
    <aside>
      <button class="menu-close" onclick="document.querySelector('aside').classList.remove('aberto'); document.querySelector('.app').classList.remove('aside-aberto');" aria-label="Fechar menu">✕</button>
      <div class="aside-logo"><h1>VagasIO</h1><small>Portal da Empresa</small></div>
      <a class="nav-item" href="index.html">📊 Dashboard</a>
      <a class="nav-item ativo" href="vagas-todas.html">💼 Minhas Vagas</a>
      <a class="nav-item" href="vagas.html">📋 Vagas com Candidatos</a>
      <a class="nav-item" href="agenda.html">📅 Agenda</a>
      <a class="nav-item" href="perfil.html">⚙️ Perfil</a>
      <div class="nav-divisor" style="padding:12px 24px; color:rgba(255,255,255,.4); font-size:11px; text-transform:uppercase; letter-spacing:.5px;">Links</div>
      <a class="nav-item" id="nav-equipe" href="usuarios.html" style="display:none;">👥 Equipe</a>

      <a class="nav-item" href="../candidato/">👤 Portal do candidato</a>
      <div class="aside-user">
        <div class="aside-user-avatar" id="avatar">--</div>
        <div class="aside-user-info">
          <div class="nome" id="user-nome">--</div>
          <div class="empresa" id="user-empresa">--</div>
        </div>
        <button class="btn-logout" onclick="sair()" title="Sair">↪</button>
      </div>
    </aside>

    <main>
      <div class="page-header">
        <div>
          <h2>Minhas Vagas</h2>
          <p>Todas as vagas liberadas para sua empresa</p>
        </div>
        <button id="btn-nova-vaga" class="btn-nova-vaga" onclick="abrirModalNovaVaga()" style="background:var(--vinho);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:none;">+ Nova vaga</button>
      </div>

      <div class="vagas-toolbar">
        <div class="vagas-toolbar-busca">
          <span class="vagas-toolbar-icone-busca">🔎</span>
          <input type="text" id="vagas-busca" placeholder="Buscar vaga por título..." />
        </div>
        <select id="vagas-filtro-status" class="vagas-toolbar-select">
          <option value="">Status: Todos</option>
          <option value="publicada">Publicadas</option>
          <option value="fechada">Encerradas</option>
          <option value="pausada">Rascunhos</option>
        </select>
      </div>

      <div class="vagas-lista-wrap">
        <div class="vagas-lista-cabecalho">
          <div>Vaga</div>
          <div style="text-align:center">Candidatos</div>
          <div style="text-align:center">Status</div>
        </div>
        <div id="vagas-lista">
          <div class="empty"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="vagas-paginacao" id="vagas-paginacao" style="display:none">
        <span id="vagas-pag-info"></span>
        <div class="vagas-pag-btns" id="vagas-pag-btns"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" style="position:fixed;bottom:24px;right:24px;background:#1A1A1A;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;"></div>

  <script>
    const API = 'https://recrutamento-api-v2.onrender.com';
    const token = localStorage.getItem('empresa_token');
    if (!token) window.location.href = 'login.html';
    const usuario = JSON.parse(localStorage.getItem('empresa_usuario') || '{}');

    function iniciais(n) { return (n || '?').split(' ').filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join(''); }
    function sair() { if (confirm('Sair do portal?')) { localStorage.removeItem('empresa_token'); localStorage.removeItem('empresa_usuario'); window.location.href = 'login.html'; } }
    function toast(msg, tipo='') { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; t.style.background = tipo === 'erro' ? '#C62828' : '#1A1A1A'; setTimeout(() => t.style.opacity = '0', 3000); }

    document.getElementById('avatar').textContent = iniciais(usuario.nome);
    document.getElementById('user-nome').textContent = usuario.nome || '--';
    document.getElementById('user-empresa').textContent = usuario.empresa_nome || '--';

    let vagasCache = [];
    let paginaAtual = 1;
    const POR_PAGINA = 10;

    function render() {
      const busca = (document.getElementById('vagas-busca').value || '').toLowerCase();
      const status = document.getElementById('vagas-filtro-status').value;
      const filtradas = vagasCache.filter(v => {
        if (busca && !(v.titulo || '').toLowerCase().includes(busca)) return false;
        if (status && v.status !== status) return false;
        return true;
      });
      const total = filtradas.length;
      const totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));
      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
      const inicio = (paginaAtual - 1) * POR_PAGINA;
      const pagina = filtradas.slice(inicio, inicio + POR_PAGINA);

      const lista = document.getElementById('vagas-lista');
      if (total === 0) {
        lista.innerHTML = '<div class="empty">Nenhuma vaga encontrada</div>';
        document.getElementById('vagas-paginacao').style.display = 'none';
        return;
      }

      lista.innerHTML = pagina.map(v => {
        const totalCand = parseInt(v.total_geral) || 0;
        const statusClass = v.status || 'pausada';
        const statusLabel = v.status === 'publicada' ? 'Publicada' : v.status === 'fechada' ? 'Encerrada' : 'Rascunho';
        const link = totalCand > 0 ? `vagas.html?vaga=${v.id}` : `candidatos.html?vaga=${v.id}`;
        return `<a class="vaga-card" href="${link}">
          <div class="vaga-info">
            <div class="vaga-titulo">${v.titulo || '—'}</div>
            <div class="vaga-local">${v.empresa || ''} • ${[v.cidade, v.estado].filter(Boolean).join(' / ') || '—'}</div>
          </div>
          <div class="vaga-candidatos">
            <div class="vaga-candidatos-num">${totalCand}</div>
            <div class="vaga-candidatos-label">${totalCand === 1 ? 'candidato' : 'candidatos'}</div>
          </div>
          <div style="text-align:center"><span class="vaga-status ${statusClass}">${statusLabel}</span></div>
        </a>`;
      }).join('');

      // Paginação
      document.getElementById('vagas-paginacao').style.display = 'flex';
      document.getElementById('vagas-pag-info').textContent = `${inicio + 1}–${Math.min(inicio + POR_PAGINA, total)} de ${total}`;
      const btns = document.getElementById('vagas-pag-btns');
      let html = `<button class="vagas-pag-btn" onclick="irPagina(${paginaAtual - 1})" ${paginaAtual === 1 ? 'disabled' : ''}>←</button>`;
      for (let i = 1; i <= totalPaginas; i++) {
        html += `<button class="vagas-pag-btn ${i === paginaAtual ? 'ativo' : ''}" onclick="irPagina(${i})">${i}</button>`;
      }
      html += `<button class="vagas-pag-btn" onclick="irPagina(${paginaAtual + 1})" ${paginaAtual === totalPaginas ? 'disabled' : ''}>→</button>`;
      btns.innerHTML = html;
    }

    function irPagina(p) { paginaAtual = p; render(); }

    async function carregar() {
      try {
        const r = await fetch(API + '/api/empresa/vagas-todas', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await r.json();
        if (!r.ok) { if (r.status === 401 || r.status === 403) { sair(); return; } toast(data.erro || 'Erro', 'erro'); return; }
        vagasCache = data.vagas || [];
        render();
      } catch (e) { toast('Erro de conexão', 'erro'); }
    }

    document.getElementById('vagas-busca').addEventListener('input', () => { paginaAtual = 1; render(); });
    document.getElementById('vagas-filtro-status').addEventListener('change', () => { paginaAtual = 1; render(); });

    carregar();
  </script>
<script src="auth-helper.js?v=fase3_2026_07_28"></script>
  <script src="empresa-auth-init.js?v=fase3_2026_07_28"></script>
  <script src="empresa-auth-patch.js?v=fase3_2026_07_28"></script>

  <script>
    // ===== INIT COMUM FASE 3 — RBAC frontend =====
    (async function() {
      setStorageKeys('empresa_token', 'empresa_refresh', 'empresa_usuario');

      // tenta refresh silencioso antes de qualquer coisa
      try { await authInit(); } catch (e) { console.warn('refresh falhou', e); }

      // guard: sem token -> vai pro login
      if (!localStorage.getItem('empresa_token')) {
        const path = window.location.pathname;
        if (!path.endsWith('login.html')) {
          window.location.href = 'login.html';
          return;
        }
      }

      // aguarda DOM
      const onReady = () => {
        // mostra link Equipe se for admin
        if (authRBAC.hasRole('admin_empresa')) {
          const navEq = document.getElementById('nav-equipe');
          if (navEq) navEq.style.display = '';
        }

        // preenche sidebar com dados do JWT
        const u = authRBAC.currentUser() || {};
        const avatar = document.getElementById('avatar');
        const nome = document.getElementById('user-nome');
        const empresa = document.getElementById('user-empresa');
        if (avatar && u.nome) avatar.textContent = u.nome.split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
        if (nome) nome.textContent = u.nome || '—';
        if (empresa) empresa.textContent = (u.role ? '[' + u.role + '] ' : '') + (u.empresa_nome || u.email || '—');

        // mostra botao +Nova vaga so para admin/recrutador (viewer nao pode)
        const btnNova = document.getElementById('btn-nova-vaga');
        if (btnNova && authRBAC.hasRole('admin_empresa', 'recrutador')) {
          btnNova.style.display = '';
        }

        // guarda de role por pagina: se existe um atributo data-roles exigido,
        // fazemos o guard UX (apenas visual; backend é autoridade)
        const required = document.querySelector('main')?.dataset?.roles;
        if (required && !authRBAC.hasRole.apply(null, required.split(','))) {
          // redireciona com aviso
          const main = document.querySelector('main');
          if (main) main.innerHTML = '<div style="text-align:center; padding:80px 20px;"><h2 style="color:#999;">🚫 Acesso restrito</h2><p style="color:#666; margin-top:12px;">Você não tem permissão para acessar esta página.</p><p style="margin-top:24px;"><a href="index.html" style="color:#722F37;">← Voltar ao Dashboard</a></p></div>';
        }
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', onReady);
      } else {
        onReady();
      }
    })();
  </script>
