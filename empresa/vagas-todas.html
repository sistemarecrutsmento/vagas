<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Vagas · Portal Empresa · Vagas.io</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --vinho:#722F37; --vinho-escuro:#4A1F25; --vinho-claro:#8B3A45; --branco:#FFF; --preto:#1A1A1A; --cinza-escuro:#3A3A3A; --cinza:#F5F5F5; --cinza-medio:#666; --borda:#E5E5E5; --dourado:#D4A155; --verde:#2E7D32; --amarelo:#F57C00; --vermelho:#C62828; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#FAFAFA; color:var(--preto); }
    .menu-toggle { display:none; position:fixed; top:12px; left:12px; z-index:1100; background:var(--vinho); color:#fff; border:0; border-radius:8px; width:40px; height:40px; font-size:20px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.2); }
    .menu-close { display:none; position:absolute; top:12px; right:12px; background:transparent; color:#fff; border:0; font-size:22px; cursor:pointer; padding:4px 8px; }
    @media (max-width:700px) {
      .menu-toggle { display:block; }
      .app.aside-aberto .menu-toggle { display:none; }
      aside { position:fixed; top:0; left:0; height:100vh; z-index:1000; transform:translateX(-100%); transition:transform .25s ease; }
      aside.aberto { transform:translateX(0); box-shadow:4px 0 24px rgba(0,0,0,.4); }
      aside.aberto .menu-close { display:block; }
      main { padding:20px 16px; padding-top:64px; }
      .page-header { flex-direction:column; align-items:flex-start; }
      .vagas-lista-cabecalho, .vagas-lista-cabecalho-2 { display:none; }
      .vaga-card { grid-template-columns:1fr !important; }
      .vaga-card-acoes { justify-content:flex-start; }
    }
    aside { width:240px; background:var(--vinho); color:#fff; padding:24px 0; flex-shrink:0; display:flex; flex-direction:column; min-height:100vh; }
    .aside-logo { padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:16px; }
    .aside-logo h1 { font-size:20px; font-weight:800; color:#fff; }
    .aside-logo small { color:rgba(255,255,255,.6); font-size:12px; }
    .nav-item { display:block; padding:12px 24px; color:rgba(255,255,255,.8); text-decoration:none; font-size:14px; font-weight:500; border-left:3px solid transparent; cursor:pointer; transition:background .2s; }
    .nav-item:hover { background:rgba(255,255,255,.1); color:#fff; }
    .nav-item.ativo { background:rgba(255,255,255,.15); color:#fff; border-left-color:#fff; }
    .aside-user { margin-top:auto; padding:16px 24px; border-top:1px solid rgba(255,255,255,.1); display:flex; align-items:center; gap:10px; }
    .aside-user-avatar { width:36px; height:36px; border-radius:50%; background:var(--dourado); color:var(--preto); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .aside-user-info { flex:1; min-width:0; }
    .aside-user-info .nome { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .aside-user-info .empresa { font-size:11px; color:rgba(255,255,255,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .btn-logout { background:rgba(255,255,255,.1); color:#fff; border:0; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:14px; }
    .btn-logout:hover { background:rgba(255,255,255,.2); }
    .app { display:flex; min-height:100vh; }
    main { flex:1; padding:32px; overflow-y:auto; }
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:12px; flex-wrap:wrap; }
    .page-header h2 { font-size:24px; font-weight:700; }
    .page-header p { color:#888; font-size:14px; margin-top:2px; }
    .empty { text-align:center; padding:40px; color:#888; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--borda); border-top-color:var(--vinho); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* Toolbar */
    .vagas-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .vagas-toolbar-busca { position:relative; flex:1; min-width:180px; }
    .vagas-toolbar-busca input { width:100%; padding:10px 14px 10px 38px; border:1px solid var(--borda); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; }
    .vagas-toolbar-busca input:focus { outline:0; border-color:var(--vinho); }
    .vagas-toolbar-icone-busca { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#999; font-size:14px; }
    .vagas-toolbar-select { padding:10px 14px; border:1px solid var(--borda); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; cursor:pointer; }
    /* Lista */
    .vagas-lista-wrap { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06); overflow:hidden; }
    .vagas-lista-cabecalho, .vagas-lista-cabecalho-2 { display:grid; grid-template-columns:1fr 110px 110px 200px; padding:14px 18px; background:#FAFAFA; border-bottom:1px solid var(--borda); font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:600; color:#888; }
    .vagas-lista-cabecalho > div:nth-child(2), .vagas-lista-cabecalho > div:nth-child(3),
    .vagas-lista-cabecalho-2 > div:nth-child(2), .vagas-lista-cabecalho-2 > div:nth-child(3) { text-align:center; }
    .vaga-card { display:grid; grid-template-columns:1fr 110px 110px 200px; padding:14px 18px; border-bottom:1px solid #F0F0F0; align-items:center; gap:12px; transition:background .15s; }
    .vaga-card:hover { background:#FAFAFA; }
    .vaga-card:last-child { border-bottom:0; }
    .vaga-info { min-width:0; }
    .vaga-titulo { font-size:15px; font-weight:600; color:#1A1A1A; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .vaga-titulo a { color:inherit; text-decoration:none; }
    .vaga-titulo a:hover { color:var(--vinho); }
    .vaga-local { font-size:12px; color:#666; }
    .vaga-meta { display:flex; gap:12px; margin-top:4px; font-size:12px; color:#666; }
    .vaga-candidatos { text-align:center; }
    .vaga-candidatos-num { font-size:20px; font-weight:700; color:var(--vinho); line-height:1; }
    .vaga-candidatos-label { font-size:11px; color:#888; margin-top:2px; }
    .vaga-status { display:inline-block; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; text-align:center; min-width:90px; }
    .vaga-status.publicada { background:#FDF2F4; color:var(--vinho); }
    .vaga-status.encerrada { background:#F5F5F5; color:#888; }
    .vaga-status.pausada { background:#FEF3C7; color:#92400E; }
    .vaga-status.rascunho { background:#E0E7FF; color:#3730A3; }
    .vaga-card-acoes { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .acao-btn { padding:6px 10px; font-size:12px; font-weight:600; border-radius:6px; cursor:pointer; border:1px solid var(--borda); background:#fff; color:#444; transition:background .15s, border-color .15s; }
    .acao-btn:hover { background:#FAFAFA; border-color:var(--vinho); color:var(--vinho); }
    .acao-btn.primary { background:var(--vinho); color:#fff; border-color:var(--vinho); }
    .acao-btn.primary:hover { background:var(--vinho-escuro); }
    .acao-btn.danger { color:var(--vermelho); }
    .acao-btn.danger:hover { background:#FEE; border-color:var(--vermelho); color:var(--vermelho); }
    .acao-btn:disabled { opacity:.4; cursor:not-allowed; }
    /* Paginação */
    .vagas-paginacao { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; margin-top:12px; font-size:13px; color:#666; }
    .vagas-pag-btns { display:flex; gap:4px; }
    .vagas-pag-btn { min-width:32px; height:32px; padding:0 8px; background:#fff; border:1px solid var(--borda); border-radius:6px; cursor:pointer; font-size:13px; color:#444; }
    .vagas-pag-btn:hover { background:#FAFAFA; }
    .vagas-pag-btn.ativo { background:var(--vinho); color:#fff; border-color:var(--vinho); }
    .vagas-pag-btn:disabled { opacity:.4; cursor:not-allowed; }
    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; z-index:1500; padding:24px; overflow-y:auto; }
    .modal-box { background:#fff; border-radius:12px; max-width:680px; width:100%; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
    .modal-box h2 { font-size:20px; font-weight:700; margin-bottom:18px; color:var(--vinho); }
    .modal-box label { display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:4px; }
    .modal-box input, .modal-box textarea, .modal-box select { width:100%; padding:10px 12px; border:1px solid var(--borda); border-radius:6px; font-family:inherit; font-size:14px; background:#fff; }
    .modal-box input:focus, .modal-box textarea:focus, .modal-box select:focus { outline:0; border-color:var(--vinho); }
    .modal-box textarea { resize:vertical; min-height:80px; }
    .modal-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    .modal-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
    .modal-row-full { margin-bottom:14px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--borda); }
    .modal-actions button { padding:10px 18px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--borda); background:#fff; color:#444; }
    .modal-actions .btn-primary { background:var(--vinho); color:#fff; border-color:var(--vinho); }
    .modal-actions .btn-primary:hover { background:var(--vinho-escuro); }
    .modal-erro { background:#FEE; color:var(--vermelho); padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:14px; display:none; }
    .modal-erro.visivel { display:block; }
  </style>
</head>

  <script>
    const API = 'https://recrutamento-api-novo.onrender.com';
    let usuario = {};
    let podeEditar = false; // admin + recrutador

    function iniciais(n) { return (n || '?').split(' ').filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join(''); }
    function sair() { if (confirm('Sair do portal?')) { localStorage.removeItem('empresa_token'); localStorage.removeItem('empresa_refresh'); localStorage.removeItem('empresa_usuario'); window.location.href = 'login.html'; } }
    function toast(msg, tipo='') { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; t.style.background = tipo === 'erro' ? '#C62828' : tipo === 'sucesso' ? '#2E7D32' : '#1A1A1A'; setTimeout(() => t.style.opacity = '0', 3000); }
    function statusLabel(s) { return ({publicada:'Publicada',pausada:'Pausada',rascunho:'Rascunho',encerrada:'Encerrada',fechada:'Encerrada'})[s] || (s || '—'); }

    let vagasCache = [];
    let paginaAtual = 1;
    const POR_PAGINA = 10;

    function render() {
      const busca = (document.getElementById('vagas-busca').value || '').toLowerCase();
      const status = document.getElementById('vagas-filtro-status').value;
      const filtradas = vagasCache.filter(v => {
        if (busca && !(v.titulo || '').toLowerCase().includes(busca)) return false;
        if (status && v.status !== status) return false;
        return true;
      });
      const total = filtradas.length;
      const totalPaginas = Math.max(1, Math.ceil(total / POR_PAGINA));
      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
      const inicio = (paginaAtual - 1) * POR_PAGINA;
      const pagina = filtradas.slice(inicio, inicio + POR_PAGINA);

      const lista = document.getElementById('vagas-lista');
      if (total === 0) {
        lista.innerHTML = '<div class="empty">Nenhuma vaga encontrada</div>';
        document.getElementById('vagas-paginacao').style.display = 'none';
        return;
      }

      lista.innerHTML = pagina.map(v => {
        const totalCand = parseInt(v.total_geral) || 0;
        const statusClass = v.status || 'pausada';
        const label = statusLabel(statusClass);
        const acoes = [];
        if (podeEditar) {
          acoes.push(`<button class="acao-btn" onclick="abrirModalEditar(${v.id})" title="Editar vaga">✏️ Editar</button>`);
        }
        acoes.push(`<a class="acao-btn" href="candidatos.html?vaga=${v.id}" title="Ver candidatos">👥 Candidatos</a>`);
        if (podeEditar) {
          if (statusClass === 'rascunho') acoes.push(`<button class="acao-btn primary" onclick="mudarStatus(${v.id},'publicada')" title="Publicar vaga">🚀 Publicar</button>`);
          else if (statusClass === 'publicada') acoes.push(`<button class="acao-btn" onclick="mudarStatus(${v.id},'pausada')" title="Pausar vaga">⏸ Pausar</button>`);
          else if (statusClass === 'pausada') acoes.push(`<button class="acao-btn primary" onclick="mudarStatus(${v.id},'publicada')" title="Reabrir vaga">▶️ Reabrir</button>`);
          else if (statusClass === 'encerrada') acoes.push(`<button class="acao-btn" onclick="mudarStatus(${v.id},'publicada')" title="Reabrir vaga">↩️ Reabrir</button>`);
          if (statusClass !== 'encerrada') acoes.push(`<button class="acao-btn danger" onclick="confirmarEncerrar(${v.id},'${(v.titulo||'').replace(/'/g,'\\\'')}')" title="Encerrar vaga">⏹ Encerrar</button>`);
        }
        return `<div class="vaga-card">
          <div class="vaga-info">
            <div class="vaga-titulo"><a href="candidatos.html?vaga=${v.id}">${v.titulo || '—'}</a></div>
            <div class="vaga-local">${v.empresa || ''} • ${[v.cidade, v.estado].filter(Boolean).join(' / ') || '—'}</div>
          </div>
          <div class="vaga-candidatos">
            <div class="vaga-candidatos-num">${totalCand}</div>
            <div class="vaga-candidatos-label">${totalCand === 1 ? 'candidato' : 'candidatos'}</div>
          </div>
          <div style="text-align:center"><span class="vaga-status ${statusClass}">${label}</span></div>
          <div class="vaga-card-acoes">${acoes.join('')}</div>
        </div>`;
      }).join('');

      document.getElementById('vagas-paginacao').style.display = 'flex';
      document.getElementById('vagas-pag-info').textContent = `${inicio + 1}–${Math.min(inicio + POR_PAGINA, total)} de ${total}`;
      const btns = document.getElementById('vagas-pag-btns');
      let html = `<button class="vagas-pag-btn" onclick="irPagina(${paginaAtual - 1})" ${paginaAtual === 1 ? 'disabled' : ''}>←</button>`;
      for (let i = 1; i <= totalPaginas; i++) html += `<button class="vagas-pag-btn ${i === paginaAtual ? 'ativo' : ''}" onclick="irPagina(${i})">${i}</button>`;
      html += `<button class="vagas-pag-btn" onclick="irPagina(${paginaAtual + 1})" ${paginaAtual === totalPaginas ? 'disabled' : ''}>→</button>`;
      btns.innerHTML = html;
    }

    function irPagina(p) { paginaAtual = p; render(); }

    async function carregar() {
      try {
        const r = await authFetch(API + '/api/empresa/vagas-todas');
        const data = await r.json();
        if (!r.ok) { if (r.status === 401 || r.status === 403) { window.location.href = 'login.html'; return; } toast(data.erro || 'Erro', 'erro'); return; }
        vagasCache = data.vagas || [];
        render();
      } catch (e) { console.error(e); toast('Erro de conexão', 'erro'); }
    }

    // ===== MODAL =====
    function abrirModalNovaVaga() {
      document.getElementById('mv-id').value = '';
      document.getElementById('modal-titulo').textContent = '+ Criar nova vaga';
      document.getElementById('btn-modal-salvar').textContent = 'Criar vaga';
      ['mv-titulo','mv-cidade','mv-estado','mv-descricao','mv-requisitos','mv-beneficios','mv-area','mv-salario-min','mv-salario-max'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('mv-tipo-contrato').value = '';
      document.getElementById('mv-nivel').value = '';
      document.getElementById('modal-erro').classList.remove('visivel');
      document.getElementById('modal-vaga').style.display = 'flex';
      setTimeout(() => document.getElementById('mv-titulo').focus(), 50);
    }

    async function abrirModalEditar(id) {
      try {
        const r = await authFetch(API + '/api/empresa/vagas/' + id);
        const data = await r.json();
        if (!r.ok) { toast(data.erro || 'Erro ao carregar vaga', 'erro'); return; }
        const v = data.vaga || data;
        document.getElementById('mv-id').value = v.id;
        document.getElementById('modal-titulo').textContent = '✏️ Editar vaga';
        document.getElementById('btn-modal-salvar').textContent = 'Salvar alterações';
        document.getElementById('mv-titulo').value = v.titulo || '';
        document.getElementById('mv-cidade').value = v.cidade || '';
        document.getElementById('mv-estado').value = v.estado || '';
        document.getElementById('mv-tipo-contrato').value = v.tipo_contrato || '';
        document.getElementById('mv-nivel').value = v.nivel || '';
        document.getElementById('mv-area').value = v.area || '';
        document.getElementById('mv-salario-min').value = v.salario_min || '';
        document.getElementById('mv-salario-max').value = v.salario_max || '';
        document.getElementById('mv-descricao').value = v.descricao || '';
        document.getElementById('mv-requisitos').value = v.requisitos || '';
        document.getElementById('mv-beneficios').value = v.beneficios || '';
        document.getElementById('modal-erro').classList.remove('visivel');
        document.getElementById('modal-vaga').style.display = 'flex';
      } catch (e) { console.error(e); toast('Erro ao carregar vaga', 'erro'); }
    }

    function fecharModalVaga() {
      document.getElementById('modal-vaga').style.display = 'none';
    }

    async function salvarVaga() {
      const id = document.getElementById('mv-id').value;
      const payload = {
        titulo: document.getElementById('mv-titulo').value.trim(),
        cidade: document.getElementById('mv-cidade').value.trim() || null,
        estado: document.getElementById('mv-estado').value.trim().toUpperCase() || null,
        tipo_contrato: document.getElementById('mv-tipo-contrato').value || null,
        nivel: document.getElementById('mv-nivel').value || null,
        area: document.getElementById('mv-area').value.trim() || null,
        salario_min: document.getElementById('mv-salario-min').value ? Number(document.getElementById('mv-salario-min').value) : null,
        salario_max: document.getElementById('mv-salario-max').value ? Number(document.getElementById('mv-salario-max').value) : null,
        descricao: document.getElementById('mv-descricao').value.trim() || null,
        requisitos: document.getElementById('mv-requisitos').value.trim() || null,
        beneficios: document.getElementById('mv-beneficios').value.trim() || null
      };
      if (!payload.titulo) {
        const err = document.getElementById('modal-erro');
        err.textContent = 'Título é obrigatório';
        err.classList.add('visivel');
        return;
      }
      const btn = document.getElementById('btn-modal-salvar');
      btn.disabled = true; btn.textContent = id ? 'Salvando...' : 'Criando...';
      try {
        const url = id ? (API + '/api/empresa/vagas/' + id) : (API + '/api/empresa/vagas');
        const method = id ? 'PUT' : 'POST';
        const r = await authFetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await r.json();
        if (!r.ok) {
          const err = document.getElementById('modal-erro');
          err.textContent = data.erro || 'Erro ao salvar vaga';
          err.classList.add('visivel');
          btn.disabled = false; btn.textContent = id ? 'Salvar alterações' : 'Criar vaga';
          return;
        }
        toast(id ? 'Vaga atualizada' : 'Vaga criada', 'sucesso');
        fecharModalVaga();
        carregar();
      } catch (e) {
        console.error(e);
        const err = document.getElementById('modal-erro');
        err.textContent = 'Erro de conexão';
        err.classList.add('visivel');
        btn.disabled = false; btn.textContent = id ? 'Salvar alterações' : 'Criar vaga';
      }
    }

    async function mudarStatus(id, novoStatus) {
      try {
        const r = await authFetch(API + '/api/empresa/vagas/' + id + '/status', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: novoStatus })
        });
        const data = await r.json();
        if (!r.ok) { toast(data.erro || 'Erro', 'erro'); return; }
        toast(`Status atualizado: ${statusLabel(novoStatus)}`, 'sucesso');
        carregar();
      } catch (e) { console.error(e); toast('Erro de conexão', 'erro'); }
    }

    function confirmarEncerrar(id, titulo) {
      if (!confirm(`Encerrar a vaga "${titulo}"?\n\nCandidatos continuam registrados, mas a vaga não receberá novas inscrições.\nVocê pode reabrir depois.`)) return;
      mudarStatus(id, 'encerrada');
    }

    document.getElementById('vagas-busca').addEventListener('input', () => { paginaAtual = 1; render(); });
    document.getElementById('vagas-filtro-status').addEventListener('change', () => { paginaAtual = 1; render(); });

    (async function init() {
      try { await authInit(); } catch (e) { console.warn('refresh falhou', e); }
      const tok = localStorage.getItem('empresa_token');
      if (!tok) { window.location.href = 'login.html'; return; }
      usuario = authRBAC.currentUser() || {};
      podeEditar = authRBAC.hasRole('admin_empresa', 'recrutador');

      // Sidebar
      const avatar = document.getElementById('avatar');
      const nome = document.getElementById('user-nome');
      const empresa = document.getElementById('user-empresa');
      if (avatar && usuario.nome) avatar.textContent = iniciais(usuario.nome);
      if (nome) nome.textContent = usuario.nome || '—';
      if (empresa) empresa.textContent = (usuario.role ? '[' + usuario.role + '] ' : '') + (usuario.empresa_nome || usuario.email || '—');

      if (authRBAC.hasRole('admin_empresa')) {
        const navEq = document.getElementById('nav-equipe');
        if (navEq) navEq.style.display = '';
      }
      if (podeEditar) {
        const btn = document.getElementById('btn-nova-vaga');
        if (btn) btn.style.display = '';
      }

      carregar();
    })();
  </script>
</body>
</html>
