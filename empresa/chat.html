<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Chat · Portal Empresa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="empresa.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* ── Shell de chat (ocupa o main inteiro) ── */
    .chat-shell {
      display: flex; height: calc(100vh - 64px); overflow: hidden;
      background: #f5f5f5;
    }
    /* ── Coluna esquerda ── */
    .conv-list {
      width: 340px; min-width: 280px; max-width: 340px;
      background: #fff; border-right: 1px solid var(--borda);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: transform 0.25s;
    }
    .conv-list-head {
      padding: 16px 20px 12px; border-bottom: 1px solid var(--borda); flex-shrink: 0;
    }
    .conv-list-head h2 { margin: 0 0 10px; font-size: 18px; color: var(--vinho); }
    .conv-search {
      width: 100%; padding: 8px 12px; border: 1px solid var(--borda);
      border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;
      font-family: inherit;
    }
    .conv-search:focus { border-color: var(--vinho); }
    .conv-filtros {
      display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--borda);
      flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
    }
    .conv-filtros::-webkit-scrollbar { display: none; }
    .conv-filtros button {
      padding: 5px 12px; border: 1px solid var(--borda); border-radius: 999px;
      background: #fff; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
      font-family: inherit; color: var(--cinza-medio);
    }
    .conv-filtros button.ativo { background: var(--vinho); color: #fff; border-color: var(--vinho); }
    .conv-items { flex: 1; overflow-y: auto; }
    .conv-item {
      display: flex; gap: 12px; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
      cursor: pointer; transition: background 0.15s; position: relative;
    }
    .conv-item:hover { background: #fafafa; }
    .conv-item.ativo { background: #fff5f5; }
    .conv-item.nao-lida { background: #fffaf5; }
    .conv-avatar {
      width: 44px; height: 44px; border-radius: 50%; background: var(--vinho);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .conv-meta { flex: 1; min-width: 0; }
    .conv-meta .nome { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta .vaga { font-size: 12px; color: var(--cinza-medio); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta .preview { font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .conv-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .conv-side .hora { font-size: 11px; color: var(--cinza-medio); }
    .badge-nao-lidas {
      background: var(--vinho); color: #fff; font-size: 11px; font-weight: 700;
      min-width: 20px; height: 20px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }
    .conv-vazio { padding: 40px 20px; text-align: center; color: var(--cinza-medio); }
    .conv-vazio .icon { font-size: 36px; margin-bottom: 8px; }

    /* ── Painel direito ── */
    .conv-panel {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      background: #f5f5f5;
    }
    .conv-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--cinza-medio); text-align: center; padding: 40px;
    }
    .conv-empty .icon { font-size: 48px; margin-bottom: 12px; }
    /* Cabeçalho da conversa */
    .chat-header {
      background: #fff; border-bottom: 1px solid var(--borda);
      padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .chat-header .btn-voltar {
      display: none; background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px;
    }
    .chat-header .info-cand { flex: 1; min-width: 0; }
    .chat-header .info-cand .nome { font-weight: 700; font-size: 16px; }
    .chat-header .info-cand .sub {
      font-size: 12px; color: var(--cinza-medio); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px;
    }
    .chat-header .info-cand .sub .etapa-badge {
      background: var(--dourado); color: var(--vinho); padding: 2px 8px; border-radius: 999px;
      font-weight: 600; font-size: 11px;
    }
    .chat-header .acoes { display: flex; gap: 6px; }
    .chat-header .acoes a, .chat-header .acoes button {
      background: none; border: 1px solid var(--borda); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer; text-decoration: none;
      color: var(--vinho); font-weight: 500; font-family: inherit;
    }
    .chat-header .acoes a:hover, .chat-header .acoes button:hover { background: #fff5f5; }
    /* Mensagens */
    .chat-msgs {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg { display: flex; flex-direction: column; max-width: 70%; }
    .msg.empresa { align-self: flex-end; align-items: flex-end; }
    .msg.candidato { align-self: flex-start; align-items: flex-start; }
    .msg-bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.empresa .msg-bubble { background: var(--vinho); color: #fff; border-bottom-right-radius: 4px; }
    .msg.candidato .msg-bubble { background: #fff; color: #222; border: 1px solid var(--borda); border-bottom-left-radius: 4px; }
    .msg-meta {
      font-size: 11px; color: var(--cinza-medio); margin-top: 3px;
      display: flex; gap: 6px; align-items: center;
    }
    .msg-lida { color: var(--vinho); }
    .msg-sep { text-align: center; color: var(--cinza-medio); font-size: 12px; margin: 12px 0; }
    /* Input */
    .chat-input-area {
      background: #fff; border-top: 1px solid var(--borda);
      padding: 12px 20px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .template-bar {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .template-bar select {
      padding: 6px 10px; border: 1px solid var(--borda); border-radius: 6px;
      font-size: 13px; font-family: inherit; background: #fff; flex: 1;
      max-width: 300px; color: var(--cinza-medio);
    }
    .template-bar select:focus { outline: none; border-color: var(--vinho); }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .chat-ta {
      flex: 1; padding: 10px 14px; border: 1px solid var(--borda);
      border-radius: 12px; resize: none; font-size: 14px; font-family: inherit;
      line-height: 1.5; max-height: 120px; outline: none; overflow-y: auto;
    }
    .chat-ta:focus { border-color: var(--vinho); }
    .btn-enviar {
      background: var(--vinho); color: #fff; border: none;
      border-radius: 10px; padding: 10px 18px; font-size: 14px;
      font-weight: 600; cursor: pointer; flex-shrink: 0; font-family: inherit;
    }
    .btn-enviar:disabled { opacity: 0.5; cursor: default; }
    .char-count { font-size: 11px; color: var(--cinza-medio); text-align: right; }

    /* ── Encerrado ── */
    .chat-encerrado-banner {
      background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
      padding: 10px 16px; font-size: 13px; color: #856404; margin: 0 20px 8px; text-align: center;
    }

    /* ── Iniciar conversa ── */
    .btn-iniciar {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--vinho); color: #fff; border: none;
      border-radius: 8px; padding: 10px 20px; font-size: 14px;
      font-weight: 600; cursor: pointer; margin-top: 16px; font-family: inherit;
    }
    .btn-iniciar:hover { opacity: 0.9; }

    /* ── Loading ── */
    .loader { text-align: center; color: var(--cinza-medio); padding: 20px; font-size: 14px; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      .chat-shell { height: calc(100vh - 56px); }
      .conv-list {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 200;
        width: 100%; max-width: 100%; border-right: none;
        transform: translateX(0);
      }
      .conv-list.oculto { transform: translateX(-100%); }
      .conv-panel { width: 100%; }
      .chat-header .btn-voltar { display: block; }
      .msg { max-width: 85%; }
    }
  </style>
</head>

<script>
(async function() {
  setStorageKeys('empresa_token', 'empresa_refresh', 'empresa_usuario');
  try { await authInit(); } catch(e) { console.warn('refresh falhou', e); }
  if (!localStorage.getItem('empresa_token')) { window.location.href = 'login.html'; return; }

  const onReady = () => {
    if (authRBAC.hasRole('admin_empresa')) {
      const navEq = document.getElementById('nav-equipe');
      if (navEq) navEq.style.display = '';
    }
    const u = authRBAC.currentUser() || {};
    const avatar = document.getElementById('avatar');
    const nomeEl = document.getElementById('user-nome');
    const empEl  = document.getElementById('user-empresa');
    if (avatar && u.nome) avatar.textContent = u.nome.split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
    if (nomeEl) nomeEl.textContent = u.nome || '—';
    if (empEl)  empEl.textContent  = (u.role ? '['+u.role+'] ' : '') + (u.empresa_nome || u.email || '—');
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onReady);
  else onReady();
})();

function sair() {
  if (typeof window.empresaSair === 'function') { empresaSair(); return; }
  localStorage.removeItem('empresa_token');
  localStorage.removeItem('empresa_refresh');
  localStorage.removeItem('empresa_usuario');
  window.location.href = 'login.html';
}
</script>

<script>
(function() {
  'use strict';
  const API = 'https://recrutamento-api-novo.onrender.com';
  function tok() { return localStorage.getItem('empresa_token') || ''; }
  function apiFetch(path, opts={}) {
    return fetch(API + path, { ...opts, headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + tok(), ...(opts.headers||{}) } });
  }

  let conversas = [];
  let conversaAtiva = null;
  let pollInterval = null;
  let filtroAtual  = 'todos';
  let templates    = [];
  let isViewer     = false;

  // ── Utilitários ─────────────────────────────────────────────────────────
  function fmtHora(iso) {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    const diff = (now - d) / 3600000;
    if (diff < 24) return d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    if (diff < 168) return d.toLocaleDateString('pt-BR', { weekday:'short' });
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
  }
  function fmtHoraFull(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function iniciais(nome) {
    return (nome||'?').split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
  }
  function etapaNome(ca) {
    const etapas = ['Inscrição','Triagem','RH','Gestor','Proposta','Documentos','Contratação'];
    return etapas[ca?.etapa_atual] || `Etapa ${(ca?.etapa_atual||0)+1}`;
  }

  // ── Detectar role ────────────────────────────────────────────────────────
  function detectRole() {
    const u = typeof authRBAC !== 'undefined' ? authRBAC.currentUser() : {};
    isViewer = (u?.role === 'viewer');
  }

  // ── Lista de conversas ───────────────────────────────────────────────────
  async function carregarLista(forceQ) {
    const q = forceQ !== undefined ? forceQ : (document.getElementById('conv-search')?.value || '');
    const params = new URLSearchParams({ limite: 50 });
    if (q.trim()) params.set('q', q.trim());
    if (filtroAtual === 'nao_lidas') params.set('nao_lidas', '1');
    if (filtroAtual === 'encerradas') params.set('status', 'encerrada');
    if (filtroAtual === 'ativas') params.set('status', 'ativa');

    try {
      const r = await apiFetch('/api/empresa/chat?' + params.toString());
      if (r.status === 401) { window.location.href = 'login.html'; return; }
      const d = await r.json();
      conversas = d.conversas || [];
      renderLista();
    } catch(e) {
      console.error('[chat lista]', e);
    }
  }

  function renderLista() {
    const el = document.getElementById('conv-items');
    if (conversas.length === 0) {
      el.innerHTML = `<div class="conv-vazio"><div class="icon">💬</div><p>Nenhuma conversa encontrada.</p></div>`;
      return;
    }
    el.innerHTML = conversas.map(c => {
      const naoLidas = Number(c.nao_lidas_empresa || 0);
      const ativo = conversaAtiva?.candidatura_id == c.candidatura_id ? 'ativo' : '';
      const nl = naoLidas > 0 ? 'nao-lida' : '';
      return `<div class="conv-item ${ativo} ${nl}" onclick="abrirConversa(${c.candidatura_id})">
        <div class="conv-avatar">${esc(iniciais(c.candidato_nome))}</div>
        <div class="conv-meta">
          <div class="nome">${esc(c.candidato_nome)}</div>
          <div class="vaga">${esc(c.vaga_titulo)}</div>
          <div class="preview">${c.ultima_msg ? esc(c.ultima_msg.substring(0,60)) : '<em>Sem mensagens</em>'}</div>
        </div>
        <div class="conv-side">
          <span class="hora">${fmtHora(c.ultima_msg_em)}</span>
          ${naoLidas > 0 ? `<span class="badge-nao-lidas">${naoLidas}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  // ── Abrir conversa ───────────────────────────────────────────────────────
  window.abrirConversa = async function(candidaturaId) {
    // Mobile: esconde lista
    document.getElementById('conv-list').classList.add('oculto');

    // Buscar detalhes da candidatura
    let ca;
    try {
      const r = await apiFetch(`/api/empresa/candidatura/${candidaturaId}`);
      ca = r.ok ? (await r.json()) : null;
    } catch(e) { ca = null; }

    conversaAtiva = ca || { candidatura_id: candidaturaId };

    // Marcar como lida
    apiFetch(`/api/empresa/chat/${candidaturaId}/lidas`, { method:'PATCH' }).catch(()=>{});

    // Atualizar badge na lista
    const item = conversas.find(c => c.candidatura_id == candidaturaId);
    if (item) { item.nao_lidas_empresa = 0; renderLista(); }

    renderPainel(ca);
    await carregarMensagens(candidaturaId);

    // Polling
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(() => carregarMensagens(candidaturaId), 8000);
  };

  function renderPainel(ca) {
    const etapa = etapaNome(ca);
    const encerrado = ca?.chat_encerrado_empresa_em || ca?.chat_encerrado_candidato_em;
    const btnEncerrar = (!encerrado && !isViewer) ?
      `<button onclick="encerrarConversa(${ca?.candidatura_id})" style="color:#c00;">Encerrar</button>` : '';
    const linkCand = ca?.candidatura_id ?
      `<a href="analisar.html?id=${ca.candidatura_id}" target="_blank">Ver candidatura ↗</a>` : '';

    document.getElementById('conv-panel').innerHTML = `
      <div class="chat-header" id="chat-header">
        <button class="btn-voltar" onclick="voltarLista()" title="Voltar">←</button>
        <div class="info-cand">
          <div class="nome">${esc(ca?.nome || ca?.candidato_nome || 'Candidato')}</div>
          <div class="sub">
            <span>${esc(ca?.vaga_titulo || ca?.titulo_vaga || '—')}</span>
            <span class="etapa-badge">${esc(etapa)}</span>
            <span>${esc(ca?.status || '—')}</span>
          </div>
        </div>
        <div class="acoes">${linkCand}${btnEncerrar}</div>
      </div>
      ${encerrado ? `<div class="chat-encerrado-banner">💬 Conversa encerrada em ${fmtHoraFull(encerrado)}</div>` : ''}
      <div class="chat-msgs" id="chat-msgs"><div class="loader">Carregando…</div></div>
      ${!encerrado && !isViewer ? renderInputArea() : ''}
    `;

    // Attach events
    const ta = document.getElementById('chat-ta');
    if (ta) {
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensagem(); }
      });
      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
        const cc = document.getElementById('char-count');
        if (cc) cc.textContent = ta.value.length + '/2000';
      });
    }
    const sel = document.getElementById('template-sel');
    if (sel) {
      popularTemplates(sel);
      sel.addEventListener('change', () => {
        const t = templates.find(t => String(t.id) === sel.value);
        if (t && ta) { ta.value = t.texto; ta.dispatchEvent(new Event('input')); ta.focus(); }
        sel.value = '';
      });
    }
  }

  function renderInputArea() {
    return `
      <div class="chat-input-area">
        <div class="template-bar">
          <select id="template-sel"><option value="">💬 Mensagem rápida…</option></select>
        </div>
        <div class="input-row">
          <textarea id="chat-ta" class="chat-ta" rows="1" placeholder="Digite sua mensagem… (Enter envia, Shift+Enter pula linha)" maxlength="2000"></textarea>
          <button class="btn-enviar" id="btn-enviar" onclick="enviarMensagem()">Enviar ↗</button>
        </div>
        <div class="char-count" id="char-count">0/2000</div>
      </div>`;
  }

  async function popularTemplates(sel) {
    try {
      const r = await apiFetch('/api/empresa/chat/templates');
      if (!r.ok) return;
      const d = await r.json();
      templates = d.templates || [];
      templates.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id;
        o.textContent = t.titulo;
        sel.appendChild(o);
      });
    } catch(e) { /* silencioso */ }
  }

  // ── Carregar mensagens ───────────────────────────────────────────────────
  let lastMsgCount = 0;
  async function carregarMensagens(cid, scrollForce) {
    try {
      const r = await apiFetch(`/api/empresa/chat/${cid}`);
      if (!r.ok) return;
      const d = await r.json();
      const msgs = d.mensagens || [];
      const el = document.getElementById('chat-msgs');
      if (!el) return;
      if (msgs.length === lastMsgCount && !scrollForce) return;
      lastMsgCount = msgs.length;
      renderMensagens(el, msgs, 'empresa');
    } catch(e) { console.error('[chat msgs]', e); }
  }

  function renderMensagens(el, msgs, ladoLocal) {
    if (msgs.length === 0) {
      el.innerHTML = `<div class="conv-vazio"><div class="icon">💬</div><p>Nenhuma mensagem ainda. Inicie a conversa!</p></div>`;
      return;
    }
    let html = '';
    let dataAnterior = '';
    msgs.forEach(m => {
      const d = new Date(m.criado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
      if (d !== dataAnterior) {
        html += `<div class="msg-sep">${d}</div>`;
        dataAnterior = d;
      }
      const lado = m.autor_tipo === 'admin' || m.autor_tipo === 'empresa' ? 'empresa' : 'candidato';
      const hora = new Date(m.criado_em).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      const lida = lado === 'empresa' && m.lida_por_candidato_em;
      const lidaEl = lado === 'empresa' ? `<span class="${lida ? 'msg-lida' : ''}">${lida ? '✓✓' : '✓'}</span>` : '';
      html += `<div class="msg ${lado}">
        <div class="msg-bubble">${esc(m.texto)}</div>
        <div class="msg-meta">
          <span>${esc(m.autor_nome || '—')}</span>
          <span>${hora}</span>
          ${lidaEl}
        </div>
      </div>`;
    });
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  }

  // ── Enviar mensagem ──────────────────────────────────────────────────────
  window.enviarMensagem = async function() {
    if (!conversaAtiva) return;
    const ta = document.getElementById('chat-ta');
    const btn = document.getElementById('btn-enviar');
    if (!ta || !btn) return;
    const texto = ta.value.trim();
    if (!texto) return;
    if (texto.length > 2000) { alert('Mensagem muito longa (máx 2000 caracteres)'); return; }
    btn.disabled = true;
    try {
      const cid = conversaAtiva.candidatura_id || conversaAtiva.id;
      const r = await apiFetch(`/api/empresa/chat/${cid}/mensagens`, {
        method:'POST', body: JSON.stringify({ texto })
      });
      if (!r.ok) {
        const err = await r.json().catch(()=>({}));
        alert(err.erro || 'Erro ao enviar'); return;
      }
      ta.value = '';
      ta.style.height = 'auto';
      const cc = document.getElementById('char-count');
      if (cc) cc.textContent = '0/2000';
      lastMsgCount = 0;
      await carregarMensagens(cid, true);
      await carregarLista();
    } catch(e) {
      alert('Erro de conexão: ' + e.message);
    } finally {
      btn.disabled = false;
      if (ta) ta.focus();
    }
  };

  // ── Encerrar conversa ────────────────────────────────────────────────────
  window.encerrarConversa = async function(cid) {
    if (!confirm('Encerrar esta conversa? O candidato também não poderá mais enviar mensagens.')) return;
    try {
      const r = await apiFetch(`/api/empresa/chat/${cid}/encerrar`, { method:'PATCH' });
      if (r.ok) { await abrirConversa(cid); await carregarLista(); }
      else { const err = await r.json(); alert(err.erro || 'Erro'); }
    } catch(e) { alert('Erro de conexão'); }
  };

  // ── Voltar (mobile) ──────────────────────────────────────────────────────
  window.voltarLista = function() {
    document.getElementById('conv-list').classList.remove('oculto');
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    conversaAtiva = null;
    lastMsgCount = 0;
    document.getElementById('conv-panel').innerHTML = `
      <div class="conv-empty" id="conv-empty">
        <div class="icon">💬</div>
        <h3>Selecione uma conversa</h3>
        <p>Escolha um candidato na lista para ver as mensagens.</p>
      </div>`;
  };

  // ── Filtros e busca ──────────────────────────────────────────────────────
  window.setFiltro = function(f, btn) {
    filtroAtual = f;
    document.querySelectorAll('.conv-filtros button').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    carregarLista();
  };

  // Debounce busca
  let searchTimer;
  document.addEventListener('DOMContentLoaded', () => {
    const s = document.getElementById('conv-search');
    if (s) s.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => carregarLista(), 350);
    });
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  function init() {
    detectRole();
    // Abrir direto por URL ?cid=...
    const params = new URLSearchParams(window.location.search);
    const cid = params.get('cid');
    carregarLista().then(() => { if (cid) abrirConversa(cid); });
    setInterval(carregarLista, 15000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
