<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Notificações — Admin · VagasIO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #f5f5f5;
  --card: #fff;
  --border: #e0e0e0;
  --text: #222;
  --text-soft: #666;
  --primary: #7B1F1F;
  --gold: #D4AF37;
}
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
header h1 { margin: 0; font-size: 22px; color: var(--primary); }
header .acoes { margin-left: auto; display: flex; gap: 8px; }
header .acoes button, header .acoes a { background: var(--primary); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; }
header .acoes button:hover { opacity: 0.9; }
header .acoes button.secondary { background: #888; }
main { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
.toolbar { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.toolbar select, .toolbar button { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; }
.toolbar button { background: var(--gold); border-color: var(--gold); color: #222; font-weight: 600; }
.feed { display: flex; flex-direction: column; gap: 10px; }
.notif { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 8px; padding: 14px 18px; display: flex; gap: 12px; cursor: pointer; transition: background 0.15s; }
.notif:hover { background: #fafafa; }
.notif.nao-lida { border-left-color: var(--primary); background: #fffafa; }
.notif .icone { font-size: 28px; flex-shrink: 0; }
.notif .conteudo { flex: 1; min-width: 0; }
.notif .titulo { font-weight: 600; margin: 0 0 4px; }
.notif .mensagem { color: var(--text-soft); font-size: 14px; margin: 0 0 6px; }
.notif .meta { color: var(--text-soft); font-size: 12px; display: flex; gap: 10px; }
.notif .badge { background: var(--primary); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
.vazio { text-align: center; color: var(--text-soft); padding: 40px; }
</style>
  <link rel="stylesheet" href="empresa-shell.css?v=20260803shell4">
</head>
<body>
<header>
  <h1>🔔 Notificações</h1>
  <div class="acoes">
    <button onclick="marcarTodas()" class="secondary">Marcar todas como lidas</button>
    <button onclick="atualizar()">Atualizar</button>
    <a href="index.html">← Voltar</a>
  </div>
</header>
<main>
  <div class="toolbar">
    <label>Filtrar:
      <select id="filtro-tipo" onchange="atualizar()">
        <option value="">Todas</option>
        <option value="candidatura_criada">🆕 Nova candidatura</option>
        <option value="etapa_avancada">⬆ Etapa avançada</option>
        <option value="status_alterado">🔄 Status alterado</option>
        <option value="docs_aprovados">✅ Docs aprovados</option>
        <option value="proposta_enviada">📨 Proposta enviada</option>
        <option value="proposta_aceita">✅ Proposta aceita</option>
        <option value="proposta_recusada">❌ Proposta recusada</option>
        <option value="candidato_desistiu">🚪 Desistência</option>
      </select>
    </label>
    <label>Lidas:
      <select id="filtro-lida" onchange="atualizar()">
        <option value="todas">Todas</option>
        <option value="false">Só não lidas</option>
        <option value="true">Só lidas</option>
      </select>
    </label>
    <span id="contador" style="margin-left:auto;color:#888;font-size:14px"></span>
  </div>
  <div class="feed" id="feed">Carregando…</div>
</main>
<script src="auth-helper.js?v=fase4_2026_07_28"></script>
<script src="empresa-auth-init.js?v=fase4_2026_07_28"></script>
<script src="empresa-auth-patch.js?v=fase4_2026_07_28"></script>
<script>
const API = 'https://recrutamento-api-novo.onrender.com';
let cache = [];

function getToken() { return localStorage.getItem('empresa_token'); }

async function atualizar() {
  const tipo = document.getElementById('filtro-tipo').value;
  const lida = document.getElementById('filtro-lida').value;
  const qs = new URLSearchParams();
  if (tipo) qs.set('tipo', tipo);
  if (lida !== 'todas') qs.set('lida', lida);
  qs.set('limit', '50');
  const r = await authFetch(API + '/api/notificacoes?' + qs, {
    headers: { 'Authorization': 'Bearer ' + (authTokens.getAccess() || getToken()) }
  });
  const d = await r.json();
  cache = d.notificacoes || [];
  render();
}

function render() {
  const feed = document.getElementById('feed');
  document.getElementById('contador').textContent = `${cache.length} notificações`;
  if (cache.length === 0) {
    feed.innerHTML = '<div class="vazio">Nenhuma notificação encontrada.</div>';
    return;
  }
  feed.innerHTML = cache.map(n => `
    <div class="notif ${n.lida_em ? '' : 'nao-lida'}" onclick="abrir(${n.id}, '${n.referencia_tipo || ''}', ${n.referencia_id || 'null'})">
      <div class="icone">${icone(n.tipo)}</div>
      <div class="conteudo">
        <p class="titulo">${escape(n.titulo)}${!n.lida_em ? '<span class="badge">NOVA</span>' : ''}</p>
        ${n.mensagem ? `<p class="mensagem">${escape(n.mensagem)}</p>` : ''}
        <div class="meta">
          <span>${formatarData(n.criada_em)}</span>
          <span>·</span>
          <span>${n.tipo}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function icone(tipo) {
  return ({
    'candidatura_criada': '🆕',
    'candidatura_recebida': '✅',
    'etapa_avancada': '⬆',
    'etapa_alterada': '🔄',
    'status_alterado': '🔄',
    'docs_aprovados': '✅',
    'proposta_enviada': '📨',
    'proposta_aceita': '🎉',
    'proposta_recusada': '❌',
    'candidato_desistiu': '🚪',
    'candidato_reprovado': '❌',
    'candidato_contratado': '🎉',
    'candidato_reaberto': '🔓'
  })[tipo] || '🔔';
}

async function abrir(id, tipo, refId) {
  // Marca como lida (best-effort)
  await authFetch(API + '/api/notificacoes/' + id + '/lida', {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + (authTokens.getAccess() || getToken()) }
  });
  if (tipo === 'candidatura' && refId) {
    window.location.href = 'analisar.html?id=' + refId;
  } else {
    atualizar();
  }
}

async function marcarTodas() {
  await authFetch(API + '/api/notificacoes/marcar-todas-lidas', {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + (authTokens.getAccess() || getToken()) }
  });
  atualizar();
}

function escape(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function formatarData(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `${Math.floor(diff / 60)}min atrás`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h atrás`;
  return d.toLocaleDateString('pt-BR');
}

let notificacoesAtivas = false;
(async function initNotificacoes() {
  try { await authInit(); } catch (_) {}
  if (!authTokens.getAccess()) {
    document.getElementById('feed').innerHTML = '<div class="vazio">Sessão expirada. <a href="login.html">Entrar novamente</a></div>';
    return;
  }
  notificacoesAtivas = true;
  await atualizar();
})();
// Polling leve a cada 60s somente depois de uma sessão válida.
setInterval(() => { if (notificacoesAtivas) atualizar().catch(() => {}); }, 60_000);
</script>
<script src="empresa-shell.js?v=20260803shell4"></script>
</body>
</html>
