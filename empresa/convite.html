<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aceitar convite — VagasIO</title><style>
:root{--wine:#722F37;--deep:#4A1F25;--bg:#F7F6F8;--border:#E8E1E5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);font-family:Inter,Arial,sans-serif;color:#30242C}.card{width:min(440px,100%);padding:28px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 12px 35px rgba(42,19,29,.1)}.logo{display:block;width:150px;height:auto;margin:0 auto 22px;background:var(--deep);border-radius:8px;padding:10px}.card h1{margin:0;text-align:center;font-size:20px}.card p{margin:8px 0;color:#756971;font-size:13px;line-height:1.5;text-align:center}.info{margin:18px 0;padding:12px;border-radius:8px;background:#FCFAFB;font-size:12px;line-height:1.6}.field{display:grid;gap:5px;margin-top:12px;color:#756971;font-size:12px}.field input{height:40px;padding:0 10px;border:1px solid var(--border);border-radius:7px;outline:0;font:inherit}.field input:focus{border-color:#B98695;box-shadow:0 0 0 3px rgba(114,47,55,.08)}button{width:100%;height:40px;margin-top:16px;border:0;border-radius:7px;color:#fff;background:var(--wine);font:700 13px inherit;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:12px;padding:10px;border-radius:7px;font-size:12px;line-height:1.4}.err{color:#9B2C4B;background:#FBECEF}.ok{color:#337957;background:#EAF7F1}.loading{color:#958990;text-align:center}
</style>  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body><main class="card"><img class="logo" src="../divulgacao/assets/logo-vagasio-footer.png" alt="VagasIO"><h1>Aceitar convite</h1><p id="intro">Consultando seu convite...</p><div id="info" class="info loading">Carregando...</div><form id="form" hidden><label class="field">Defina sua senha<input id="senha" type="password" minlength="8" autocomplete="new-password" required></label><label class="field">Confirme sua senha<input id="confirma" type="password" minlength="8" autocomplete="new-password" required></label><button id="btn" type="submit">Criar meu acesso</button></form><div id="msg"></div></main><script>
const API='https://recrutamento-api-novo.onrender.com';const token=new URLSearchParams(location.search).get('token');let convite=null;const info=document.getElementById('info'),form=document.getElementById('form'),msg=document.getElementById('msg');function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function message(text,ok=false){msg.className='msg '+(ok?'ok':'err');msg.textContent=text;}async function carregar(){if(!token){info.className='info msg err';info.textContent='Convite não informado.';return;}try{const r=await fetch(API+'/api/empresa/convite/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.erro||'Convite inválido ou expirado');convite=d.convite;info.className='info';info.innerHTML='<strong>'+esc(convite.nome)+'</strong><br>'+esc(convite.email)+'<br>Empresa: '+esc(convite.empresa_nome)+'<br>Função: '+esc(convite.role);document.getElementById('intro').textContent='Defina sua senha para ativar o acesso ao portal.';form.hidden=false;}catch(e){info.className='info msg err';info.textContent=e.message;}}form.addEventListener('submit',async e=>{e.preventDefault();const senha=document.getElementById('senha').value,conf=document.getElementById('confirma').value;if(senha!==conf){message('As senhas não coincidem.');return;}const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Criando acesso...';try{const r=await fetch(API+'/api/empresa/convite/'+encodeURIComponent(token)+'/aceitar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha})});const d=await r.json();if(!r.ok)throw new Error(d.erro||'Não foi possível aceitar o convite');message('Acesso criado com sucesso. Você já pode entrar no portal da empresa.',true);form.hidden=true;}catch(e){message(e.message);btn.disabled=false;btn.textContent='Criar meu acesso';}});carregar();
</script></body></html>
