<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Empresa · Vagas.io</title>
  <!-- CSS é inline (<style>) neste arquivo; link externo removido -->
  <style>
    :root {
      --vinho: #722F37;
      --vinho-claro: #8a3a44;
      --dourado: #C9A961;
      --bg: #f7f5f2;
      --card: #ffffff;
      --texto: #1a1a1a;
      --texto-suave: #6b6b6b;
      --borda: #e5e0d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #722F37 0%, #4a1f25 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo .marca {
      font-size: 32px;
      font-weight: 800;
      color: var(--vinho);
      letter-spacing: -0.5px;
    }

    .logo .marca .dourado { color: var(--dourado); }

    .logo .subtitulo {
      font-size: 13px;
      color: var(--texto-suave);
      margin-top: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 20px;
      color: var(--texto);
      margin-bottom: 8px;
      text-align: center;
    }

    .sub {
      text-align: center;
      color: var(--texto-suave);
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 6px;
      margin-top: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--borda);
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--vinho);
      box-shadow: 0 0 0 3px rgba(114,47,55,0.1);
    }

    .btn-entrar {
      width: 100%;
      background: var(--vinho);
      color: #fff;
      border: 0;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }

    .btn-entrar:hover { background: var(--vinho-claro); }
    .btn-entrar:disabled { opacity: 0.6; cursor: not-allowed; }

    .erro {
      background: #fee;
      color: #c33;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .erro.ativo { display: block; }

    .rodape {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--texto-suave);
    }

    .rodape a {
      color: var(--vinho);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="marca">VagasIO</div>
      <div class="subtitulo">Portal da Empresa</div>
    </div>

    <h1>Acessar Portal</h1>
    <p class="sub">Entre com seu e-mail corporativo</p>

    <form id="form-login" onsubmit="return fazerLogin(event)">
      <label for="email">E-mail</label>
      <input type="email" id="email" required placeholder="seu@empresa.com.br" autocomplete="email" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" required placeholder="••••••" autocomplete="current-password" />

      <div class="erro" id="erro"></div>

      <button type="submit" class="btn-entrar" id="btn-entrar">Entrar</button>
    </form>

    <!-- Fase 10: formulário de 2FA (oculto até ser necessário) -->
    <form id="form-2fa" style="display:none" onsubmit="return verificar2FA(event)">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:32px;margin-bottom:8px;">🔐</div>
        <p style="font-weight:600;font-size:16px;margin-bottom:4px;">Verificação em duas etapas</p>
        <p style="font-size:13px;color:#666;">Digite o código do seu app autenticador (6 dígitos)<br>ou um código de recuperação (8 caracteres)</p>
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label for="cod-2fa">Código</label>
        <input type="text" id="cod-2fa" maxlength="8" inputmode="numeric" autocomplete="one-time-code"
               placeholder="000000" style="font-size:22px;letter-spacing:6px;text-align:center;" required>
      </div>
      <p id="err-2fa" style="color:#C62828;font-size:13px;min-height:18px;margin-bottom:8px;"></p>
      <button type="submit" class="btn-entrar" id="btn-2fa">Verificar</button>
      <button type="button" onclick="voltar2FA()" style="display:block;width:100%;margin-top:8px;background:none;border:1px solid var(--borda);color:#555;padding:10px;border-radius:6px;cursor:pointer;font-size:14px;">← Voltar</button>
    </form>

    <div class="rodape">
      <a href="esqueci-senha.html" style="color:var(--vinho)">Esqueci minha senha</a> ·
      <a href="https://vagasio.com.br">← Voltar para o site</a>
    </div>
  </div>

  <script>
    const API = 'https://recrutamento-api-v2.onrender.com';

    // Só limpa sessão se veio explicitamente via ?logout=1
    if (window.location.search.includes('logout=1')) {
      localStorage.removeItem('empresa_token');
      localStorage.removeItem('empresa_refresh');
      localStorage.removeItem('empresa_usuario');
    }

    // Se já tiver token válido, manda direto pro dashboard
    if (localStorage.getItem('empresa_token')) {
      window.location.href = 'index.html';
    }

    function mostrarErro(msg) {
      const el = document.getElementById('erro');
      el.textContent = msg;
      el.classList.add('ativo');
      setTimeout(() => el.classList.remove('ativo'), 5000);
    }

    async function fazerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btn-entrar');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const r = await fetch(API + '/api/auth/login-empresa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const data = await r.json();
        if (!r.ok) {
          mostrarErro(data.erro || 'Erro ao entrar');
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return false;
        }

        // Fase 10: 2FA ativo → pede código TOTP
        if (data.requer_2fa && data.pending_token) {
          sessionStorage.setItem('empresa_pending_token', data.pending_token);
          sessionStorage.setItem('empresa_pending_email', email);
          // Exibe campo de código 2FA
          document.getElementById('form-login').style.display = 'none';
          document.getElementById('form-2fa').style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return false;
        }

        localStorage.setItem('empresa_token', data.token);
        if (data.refreshToken) localStorage.setItem('empresa_refresh', data.refreshToken);
        localStorage.setItem('empresa_usuario', JSON.stringify(data.usuario));
        const dest = data.usuario?.primeiro_acesso ? 'onboarding.html' : 'index.html';
        window.location.href = dest;
        return false;
      } catch (err) {
        mostrarErro('Erro de conexão. Tente novamente.');
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return false;
      }
    }

    async function verificar2FA(e) {
      e && e.preventDefault();
      const codigo = document.getElementById('cod-2fa').value.trim();
      const pending_token = sessionStorage.getItem('empresa_pending_token');
      if (!pending_token || !/^\d{6}$/.test(codigo) && codigo.length !== 8) {
        document.getElementById('err-2fa').textContent = 'Código inválido.';
        return;
      }
      const btn2 = document.getElementById('btn-2fa');
      btn2.disabled = true; btn2.textContent = 'Verificando...';
      try {
        const r = await fetch(API + '/api/empresa/2fa/verificar', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pending_token, codigo })
        });
        const data = await r.json();
        if (!r.ok) {
          document.getElementById('err-2fa').textContent = data.erro || 'Código incorreto.';
          btn2.disabled = false; btn2.textContent = 'Verificar';
          return;
        }
        sessionStorage.removeItem('empresa_pending_token');
        sessionStorage.removeItem('empresa_pending_email');
        localStorage.setItem('empresa_token', data.token);
        if (data.refreshToken) localStorage.setItem('empresa_refresh', data.refreshToken);
        localStorage.setItem('empresa_usuario', JSON.stringify(data.usuario));
        const dest = data.usuario?.primeiro_acesso ? 'onboarding.html' : 'index.html';
        window.location.href = dest;
      } catch {
        document.getElementById('err-2fa').textContent = 'Erro de conexão.';
        btn2.disabled = false; btn2.textContent = 'Verificar';
      }
    }

    function voltar2FA() {
      sessionStorage.removeItem('empresa_pending_token');
      document.getElementById('form-login').style.display = 'block';
      document.getElementById('form-2fa').style.display = 'none';
    }
  </script>
</body>
</html>
