<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#722F37">
<title>Vagas · VagasIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f5f5f7; color: #1a1a1a; }
  a { color: inherit; text-decoration: none; }

  .topbar { background: #fff; border-bottom: 1px solid #eee; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .topbar .logo { font-weight: 800; color: #722F37; font-size: 20px; letter-spacing: -0.02em; }
  .topbar .links a { color: #666; font-size: 14px; margin-left: 16px; }
  .topbar .links a:hover { color: #722F37; }

  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
  .header { background: linear-gradient(135deg, #722F37 0%, #8d3a44 100%); color: #fff; padding: 32px 20px; }
  .header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .header .meta { opacity: .9; font-size: 14px; }

  .toolbar {
    background: #fff; border-radius: 12px; padding: 16px;
    margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input {
    flex: 1; min-width: 200px; padding: 10px 14px;
    border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
    font-family: inherit;
  }
  .toolbar input:focus { outline: none; border-color: #722F37; }
  .toolbar select {
    padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff;
  }

  .job-card {
    background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    display: flex; gap: 16px; align-items: center;
    transition: transform .15s, box-shadow .15s;
  }
  .job-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .job-card .job-info { flex: 1; }
  .job-card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 700; }
  .job-card .job-meta { color: #666; font-size: 13px; }
  .job-card .job-meta span { margin-right: 12px; }
  .job-card .job-meta .dot { color: #ccc; margin: 0 4px; }
  .job-card .job-desc { color: #555; font-size: 13px; margin-top: 8px; line-height: 1.5; max-height: 40px; overflow: hidden; }
  .job-card .ver-btn {
    background: #722F37; color: #fff; padding: 10px 20px;
    border-radius: 8px; font-weight: 600; font-size: 14px;
    flex-shrink: 0;
  }

  .empty { background: #fff; border-radius: 12px; padding: 48px 20px; text-align: center; color: #888; }
  .error-box { background: #fee; border: 1px solid #fcc; color: #c33; padding: 24px; border-radius: 12px; text-align: center; }

  .footer { background: #1a1a1a; color: #aaa; padding: 32px 20px; text-align: center; font-size: 13px; margin-top: 48px; }
  .footer .brand { color: #fff; font-weight: 700; margin-bottom: 4px; }
  .footer a { color: #722F37; }

  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #722F37; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { text-align: center; padding: 64px 20px; }

  @media (max-width: 600px) {
    .job-card { flex-direction: column; align-items: stretch; gap: 12px; }
    .job-card .ver-btn { text-align: center; }
    .topbar { padding: 12px 16px; }
    .topbar .links a { font-size: 13px; margin-left: 12px; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <div style="margin-top: 12px; color: #888;">Carregando vagas...</div>
    </div>
  </div>

<script>
const API = 'https://recrutamento-api-novo.onrender.com';
const params = new URLSearchParams(location.search);
const slug = (params.get('slug') || '').toLowerCase().trim();

if (!slug) {
  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="error-box"><strong>Link inválido</strong><p>Esta página precisa de um identificador de empresa.</p></div>
    </div>
  `;
  throw new Error('slug ausente');
}

let TODAS = [];
let empresa = null;

async function carregar() {
  try {
    // Carrega empresa + vagas em paralelo
    const [re, rv] = await Promise.all([
      fetch(`${API}/api/public/empresa/${encodeURIComponent(slug)}`),
      fetch(`${API}/api/public/empresa/${encodeURIComponent(slug)}/vagas`)
    ]);

    if (re.status === 404 || rv.status === 404) { render404(); return; }
    if (!re.ok || !rv.ok) throw new Error('status não-ok');

    const [dadosEmp, dadosVagas] = await Promise.all([re.json(), rv.json()]);
    empresa = dadosEmp.empresa;
    TODAS = dadosEmp.empresa ? [] : TODAS; // zera antes de repopular
    TODAS = dadosVagas.vagas || [];
    render(TODAS);
  } catch (e) {
    console.error(e);
    renderError('Não foi possível carregar as vagas desta empresa.');
  }
}

function render404() {
  document.title = 'Empresa não encontrada · VagasIO';
  document.getElementById('app').innerHTML = `
    <div class="container" style="padding-top:64px;">
      <div class="error-box">
        <h2 style="margin:0 0 12px;font-size:22px;">Empresa não encontrada</h2>
        <p>O link acessado pode estar desatualizado.</p>
        <p><a href="index.html?slug=${encodeURIComponent(slug)}" style="color:#722F37;font-weight:600;">← Voltar ao portal</a></p>
      </div>
    </div>
  `;
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="container" style="padding-top:64px;">
      <div class="error-box">
        <h2 style="margin:0 0 12px;font-size:22px;">Algo deu errado</h2>
        <p>${escapeHtml(msg)}</p>
        <p><a href="javascript:location.reload()" style="color:#722F37;font-weight:600;">Tentar novamente →</a></p>
      </div>
    </div>
  `;
}

function render(vagas) {
  const emp = empresa || { nome: 'Empresa', cor_destaque: '#722F37' };
  document.title = `Vagas em ${emp.nome} · VagasIO`;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', emp.cor_destaque || '#722F37');

  const totalLabel = vagas.length === 1 ? '1 vaga aberta' : `${vagas.length} vagas abertas`;

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <a href="index.html?slug=${encodeURIComponent(slug)}" class="logo">VagasIO</a>
      <div class="links">
        <a href="index.html?slug=${encodeURIComponent(slug)}">Início</a>
        <a href="sobre.html?slug=${encodeURIComponent(slug)}">Sobre</a>
        <a href="/candidato/" style="color:#722F37;font-weight:600;">Sou candidato →</a>
      </div>
    </div>

    <header class="header" style="background:linear-gradient(135deg, ${emp.cor_destaque || '#722F37'} 0%, ${shadeColor(emp.cor_destaque || '#722F37', 15)} 100%);">
      <div class="container" style="padding:0;">
        <div style="font-size:13px;opacity:.9;margin-bottom:6px;">
          <a href="index.html?slug=${encodeURIComponent(slug)}" style="color:#fff;text-decoration:underline;">${escapeHtml(emp.nome)}</a> ›
        </div>
        <h1>Vagas abertas</h1>
        <div class="meta">${totalLabel}</div>
      </div>
    </header>

    <div class="container">
      <div class="toolbar">
        <input type="search" id="busca" placeholder="🔎 Buscar por título ou área..." autocomplete="off">
        <select id="filtro-local">
          <option value="">📍 Todas as localizações</option>
        </select>
        <select id="filtro-contrato">
          <option value="">💼 Qualquer contrato</option>
        </select>
      </div>
      <div id="lista"></div>
    </div>

    <footer class="footer">
      <div class="brand">VagasIO</div>
      <div>Plataforma de recrutamento · <a href="/candidato/">Sou candidato →</a></div>
    </footer>
  `;

  // Popula filtros dinamicamente
  const locais = new Set();
  const contratos = new Set();
  vagas.forEach(v => {
    if (v.cidade) locais.add(v.cidade);
    if (v.tipo_contrato) contratos.add(v.tipo_contrato);
  });
  const selLocal = document.getElementById('filtro-local');
  const selContrato = document.getElementById('filtro-contrato');
  locais.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = '📍 ' + l; selLocal.appendChild(o); });
  contratos.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '💼 ' + c; selContrato.appendChild(o); });

  document.getElementById('busca').addEventListener('input', aplicarFiltros);
  document.getElementById('filtro-local').addEventListener('change', aplicarFiltros);
  document.getElementById('filtro-contrato').addEventListener('change', aplicarFiltros);

  aplicarFiltros();
}

function aplicarFiltros() {
  const q = (document.getElementById('busca').value || '').toLowerCase().trim();
  const local = document.getElementById('filtro-local').value;
  const contrato = document.getElementById('filtro-contrato').value;

  const filtradas = TODAS.filter(v => {
    if (q && !(v.titulo || '').toLowerCase().includes(q) && !(v.area || '').toLowerCase().includes(q)) return false;
    if (local && v.cidade !== local) return false;
    if (contrato && v.tipo_contrato !== contrato) return false;
    return true;
  });

  const lista = document.getElementById('lista');
  if (!filtradas.length) {
    lista.innerHTML = `<div class="empty">Nenhuma vaga encontrada com esses filtros.<br><span style="font-size:13px;">Tente outros critérios.</span></div>`;
    return;
  }
  lista.innerHTML = filtradas.map(v => {
    const local = [v.cidade, v.estado].filter(Boolean).join(' / ') || '—';
    const meta = [v.tipo_contrato, v.nivel].filter(Boolean).join(' · ');
    const desc = (v.descricao || '').slice(0, 120);
    return `
      <a class="job-card" href="vaga.html?slug=${encodeURIComponent(slug)}&id=${v.id}">
        <div class="job-info">
          <h3>${escapeHtml(v.titulo)}</h3>
          <div class="job-meta">
            <span>📍 ${escapeHtml(local)}</span>
            ${meta ? `<span class="dot">•</span><span>${escapeHtml(meta)}</span>` : ''}
          </div>
          ${desc ? `<div class="job-desc">${escapeHtml(desc)}${v.descricao && v.descricao.length > 120 ? '...' : ''}</div>` : ''}
        </div>
        <div class="ver-btn">Ver vaga →</div>
      </a>
    `;
  }).join('');
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shadeColor(hex, percent) {
  let f = parseInt(hex.slice(1), 16),
    t = percent < 0 ? 0 : 255,
    p = Math.abs(percent) / 100,
    R = f >> 16, G = f >> 8 & 0x00FF, B = f & 0x0000FF;
  return '#' + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 +
    (Math.round((t - G) * p) + G) * 0x100 +
    (Math.round((t - B) * p) + B)).toString(16).slice(1);
}

carregar();
</script>
</body>
</html>
