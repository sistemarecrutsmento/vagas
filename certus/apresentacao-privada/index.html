  <div class="access-gate" id="access-gate"><div class="gate-backdrop"></div><section class="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-title"><img src="/certus/certus-logo-color.png" alt="Certus by VagasIO"><span class="eyebrow">ÁREA DO TITULAR</span><h1 id="gate-title">Apresentação privada</h1><p>Entre com a sua conta autorizada do Certus para ver o painel de gestão e o portal do colaborador.</p><form id="owner-login"><label>Empresa<input name="company_slug" autocomplete="organization" required placeholder="Identificador da empresa"></label><label>E-mail do titular<input name="email" type="email" autocomplete="username" required placeholder="Seu e-mail autorizado"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" class="login-error" role="alert" hidden></div><button class="primary-link gate-submit" type="submit">Verificar acesso</button></form><small class="gate-foot">A senha é validada pelo Certus e não é guardada nesta página.</small></section></div>
