function showLogin(note=''){viewRequest++;token=null;user=null;document.body.style.overflow='';$('#app').innerHTML=`<main class="login"><form class="login-card" id="login-form"><img class="logo" src="./certus-logo-color.png" alt="Certus by VagasIO"><h1>Portal Master</h1><p>Administração global da plataforma Certus.</p><div id="login-error" class="notice" role="alert" aria-live="assertive" ${note?'':'hidden'}>${esc(note)}</div><a id="change-temp-password" class="btn btn-primary" href="${API}/master-password-change" hidden>Trocar senha temporária</a><label class="label">E-mail Master<input name="email" type="email" autocomplete="username" required></label><label class="label">Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary">Entrar</button><p class="hint">Acesso restrito a uma conta explicitamente habilitada como superadministrador.</p></form></main>`;$('#login-form').onsubmit=login}
async function login(e){e.preventDefault();const f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Validando…';try{const r=await fetch(API+'/api/master/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível entrar');if(d.password_change_required){token=null;user=null;const n=$('#login-error');n.hidden=false;n.textContent='A senha temporária precisa ser trocada antes de entrar.';const a=$('#change-temp-password');a.hidden=false;a.href=API+'/master-password-change';b.disabled=false;b.textContent='Entrar';return}token=d.access_token;user=d.user||{name:'Superadministrador'};active=0;render()}catch(err){const n=$('#login-error');n.hidden=false;n.textContent=err.message;b.disabled=false;b.textContent='Entrar'}}

async function apiGet(path){if(!token)throw Error('Sessão expirada. Entre novamente.');let r;try{r=await fetch(API+path,{headers:{Accept:'application/json',Authorization:'Bearer '+token},cache:'no-store'})}catch{throw Error('API indisponível ou conexão bloqueada. Nenhum dado foi alterado.')}let d;try{d=await r.json()}catch{throw Error('Resposta inválida da API.')}if(r.status===401||r.status===403){token=null;throw Error('Sessão inválida ou sem permissão. Entre novamente.')}if(!r.ok){const routeDescription={404:`Função indisponível na API (${path.split('?')[0]}).`,503:`Serviço temporariamente indisponível (${path.split('?')[0]}).`};throw Error(routeDescription[r.status]||d.error||`Falha ao carregar dados (${r.status}).`)}return d}
async function apiWrite(path,method,body){if(!token)throw Error('Sessão expirada. Entre novamente.');let r;try{r=await fetch(API+path,{method,headers:{Accept:'application/json','Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body),cache:'no-store'})}catch{throw Error('API indisponível. A gravação não foi confirmada.')}let d;try{d=await r.json()}catch{throw Error('Resposta inválida da API.')}if(r.status===401||r.status===403){token=null;throw Error('Sessão inválida ou sem permissão. Entre novamente.')}if(!r.ok)throw Error(d.error||`Falha ao salvar (${r.status}).`);return d}function settingDefinitions(){return [{'platform.name':{label:'Nome da plataforma',type:'text',placeholder:'Nome exibido na plataforma'}},{'platform.contact_email':{label:'E-mail de contato',type:'email',placeholder:'contato@exemplo.com'}},{'platform.default_locale':{label:'Localidade padrão',type:'text',placeholder:'pt-BR'}},{'platform.default_timezone':{label:'Fuso horário padrão',type:'text',placeholder:'America/Sao_Paulo'}},{'security.session_idle_minutes':{label:'Tempo de sessão ociosa (minutos)',type:'number',min:5,max:120,placeholder:'5 a 120'}},{'notifications.master_email_enabled':{label:'E-mail Master habilitado',type:'boolean'}}]}function globalSettingsEditor(items,keys){const defs=Object.assign({},...settingDefinitions()),byKey=new Map((items||[]).map(x=>[x.setting_key,x]));return `<section class="demo-card"><h3>Editar parâmetro global</h3><p class="sub">A API valida tipo e limites, exige justificativa e registra auditoria. Estes parâmetros ainda não são aplicados automaticamente às regras das empresas.</p><p id="setting-notice" class="message" role="status" ${globalSettingNotice?'':'hidden'}>${esc(globalSettingNotice)}</p><form id="global-setting-form"><label class="label">Parâmetro<select id="setting-key" required><option value="">Selecione</option>${(keys||[]).filter(k=>defs[k]).map(k=>`<option value="${esc(k)}">${esc(defs[k].label)} · ${esc(k)}</option>`).join('')}</select></label><div id="setting-editor"><p class="sub">Escolha um parâmetro para ver seu valor atual e editar.</p></div><label class="label">Justificativa para auditoria<input id="setting-note" maxlength="500" minlength="8" required placeholder="Explique por que este parâmetro precisa mudar"></label><p id="setting-result" class="notice" role="status" hidden></p><button class="demo-button primary" id="save-setting" type="submit">Salvar parâmetro</button></form></section>`}function bindGlobalSettingForm(items,keys,refresh){const form=$('#global-setting-form');if(!form)return;const defs=Object.assign({},...settingDefinitions()),byKey=new Map((items||[]).map(x=>[x.setting_key,x]));const keySelect=$('#setting-key'),editor=$('#setting-editor'),note=$('#setting-note'),result=$('#setting-result'),button=$('#save-setting');keySelect.onchange=()=>{const key=keySelect.value,def=defs[key];if(!def){editor.innerHTML='<p class="sub">Escolha um parâmetro.</p>';return}const row=byKey.get(key),raw=row?row.value:undefined;let value=raw;if(typeof raw==='string'&&raw.startsWith('"')){try{value=JSON.parse(raw)}catch{}}if(def.type==='boolean'){const checked=value===true||value==='true';editor.innerHTML=`<label class="label setting-value">${esc(def.label)}<select id="setting-value"><option value="true" ${checked?'selected':''}>Ativado</option><option value="false" ${!checked?'selected':''}>Desativado</option></select></label>`}else editor.innerHTML=`<label class="label setting-value">${esc(def.label)}<input id="setting-value" type="${def.type}" ${def.min?`min="${def.min}"`:''} ${def.max?`max="${def.max}"`:''} placeholder="${esc(def.placeholder||'')}" value="${value===undefined?'':esc(value)}" required></label>`;editor.insertAdjacentHTML('beforeend',`<p class="sub">Versão atual: ${cell(row?.version??0)} · ${row?'valor cadastrado':'ainda não cadastrado'}.</p>`)};form.onsubmit=async e=>{e.preventDefault();const key=keySelect.value,def=defs[key],field=$('#setting-value');if(!def||!field)return;let value=field.value;if(def.type==='boolean')value=value==='true';else if(def.type==='number')value=Number(value);if(typeof value==='string')value=value.trim();const audit_note=note.value.trim();if(audit_note.length<8){result.hidden=false;result.textContent='Informe uma justificativa de pelo menos 8 caracteres.';return}button.disabled=true;button.textContent='Salvando…';result.hidden=true;try{const response=await apiWrite('/api/master/settings/'+encodeURIComponent(key),'PUT',{value,audit_note,expected_version:byKey.get(key)?.version||0});globalSettingNotice=response.note||'Parâmetro salvo e registrado na auditoria. Ele ainda não está conectado ao comportamento das empresas.';await refresh()}catch(err){result.className='notice';result.hidden=false;result.textContent=err.message}finally{button.disabled=false;button.textContent='Salvar parâmetro'}}}

function lookup(o,key){return key.split('.').reduce((v,k)=>v==null?undefined:v[k],o)}
function fmt(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='object')return JSON.stringify(v);return String(v)}
function cell(v){return esc(fmt(v))}
function table(title,items,keys,labels){if(!items?.length)return `<article class="demo-card"><h3>${esc(title)}</h3><p class="sub">Nenhum registro retornado pela API.</p></article>`;return `<article class="demo-card"><h3>${esc(title)}</h3><p class="sub">Dados retornados pela API autenticada · somente leitura.</p><div class="demo-table-wrap"><table class="demo-table"><thead><tr>${labels.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${items.map(row=>`<tr>${keys.map(k=>`<td>${cell(lookup(row,k))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></article>`}
function statCards(items){if(!items?.length)return '';return `<div class="demo-stats">${items.map((x,i)=>`<article class="demo-stat"><span class="stat-icon">${['▣','♙','▤','◈','⌁'][i%5]}</span><div><small>${esc(x[0])}</small><strong>${cell(x[1])}</strong><em>API · somente leitura</em></div></article>`).join('')}</div>`}
function tabs(){const a=configs[active][3];if(!a?.length)return '';return `<div class="demo-tabs" role="tablist" aria-label="Abas de ${esc(configs[active][0])}">${a.map((t,i)=>`<button id="master-tab-${i}" class="demo-tab ${tabIndex===i?'active':''}" role="tab" aria-controls="master-tabpanel" aria-selected="${tabIndex===i}" tabindex="${tabIndex===i?'0':'-1'}" data-tab="${i}">${esc(t)}</button>`).join('')}</div>`}
function companySelect(items){const companies=items||[];if(!selectedCompany&&companies.length)selectedCompany=companies[0].id;return `<label class="label company-picker">Empresa<select id="company-select"><option value="">Selecione uma empresa</option>${companies.map(c=>`<option value="${esc(c.id)}" ${c.id===selectedCompany?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`}
function tabFilter(items){const ix=tabIndex,tab=configs[active][3][ix]||'';if(active===3)return items;if(active===4)return items.filter(x=>ix===1?x.status==='paid':true);if(active===5){const map={1:['open'],2:['in_progress'],3:['waiting_customer'],4:['resolved','closed']};return map[ix]?items.filter(x=>map[ix].includes(x.status)):items}if(active===7)return items.filter(x=>ix===0?true:ix===1?x.status==='pending':false);if(active===8)return items.filter(x=>ix===0?['not_started','in_progress','blocked'].includes(x.status):ix===1?x.status==='completed':true);if(active===11)return items.filter(x=>ix===1?x.status==='draft':ix===2?x.status==='archived':true);return items}
function unavailable(text){return `<article class="demo-card"><span class="pill gray">Indisponível / somente leitura</span><h3 style="margin-top:10px">Nenhum endpoint conectado</h3><p class="sub">${esc(text)}</p><p class="sub">Não há dados fictícios nem operações disponíveis nesta tela.</p></article>`}
async function loadData(i){const requestId=++viewRequest;const c=configs[i],content=$('#content');content.innerHTML=`<div class="page-heading"><div class="page-title"><span class="title-icon">${esc(c[2])}</span><div><h1>${esc(c[0])}</h1><p>${esc(c[1])}</p></div></div><div class="actions"><button class="demo-button" id="refresh">↻ Atualizar</button></div></div><article class="demo-card" role="status">Carregando dados autenticados…</article>`;$('#refresh').onclick=()=>loadData(i);let html='',o=null;
try{
if(i===0){if(tabIndex===1){const d=await apiGet('/api/master/overview');lastItems=d.items||[];html=tabs()+table('Empresas',lastItems,['name','slug','status','users','employees','branches','pending_adjustments'],['Empresa','Identificador','Status','Usuários','Colaboradores','Filiais','Ajustes pendentes'])}else if(tabIndex===2){const d=await apiGet('/api/master/audit-log?limit=20');lastItems=d.items||[];html=tabs()+table('Atividade recente (até 20 registros)',lastItems,['created_at','actor_name','action','entity_type','entity_id'],['Data','Responsável','Ação','Tipo','ID'])+'<p class="sub">Últimos registros de auditoria retornados pela API; sem gráficos ou tendências não fornecidos pelo backend.</p>'}else{const d=await apiGet('/api/master/dashboard');const co=d.companies||{},t=d.terminals||{},f=d.finance||{},su=d.support||{};html=tabs()+statCards([['Empresas',co.total],['Empresas ativas',co.active],['Funcionários',d.employees],['Terminais online',t.online],['Chamados em aberto',su.open],['Ajustes pendentes',d.pending_adjustments]])+`<article class="demo-card"><h3>Resumo calculado pelo backend</h3><p class="sub">Apurado ${cell(d.as_of)} · período ${cell(d.period)}. Nenhuma série histórica é fornecida; gráfico e tendências foram removidos.</p><p class="sub">Faturas pagas no mês: ${cell(f.collected_month)} · valores em aberto: ${cell(f.receivable)} · assinaturas ativas: ${cell((d.subscriptions||{}).active)} · incidentes críticos: ${cell((d.incidents||{}).critical)}</p></article>`;}}
else if(i===1){o=await apiGet('/api/master/overview');lastItems=o.items||[];html=tabs()+statCards([['Empresas',o.total],['Ativas',o.active],['Em teste',o.trial],['Suspensas',o.suspended]])+(tabIndex===0?table('Empresas e totais por organização',lastItems,['name','slug','status','users','employees','branches','clock_events','pending_adjustments'],['Empresa','Identificador','Status','Usuários','Colaboradores','Filiais','Marcações','Ajustes pendentes']):`<div class="tile-grid">${lastItems.map(co=>`<article class="demo-card"><h3>${esc(co.name)}</h3><p class="sub">${esc(co.slug||'')} · ${esc(co.status||'')}</p><div class="mini-list"><span>Usuários: ${cell(co.users)}</span><span>Colaboradores: ${cell(co.employees)}</span><span>Filiais: ${cell(co.branches)}</span></div></article>`).join('')||'<article class="demo-card">Nenhuma empresa retornada pela API.</article>'}</div>`)+companySelect(lastItems);if(selectedCompany){const detail=lastItems.find(co=>co.id===selectedCompany);if(detail)html+=`<article class="demo-card"><h3>Detalhes disponíveis</h3><p class="sub">Contagens fornecidas pelo resumo autenticado de empresas. A API não fornece métricas de usuários ou dispositivos neste endpoint.</p></article>`+statCards([['Filiais',detail.branches],['Colaboradores',detail.employees],['Marcações',detail.clock_events],['Ajustes pendentes',detail.pending_adjustments]])}}
else if(i===2){const d=await apiGet('/api/master/plans'),o=await apiGet('/api/master/overview');lastItems=d.items||[];const companies=o.items||[];html=table('Catálogo de planos',lastItems,['code','name','description','billing_period','price','currency','employee_limit','branch_limit','admin_limit','terminal_limit','trial_days','status','version'],['Código','Plano','Descrição','Ciclo','Preço','Moeda','Limite colaboradores','Limite filiais','Limite gestores','Limite terminais','Dias de teste','Status','Versão'])+companySelect(companies);if(selectedCompany){const subs=await apiGet('/api/master/companies/'+encodeURIComponent(selectedCompany)+'/subscriptions');html+=table('Assinaturas da empresa',subs.items||[],['plan_name','billing_period','status','price_locked','currency','trial_ends_at','current_period_end'],['Plano','Ciclo','Status','Preço travado','Moeda','Fim do teste','Fim do ciclo'])}html+=`<p class="sub">Consulta apenas. Planos novos iniciam inativos. Edição, ativação e criação de testes permanecem desabilitadas.</p>`}

else if(i===5){const d=await apiGet('/api/master/support/tickets');lastItems=d.items||[];const filtered=tabFilter(lastItems);html=tabs()+table('Chamados',filtered,['protocol','company_name','subject','category','priority','status','created_at'],['Protocolo','Empresa','Assunto','Categoria','Prioridade','Status','Criado']);if(filtered.length){const first=filtered[0];const detail=await apiGet('/api/master/support/tickets/'+encodeURIComponent(first.id)+'?company_id='+encodeURIComponent(first.company_id));html+=table('Detalhes do chamado selecionado',[detail.ticket].filter(Boolean),['protocol','subject','description','category','priority','status','assigned_to','created_at','updated_at'],['Protocolo','Assunto','Descrição','Categoria','Prioridade','Status','Responsável ID','Criado','Atualizado'])+table('Histórico de mensagens (somente leitura)',detail.messages||[],['author_type','body','internal_note','created_at'],['Autor','Mensagem','Nota interna','Data'])}html+='<p class="sub">Leitura somente. Criar chamados ou mensagens e atualizar status está desabilitado; mensagens não são entregues.</p>'}
else if(i===6){const d=await apiGet('/api/master/monitoring');lastItems=d.items||[];html=tabs()+`<p class="sub">Janela ${cell(d.window)} · Apurado ${cell(d.as_of)} · ${esc(d.definitions?.events||'')}</p>`;if(tabIndex===0){html+=table('Monitoramento por empresa',lastItems,['name','slug','status','events.events_24h','events.pending_24h','events.review_24h','events.rejected_24h','devices.total','devices.online','devices.last_seen_at'],['Empresa','Identificador','Status','Eventos 24h','Pendentes','Em revisão','Rejeitados','Terminais','Online','Última atividade'])}else{html+=companySelect(lastItems);if(selectedCompany){const detail=await apiGet('/api/master/companies/'+encodeURIComponent(selectedCompany)+'/monitoring');html+=table('Eventos por tipo/estado',detail.events||[],['event_type','validation_status','count','last_event_at'],['Tipo','Estado da validação','Quantidade','Último evento'])+table('Dispositivos da empresa',detail.devices||[],['label','branch_name','status','online','last_seen_at','app_version'],['Terminal','Filial','Status','Online','Última conexão','Versão'])}}html+=`<p class="sub">${esc(d.definitions?.online||'Somente leitura; sem comandos ou correções.')}</p>`}
else if(i===7){const d=await apiGet('/api/master/devices');lastItems=d.items||[];html=tabs()+(tabIndex===2?unavailable('Não existe rota de atualizações de firmware/versão no backend integrado.'):table(configs[i][3][tabIndex],tabFilter(lastItems),['company_name','label','branch_id','status','online','last_seen_at','app_version','created_at'],['Empresa','Terminal','Filial ID','Status','Online','Última conexão','Versão','Criado']))+`<p class="sub">${esc(d.note||'Consulta somente leitura.')}</p>`}

if(requestId!==viewRequest)return;content.innerHTML=`<div class="page-heading"><div class="page-title"><span class="title-icon">${esc(c[2])}</span><div><h1>${esc(c[0])}</h1><p>${esc(c[1])}</p></div></div><div class="actions"><button class="demo-button" id="refresh">↻ Atualizar</button></div></div><div id="master-tabpanel" role="tabpanel" tabindex="0" aria-labelledby="master-tab-${tabIndex}">${html}</div><div class="footnote-demo">Somente leitura. Nenhuma alteração, cobrança, marcação, mensagem ou comunicação foi executada.</div>`;
$('#refresh').onclick=()=>loadData(i);if(i===9){const settingData=await apiGet('/api/master/settings');bindGlobalSettingForm(settingData.items||[],settingData.editable_keys||[],()=>loadData(i))}const select=$('#company-select');if(select)select.onchange=()=>{selectedCompany=select.value;tabIndex=0;loadData(i)};document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>{tabIndex=Number(b.dataset.tab);loadData(i)};b.onkeydown=e=>{const all=[...document.querySelectorAll('[data-tab]')];let n=all.indexOf(b);if(e.key==='ArrowRight')n=(n+1)%all.length;else if(e.key==='ArrowLeft')n=(n-1+all.length)%all.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=all.length-1;else return;e.preventDefault();all[n].focus();all[n].click()}});const search=$('#table-search');if(search)search.oninput=()=>{document.querySelectorAll('#content tbody tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(search.value.toLowerCase())})};
