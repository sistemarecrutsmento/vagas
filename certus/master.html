function settingDefinitions(){return [{'platform.name':{label:'Nome da plataforma',type:'text',placeholder:'Nome exibido na plataforma'}},{'platform.contact_email':{label:'E-mail de contato',type:'email',placeholder:'contato@exemplo.com'}},{'platform.default_locale':{label:'Localidade padrão',type:'text',placeholder:'pt-BR'}},{'platform.default_timezone':{label:'Fuso horário padrão',type:'text',placeholder:'America/Sao_Paulo'}},{'security.session_idle_minutes':{label:'Tempo de sessão ociosa (minutos)',type:'number',min:5,max:120,placeholder:'5 a 120'}},{'notifications.master_email_enabled':{label:'E-mail Master habilitado',type:'boolean'}}]}function globalSettingsEditor(items,keys){const defs=Object.assign({},...settingDefinitions()),byKey=new Map((items||[]).map(x=>[x.setting_key,x]));return `<section class="demo-card"><h3>Editar parâmetro global</h3><p class="sub">A API valida tipo e limites, exige justificativa e registra auditoria. Estes parâmetros ainda não são aplicados automaticamente às regras das empresas.</p><p id="setting-notice" class="message" role="status" ${globalSettingNotice?'':'hidden'}>${esc(globalSettingNotice)}</p><form id="global-setting-form"><label class="label">Parâmetro<select id="setting-key" required><option value="">Selecione</option>${(keys||[]).filter(k=>defs[k]).map(k=>`<option value="${esc(k)}">${esc(defs[k].label)} · ${esc(k)}</option>`).join('')}</select></label><div id="setting-editor"><p class="sub">Escolha um parâmetro para ver seu valor atual e editar.</p></div><label class="label">Justificativa para auditoria<input id="setting-note" maxlength="500" minlength="8" required placeholder="Explique por que este parâmetro precisa mudar"></label><p id="setting-result" class="notice" role="status" hidden></p><button class="demo-button primary" id="save-setting" type="submit">Salvar parâmetro</button></form></section>`}function bindGlobalSettingForm(items,keys,refresh){const form=$('#global-setting-form');if(!form)return;const defs=Object.assign({},...settingDefinitions()),byKey=new Map((items||[]).map(x=>[x.setting_key,x]));const keySelect=$('#setting-key'),editor=$('#setting-editor'),note=$('#setting-note'),result=$('#setting-result'),button=$('#save-setting');keySelect.onchange=()=>{const key=keySelect.value,def=defs[key];if(!def){editor.innerHTML='<p class="sub">Escolha um parâmetro.</p>';return}const row=byKey.get(key),raw=row?row.value:undefined;let value=raw;if(typeof raw==='string'&&raw.startsWith('"')){try{value=JSON.parse(raw)}catch{}}if(def.type==='boolean'){const checked=value===true||value==='true';editor.innerHTML=`<label class="label setting-value">${esc(def.label)}<select id="setting-value"><option value="true" ${checked?'selected':''}>Ativado</option><option value="false" ${!checked?'selected':''}>Desativado</option></select></label>`}else editor.innerHTML=`<label class="label setting-value">${esc(def.label)}<input id="setting-value" type="${def.type}" ${def.min?`min="${def.min}"`:''} ${def.max?`max="${def.max}"`:''} placeholder="${esc(def.placeholder||'')}" value="${value===undefined?'':esc(value)}" required></label>`;editor.insertAdjacentHTML('beforeend',`<p class="sub">Versão atual: ${cell(row?.version??0)} · ${row?'valor cadastrado':'ainda não cadastrado'}.</p>`)};form.onsubmit=async e=>{e.preventDefault();const key=keySelect.value,def=defs[key],field=$('#setting-value');if(!def||!field)return;let value=field.value;if(def.type==='boolean')value=value==='true';else if(def.type==='number')value=Number(value);if(typeof value==='string')value=value.trim();const audit_note=note.value.trim();if(audit_note.length<8){result.hidden=false;result.textContent='Informe uma justificativa de pelo menos 8 caracteres.';return}button.disabled=true;button.textContent='Salvando…';result.hidden=true;try{const response=await apiWrite('/api/master/settings/'+encodeURIComponent(key),'PUT',{value,audit_note,expected_version:byKey.get(key)?.version||0});globalSettingNotice=response.note||'Parâmetro sal
