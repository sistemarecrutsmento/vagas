<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#50001f"><title>Portal Master · Certus</title><link rel="preconnect" href="https://certus-api.onrender.com"><style>
:root{--wine:#50001f;--wine-dark:#3d0018;--gold:#c5a45e;--bg:#f5f4f5;--ink:#262126;--muted:#716970;--line:#e9e6e8;--green:#286a4b;--green-bg:#eaf4ee;--red:#913b45;--red-bg:#fae9eb;--amber:#876113;--amber-bg:#fbf3df}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 5%,#efe3e7,transparent 35%),var(--bg)}.login-card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-top:4px solid var(--wine);border-radius:14px;padding:30px;box-shadow:0 14px 38px #30001612}.logo{width:210px;max-height:56px;object-fit:contain;display:block;margin:0 auto 24px}.login h1{font-size:23px;margin:0 0 7px;color:var(--wine-dark)}.login p{color:var(--muted);line-height:1.55}.label{display:grid;gap:7px;margin:17px 0;font-weight:650;color:#50464c}.label input,.label textarea,.label select{width:100%;min-height:44px;padding:11px 12px;border:1px solid #d8d1d4;border-radius:8px}.btn{border:1px solid #e4dfe2;border-radius:8px;min-height:40px;padding:9px 13px;background:#f4f1f2;color:#4d4147;font-weight:650}.btn-primary{background:var(--wine);color:#fff;border-color:var(--wine)}.btn-primary:hover{background:#6a1035}.btn-danger{background:#fff;color:var(--red);border-color:#e6c9cc}.btn:disabled{opacity:.55;cursor:wait}.login .btn{width:100%;min-height:46px}.hint{font-size:12px;color:var(--muted)}.notice{padding:11px 13px;border-radius:8px;background:var(--red-bg);color:#71343a;margin:12px 0;line-height:1.5}.notice[hidden]{display:none}.shell{min-height:100dvh;display:grid;grid-template-columns:250px minmax(0,1fr)}.side{position:sticky;top:0;height:100dvh;background:var(--wine);color:#fff;padding:22px 16px;display:flex;flex-direction:column}.side-logo{width:180px;max-width:100%;filter:brightness(0) invert(1);margin:0 auto 30px}.side-tag{padding:13px 12px;background:#ffffff12;border:1px solid #ffffff24;border-left:3px solid var(--gold);border-radius:9px;color:#f1e4e7;line-height:1.5}.side-tag b{display:block;color:#fff}.side nav{display:grid;gap:6px;margin-top:20px}.side nav button{border:0;border-radius:8px;text-align:left;padding:11px 12px;color:#f4e9ec;background:transparent}.side nav button.active,.side nav button:hover{background:#7a173d;box-shadow:inset 3px 0 0 var(--gold);color:#fff}.logout{margin-top:auto;width:100%;border:1px solid #ffffff2b;background:#ffffff12;border-radius:8px;color:#fff;padding:10px}.main{min-width:0;padding:0 32px 32px;max-width:1600px;width:100%;margin:auto}.topbar{margin:0 -32px 24px;padding:17px 32px;background:var(--wine);border-bottom:3px solid var(--gold);color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar h1{font-size:19px;margin:0}.topbar small{display:block;color:#ebdce1;margin-top:3px}.identity{font-size:12px;color:#f4e9ec}.heading{margin:0 0 18px}.heading h2{font-size:24px;margin:0 0 5px}.heading p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;box-shadow:0 2px 8px #24151b08;min-width:0}.stat{border-top:2px solid var(--wine)}.stat:nth-child(2){border-top-color:var(--gold)}.stat:nth-child(3){border-top-color:#8b3a55}.stat:nth-child(4){border-top-color:#d8cbd0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:9px}.card h3{margin:0 0 5px;font-size:16px}.card p{color:var(--muted);margin:0 0 12px;line-height:1.5}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.toolbar h3{margin:0}.search{width:min(100%,280px);min-height:40px;padding:9px 11px;border:1px solid #ddd6d9;border-radius:8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{width:100%;min-width:820px;border-collapse:collapse}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #eee9eb;vertical-align:middle;line-height:1.4}th{position:sticky;top:0;background:#f3f1f2;color:#50464c;font-size:11px;letter-spacing:.04em;text-transform:uppercase}tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fcfbfb}.status{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700}.status.active{background:var(--green-bg);color:var(--green)}.status.suspended{background:var(--red-bg);color:var(--red)}.status.trial{background:var(--amber-bg);color:var(--amber)}.empty{padding:26px;text-align:center;color:var(--muted)}.audit{display:grid;gap:9px}.audit-item{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}.audit-item b{color:var(--wine-dark)}.audit-item small{display:block;margin-top:4px;color:var(--muted)}.message{margin:0 0 14px;padding:11px 13px;border-radius:8px;background:var(--green-bg);color:var(--green);line-height:1.5}.message.bad{background:var(--red-bg);color:var(--red)}.message[hidden]{display:none}footer{padding:24px 0;color:var(--muted);font-size:12px}.modal{border:0;border-radius:12px;padding:0;width:min(94vw,460px);box-shadow:0 20px 70px #15000a33}.modal::backdrop{background:#1b1018a8}.modal-inner{padding:22px}.modal-inner h3{margin:0 0 10px}.modal-inner p{line-height:1.55;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto;padding:14px;gap:10px}.side-logo{width:145px;margin:0 auto 4px}.side-tag{padding:9px 11px}.side nav{display:flex;gap:6px;overflow:auto;margin:2px 0}.side nav button{flex:none;white-space:nowrap}.logout{position:absolute;right:14px;top:14px;width:auto;padding:8px 12px}.main{padding:0 15px 22px}.topbar{margin:0 -15px 18px;padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card{padding:14px}.stat strong{font-size:23px}.heading h2{font-size:21px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:420px){.identity{max-width:45%;text-align:right;font-size:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat small{font-size:11px}.stat strong{font-size:21px}}

table{border-collapse:separate;border-spacing:0;min-width:1260px;background:#fff}

</style></head><body><div id="app"></div><dialog id="confirm" class="modal"><div class="modal-inner"><h3 id="confirm-title"></h3><p id="confirm-text"></p><label class="label">Motivo para auditoria<textarea id="confirm-note" rows="3" maxlength="500"></textarea></label><div class="modal-actions"><button class="btn" id="cancel-action">Cancelar</button><button class="btn btn-primary" id="confirm-action">Confirmar alteração</button></div></div></dialog>
<script>(()=>{'use strict';const API='https://certus-api.onrender.com';const $=s=>document.querySelector(s);let token='',user=null,items=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{Accept:'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:`Bearer ${token}`}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Falha ao conectar (${r.status})`);return d}function showLogin(note=''){token='';user=null;sessionStorage.removeItem('certus_master_token');$('#app').innerHTML=`<main class="login"><form class="login-card" id="login-form"><img class="logo" src="./certus-logo-color.png" alt="Certus by VagasIO"><h1>Portal Master</h1><p>Administração global da plataforma Certus.</p><div id="login-error" class="notice" ${note?'':'hidden'}>${esc(note)}</div><label class="label">E-mail Master<input name="email" type="email" autocomplete="username" required></label><label class="label">Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary">Entrar</button><p class="hint">Acesso restrito a uma conta explicitamente habilitada como superadministrador.</p></form></main>`;$('#login-form').onsubmit=login}async function login(e){e.preventDefault();const f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Validando…';try{const d=await api('/api/master/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});token=d.access_token;user=d.user;sessionStorage.setItem('certus_master_token',token);await render()}catch(err){const n=$('#login-error');n.hidden=false;n.textContent=err.message;b.disabled=false;b.textContent='Entrar'}}function shell(){return `<div class="shell"><aside class="side"><img class="side-logo" src="./certus-logo-white.png" alt="Certus by VagasIO"><div class="side-tag"><b>Portal Master</b>Administração global · acesso restrito</div><nav><button class="active" id="nav-dashboard">Visão da plataforma</button><button id="nav-audit">Auditoria Master</button></nav><button class="logout" id="logout">Sair da conta</button></aside><main class="main"><header class="topbar"><div><h1>Certus · Administração Master</h1><small>Controle global das organizações</small></div><div class="identity">${esc(user?.name)} · Superadministrador</div></header><div id="message" class="message" hidden></div><section id="content"></section><footer>Certus by VagasIO · Portal Master · Ações administrativas registradas em trilha imutável.</footer></main></div>`}async function render(){try{const d=await api('/api/master/overview');items=d.items||[];$('#app').innerHTML=shell();$('#logout').onclick=()=>showLogin('Sessão encerrada.');$('#nav-dashboard').onclick=render;$('#nav-audit').onclick=showAudit;$('#content').innerHTML=`<div class="heading"><h2>Visão da plataforma</h2><p>Indicadores gerais e organizações cadastradas.</p><button class="btn btn-primary" id="new-company">Cadastrar nova empresa</button></div><div class="grid"><article class="stat"><small>Organizações</small><strong>${d.total||0}</strong></article><article class="stat"><small>Ativas</small><strong>${d.active||0}</strong></article><article class="stat"><small>Em teste</small><strong>${d.trial||0}</strong></article><article class="stat"><small>Suspensas</small><strong>${d.suspended||0}</strong></article></div><article class="card"><div class="toolbar"><div><h3>Organizações</h3><p>Contagens resumidas; sem dados pessoais dos empregados.</p></div><input class="search" id="company-search" placeholder="Buscar empresa ou identificador" aria-label="Buscar organização"></div><div class="table-wrap"><table><thead><tr><th>Organização</th><th>Identificador</th><th>Status</th><th>Usuários</th><th>Funcionários</th><th>Filiais</th><th>Ajustes pendentes</th><th>Ação</th><th>Senha do administrador</th></tr></thead><tbody id="company-rows"></tbody></table></div></article>`;paintCompanies();$('#company-search').oninput=paintCompanies;$('#new-company').onclick=companyForm}catch(e){if(/Master access is not enabled|Invalid credentials|Invalid or expired|Master access is no longer active/i.test(e.message))return showLogin(e.message);$('#app').innerHTML=shell();$('#content').innerHTML=`<div class="notice">${esc(e.message)}</div>`;$('#logout').onclick=()=>showLogin('Sessão encerrada.')}}function companyForm(){const d=document.createElement('dialog');d.className='dialog';d.innerHTML=`<form class="card dialog-card"><button type="button" class="x" aria-label="Fechar">×</button><h2>Cadastrar nova empresa</h2><p>Os dados serão vinculados a uma empresa isolada. A senha será temporária e deverá ser alterada no primeiro acesso.</p><label>Razão social<input name="legal_name" required maxlength=200 value="MaxClean soluções em limpeza e higiene Ltda"></label><label>CNPJ<input name="cnpj" inputmode="numeric" required maxlength=18 value="42632412000194"></label><label>E-mail corporativo do administrador<input name="admin_email" type="email" required maxlength=254 value="Administrativo.maxclean@gmail.com"></label><label>Nome do administrador da empresa<input name="admin_name" required maxlength=160 value="Erivaldo da Conceição Rangel"></label><label>CPF do responsável legal<input name="responsible_cpf" inputmode="numeric" required maxlength=14 value="68297289591"></label><label>Telefone de contato<input name="phone" inputmode="tel" required value="75999129338"></label><label>Endereço da matriz<input name="address" required maxlength=250 value="Avenida Antônio Carlos Sampaio Marques, s/n, galpão 05, Papagaio"></label><label>CEP<input name="postal_code" inputmode="numeric" required maxlength=9 value="44065850"></label><label>Cidade<input name="city" required maxlength=120 value="Feira de Santana"></label><label>Estado<input name="state" required maxlength=2 value="BA"></label><label>Senha temporária<input name="temporary_password" required minlength=14 value="Mudarascb2026*#@"><span class="muted">A empresa deverá escolher outra senha ao entrar pela primeira vez.</span></label><div id="company-create-msg" class="message bad" hidden></div><div class="actions"><button type="button" class="secondary" id="company-cancel">Cancelar</button><button class="primary" id="company-submit">Criar empresa</button></div></form>`;document.body.append(d);d.showModal();d.querySelector('.x').onclick=()=>{d.close();d.remove()};d.querySelector('#company-cancel').onclick=()=>{d.close();d.remove()};d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=d.querySelector('#company-submit'),m=d.querySelector('#company-create-msg'),f=new FormData(e.currentTarget),body=Object.fromEntries(f.entries());body.representative_name=body.admin_name;body.street='Avenida Antônio Carlos Sampaio Marques';body.street_number='s/n, galpão 05';body.district='Papagaio';body.phone=String(body.phone).replace(/\D/g,'');b.disabled=true;b.textContent='Criando…';try{const result=await api('/api/master/companies',{method:'POST',body:JSON.stringify(body)});d.close();d.remove();await render();const msg=$('#message');msg.hidden=false;msg.className='message';msg.innerHTML=`Empresa <b>${esc(result.company.name)}</b> criada e ativa. Administrador: ${esc(result.admin.email)}. A senha temporária será exigida no primeiro acesso. Identificador: <b>${esc(result.login.company_slug)}</b>.`;window.scrollTo({top:0,behavior:'smooth'})}catch(err){m.hidden=false;m.textContent=err.message;b.disabled=false;b.textContent='Criar empresa'}};}
function paintCompanies(){const q=($('#company-search')?.value||'').toLowerCase();const list=items.filter(x=>`${x.name} ${x.slug}`.toLowerCase().includes(q));$('#company-rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${new Date(x.created_at).toLocaleDateString('pt-BR')}</small></td><td>${esc(x.slug)}</td><td><span class="status ${esc(x.status)}">${x.status==='active'?'Ativa':x.status==='suspended'?'Suspensa':'Em teste'}</span></td><td>${x.users}</td><td>${x.employees}</td><td>${x.branches}</td><td>${x.pending_adjustments}</td><td>${x.status==='active'?`<button class="btn btn-danger" data-suspend="${esc(x.id)}">Suspender</button>`:x.status==='suspended'?`<button class="btn btn-primary" data-activate="${esc(x.id)}">Reativar</button>`:'<span class="hint">Revisar cadastro</span>'}</td><td><button class="btn" data-reset-company="${esc(x.id)}">Redefinir senha</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">Nenhuma organização encontrada.</td></tr>';document.querySelectorAll('[data-suspend]').forEach(b=>b.onclick=()=>confirmStatus(b.dataset.suspend,'suspended'));document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=()=>confirmStatus(b.dataset.activate,'active'));document.querySelectorAll('[data-reset-company]').forEach(b=>b.onclick=()=>resetCompanyPassword(b.dataset.resetCompany))}async function resetCompanyPassword(companyId){const company=items.find(x=>x.id===companyId);if(!company)return;const d=document.createElement('dialog');d.className='modal';d.innerHTML=`<form method="dialog" class="modal-inner"><button type="button" class="x" aria-label="Fechar" style="float:right;border:0;background:transparent;font-size:22px">×</button><h3>Redefinir senha — ${esc(company.name)}</h3><p>Selecione o administrador da empresa. Uma senha temporária será exibida uma única vez e exigirá troca no primeiro acesso.</p><div id="reset-admin-stage"><p class="hint">Carregando administradores…</p></div><div id="reset-password-stage" hidden></div></form>`;document.body.append(d);d.showModal();let resetInProgress=false;const close=()=>{if(resetInProgress)return;d.close();d.remove()};d.querySelector('.x').onclick=close;d.addEventListener('cancel',e=>{if(resetInProgress)e.preventDefault()});d.addEventListener('close',()=>{if(d.isConnected)d.remove()});const stage=d.querySelector('#reset-admin-stage');try{const result=await api(`/api/master/companies/${encodeURIComponent(companyId)}/admin-accounts`);if(!result.items?.length){stage.innerHTML='<div class="notice">Não há administrador ativo nesta empresa para redefinir.</div><button type="button" class="btn" data-close>Fechar</button>';stage.querySelector('[data-close]').onclick=close;return}stage.innerHTML=`<label class="label">Administrador<select id="reset-admin-id" required>${result.items.map(a=>`<option value="${esc(a.id)}">${esc(a.display_name)} — ${esc(a.email)}</option>`).join('')}</select></label><label class="label">Motivo para auditoria<textarea id="reset-password-note" rows="3" minlength="8" maxlength="500" required placeholder="Ex.: a empresa esqueceu a senha do administrador"></textarea></label><div id="reset-password-error" class="notice" hidden></div><div class="modal-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" id="reset-password-confirm">Gerar senha temporária</button></div>`;stage.querySelector('[data-close]').onclick=close;stage.querySelector('#reset-password-confirm').onclick=async()=>{const button=stage.querySelector('#reset-password-confirm'),note=stage.querySelector('#reset-password-note').value.trim(),error=stage.querySelector('#reset-password-error');if(note.length<8){error.hidden=false;error.textContent='Informe o motivo (mínimo 8 caracteres).';return}button.disabled=true;button.textContent='Gerando…';error.hidden=true;resetInProgress=true;try{const accountId=stage.querySelector('#reset-admin-id').value;const out=await api(`/api/master/companies/${encodeURIComponent(companyId)}/admin-accounts/${encodeURIComponent(accountId)}/reset-password`,{method:'POST',body:JSON.stringify({note})});const safePassword=esc(out.temporary_password);resetInProgress=false;stage.hidden=true;const resultStage=d.querySelector('#reset-password-stage');resultStage.hidden=false;resultStage.innerHTML=`<div class="notice" style="background:var(--green-bg);color:var(--green)">Senha temporária gerada. Entregue-a com segurança ao administrador. A senha não será mostrada novamente ao fechar esta janela.</div><label class="label">Senha temporária<input id="temporary-password-result" readonly value="${safePassword}" autocomplete="off"></label><div class="modal-actions"><button type="button" class="btn" id="copy-temporary-password">Copiar senha</button><button type="button" class="btn btn-primary" data-close>Concluir</button></div>`;resultStage.querySelector('#copy-temporary-password').onclick=async()=>{try{await navigator.clipboard.writeText(out.temporary_password);resultStage.querySelector('#copy-temporary-password').textContent='Copiada'}catch{const input=resultStage.querySelector('#temporary-password-result');input.select();document.execCommand('copy');resultStage.querySelector('#copy-temporary-password').textContent='Copiada'}};resultStage.querySelector('[data-close]').onclick=close}catch(e){resetInProgress=false;error.hidden=false;error.textContent=e.message;button.disabled=false;button.textContent='Gerar senha temporária'}}}catch(e){stage.innerHTML=`<div class="notice">${esc(e.message)}</div><button type="button" class="btn" data-close>Fechar</button>`;stage.querySelector('[data-close]').onclick=close}}function confirmStatus(id,status){const x=items.find(i=>i.id===id);$('#confirm-title').textContent=status==='suspended'?'Suspender organização?':'Reativar organização?';$('#confirm-text').textContent=`A alteração afetará o acesso de ${x?.name||'esta organização'} e será registrada na auditoria.`;$('#confirm-note').value='';$('#confirm').showModal();$('#cancel-action').onclick=()=>$('#confirm').close();$('#confirm-action').onclick=async()=>{const note=$('#confirm-note').value.trim();if(note.length<4){$('#confirm-note').focus();return}const b=$('#confirm-action');b.disabled=true;try{await api(`/api/master/companies/${encodeURIComponent(id)}/status`,{method:'PATCH',body:JSON.stringify({status,note})});$('#confirm').close();await render();const m=$('#message');m.hidden=false;m.textContent='Status atualizado; a ação foi auditada.';window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('#confirm-text').textContent=e.message}finally{b.disabled=false}}}async function showAudit(){try{const d=await api('/api/master/audit-log?limit=100');$('#content').innerHTML=`<div class="heading"><h2>Auditoria Master</h2><p>Últimas ${(d.items||[]).length} ações administrativas globais.</p></div><section class="audit">${d.items?.length?d.items.map(x=>`<article class="audit-item"><b>${esc(x.action)}</b> · ${esc(x.entity_type)} ${esc(x.entity_id||'')}<small>${esc(x.actor_name||'Conta desativada')} · ${new Date(x.created_at).toLocaleString('pt-BR')} · ${esc(JSON.stringify(x.details||{}))}</small></article>`).join(''):'<div class="card empty">Nenhuma ação Master registrada ainda.</div>'}</section>`;document.querySelectorAll('.side nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-audit'))}catch(e){const m=$('#message');m.hidden=false;m.className='message bad';m.textContent=e.message}}$('#login-form')?.addEventListener('submit',login);const saved=sessionStorage.getItem('certus_master_token');if(saved){token=saved;api('/api/master/me').then(d=>{user=d;render()}).catch(()=>showLogin('Entre novamente para continuar.'))}else showLogin()})();</script></body></html>
