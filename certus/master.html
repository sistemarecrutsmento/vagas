async function login(e){e.preventDefault();const f=new FormData(e.currentTarget),b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Validando…';try{const r=await fetch(API+'/api/master/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})}),d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível entrar');if(d.password_change_required)throw Error('Troque sua senha temporária antes de acessar o Portal Master.');token=d.access_token;user=d.user||{name:'Superadministrador'};active=0;render()}catch(err){const n=$('#login-error');n.hidden=false;n.textContent=err.message;b.disabled=false;b.textContent='Entrar'}}
function shell(){let groups=[...new Set(nav.map(x=>x[2]))];return `<div class="app-shell"><aside class="app-side"><div class="app-brand"><img src="./certus-logo-white.png" alt="Certus by VagasIO"><div><strong>Portal Master</strong><small>Administração global da plataforma</small></div></div>${groups.map(g=>`<section class="nav-group"><div class="nav-group-label">${esc(g.toUpperCase())}</div><div class="nav-list">${nav.map((n,i)=>n[2]===g?`<button class="nav-item ${i===active?'active':''}" data-page="${i}"><span class="nav-ico">${n[1]}</span>${esc(n[0])}</button>`:'').join('')}</div></section>`).join('')}<div class="side-bottom"><button class="nav-item" id="logout" title="Sair da conta">⇥ &nbsp; Sair da conta</button></div></aside><main class="app-main"><header class="app-top"><div class="greeting">Olá, ${esc(user?.name||'')} 👋<small>Portal Master da Certus</small></div><input class="global-search" id="table-search" placeholder="⌕ Buscar nos registros desta tela…" aria-label="Filtrar registros desta tela"><div class="top-actions"><span>♧</span><span>?</span><span class="avatar">${esc((user?.name||'').split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span class="who">${esc(user?.name||'')}<small>Superadministrador</small></span></div></header><section id="content"></section><div class="footnote-demo">Dados autenticados conforme API disponível. Operações de escrita permanecem desabilitadas; nenhuma alteração ou cobrança foi executada.</div></main></div>`}
async function apiGet(path){if(!token)throw Error('Sessão expirada. Entre novamente.');let r;try{r=await fetch(API+path,{headers:{Accept:'application/json',Authorization:'Bearer '+token},cache:'no-store'})}catch{throw Error('API indisponível ou conexão bloqueada. Nenhum dado foi alterado.')}let d;try{d=await r.json()}catch{throw Error('Resposta inválida da API.')}if(r.status===401||r.status===403){token=null;throw Error('Sessão inválida ou sem permissão. Entre novamente.')}if(!r.ok)throw Error(d.error||`Falha ao carregar dados (${r.status}).`);return d}
const summaryPath=id=>'/api/master/companies/'+encodeURIComponent(id)+'/summary';
function lookup(o,key){return key.split('.').reduce((v,k)=>v==null?undefined:v[k],o)}
function fmt(v){if(v===null||v===undefined||v==='')return '—';if(typeof v==='object')return JSON.stringify(v);return String(v)}
function cell(v){return esc(fmt(v))}
function table(title,items,keys,labels){if(!items?.length)return `<article class="demo-card"><h3>${esc(title)}</h3><p class="sub">Nenhum registro retornado pela API.</p></article>`;return `<article class="demo-card"><h3>${esc(title)}</h3><p class="sub">Dados retornados pela API autenticada · somente leitura.</p><div class="demo-table-wrap"><table class="demo-table"><thead><tr>${labels.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${items.map(row=>`<tr>${keys.map(k=>`<td>${cell(lookup(row,k))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></article>`}
function statCards(items){if(!items?.length)return '';return `<div class="demo-stats">${items.map((x,i)=>`<article class="demo-stat"><span class="stat-icon">${['▣','♙','▤','◈','⌁'][i%5]}</span><div><small>${esc(x[0])}</small><strong>${cell(x[1])}</strong><em>API · somente leitura</em></div></article>`).join('')}</div>`}
function tabs(){const a=configs[active][3];if(!a?.length)return '';return `<div class="demo-tabs" role="tablist">${a.map((t,i)=>`<button class="demo-tab ${tabIndex===i?'active':''}" role="tab" aria-selected="${tabIndex===i}" data-tab="${i}">${esc(t)}</button>`).join('')}</div>`}
function companySelect(items){const companies=items||[];if(!selectedCompany&&companies.length)selectedCompany=companies[0].id;return `<label class="label company-picker">Empresa<select id="company-select"><option value="">Selecione uma empresa</option>${companies.map(c=>`<option value="${esc(c.id)}" ${c.id===selectedCompany?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`}
function tabFilter(items){const ix=tabIndex,tab=configs[active][3][ix]||'';if(active===3)return items;if(active===4)return items.filter(x=>ix===1?x.status==='paid':true);if(active===5){const map={1:['open'],2:['in_progress'],3:['waiting_customer'],4:['resolved','closed']};return map[ix]?items.filter(x=>map[ix].includes(x.status)):items}if(active===7)return items.filter(x=>ix===0?true:ix===1?x.status==='pending':false);if(active===8)return items.filter(x=>ix===0?['not_started','in_progress','blocked'].includes(x.status):ix===1?x.status==='completed':true);if(active===11)return items.filter(x=>ix===1?x.status==='draft':ix===2?x.status==='archived':true);return items}
function unavailable(text){return `<article class="demo-card"><span class="pill gray">Indisponível / somente leitura</span><h3 style="margin-top:10px">Nenhum endpoint conectado</h3><p class="sub">${esc(text)}</p><p class="sub">Não há dados fictícios nem operações disponíveis nesta tela.</p></article>`}
async function loadData(i){const c=configs[i],content=$('#content');content.innerHTML=`<div class="page-heading"><div class="page-title"><span class="title-icon">${esc(c[2])}</span><div><h1>${esc(c[0])}</h1><p>${esc(c[1])}</p></div></div><div class="actions"><button class="demo-button" id="refresh">↻ Atualizar</button></div></div><article class="demo-card" role="status">Carregando dados autenticados…</article>`;$('#refresh').onclick=()=>loadData(i);let html='',o=null;
try{
if(i===0){if(tabIndex===1){const d=await apiGet('/api/master/overview');lastItems=d.items||[];html=tabs()+table('Empresas',lastItems,['name','slug','status','users','employees','branches','pending_adjustments'],['Empresa','Identificador','Status','Usuários','Colaboradores','Filiais','Ajustes pendentes'])}else if(tabIndex===2){const d=await apiGet('/api/master/audit-log?limit=20');lastItems=d.items||[];html=tabs()+table('Atividade recente (até 20 registros)',lastItems,['created_at','actor_name','action','entity_type','entity_id'],['Data','Responsável','Ação','Tipo','ID'])+'<p class="sub">Últimos registros de auditoria retornados pela API; sem gráficos ou tendências não fornecidos pelo backend.</p>'}else{const d=await apiGet('/api/master/dashboard');const co=d.companies||{},t=d.terminals||{},f=d.finance||{},su=d.support||{};html=tabs()+statCards([['Empresas',co.total],['Empresas ativas',co.active],['Funcionários',d.employees],['Terminais online',t.online],['Chamados em aberto',su.open],['Ajustes pendentes',d.pending_adjustments]])+`<article class="demo-card"><h3>Resumo calculado pelo backend</h3><p class="sub">Apurado ${cell(d.as_of)} · período ${cell(d.period)}. Nenhuma série histórica é fornecida; gráfico e tendências foram removidos.</p><p class="sub">Faturas pagas no mês: ${cell(f.collected_month)} · valores em aberto: ${cell(f.receivable)} · assinaturas ativas: ${cell((d.subscriptions||{}).active)} · incidentes críticos: ${cell((d.incidents||{}).critical)}</p></article>`;}}
else if(i===1){o=await apiGet('/api/master/overview');lastItems=o.items||[];html=tabs()+statCards([['Empresas',o.total],['Ativas',o.active],['Em teste',o.trial],['Suspensas',o.suspended]])+(tabIndex===0?table('Empresas e totais por organização',lastItems,['name','slug','status','users','employees','branches','clock_events','pending_adjustments'],['Empresa','Identificador','Status','Usuários','Colaboradores','Filiais','Marcações','Ajustes pendentes']):`<div class="tile-grid">${lastItems.map(co=>`<article class="demo-card"><h3>${esc(co.name)}</h3><p class="sub">${esc(co.slug||'')} · ${esc(co.status||'')}</p><div class="mini-list"><span>Usuários: ${cell(co.users)}</span><span>Colaboradores: ${cell(co.employees)}</span><span>Filiais: ${cell(co.branches)}</span></div></article>`).join('')||'<article class="demo-card">Nenhuma empresa retornada pela API.</article>'}</div>`)+companySelect(lastItems);if(selectedCompany){const detail=await apiGet(summaryPath(selectedCompany));html+=statCards([['Filiais',detail.branches?.total],['Colaboradores',detail.employees?.total],['Usuários',detail.users?.total],['Dispositivos',detail.devices?.total],['Marcações',detail.clock_events?.total]])+`<p class="sub">Resumo da empresa selecionada: ${cell(detail.company?.name)} · ${cell(detail.company?.status)}.</p>`}}
else if(i===2){const d=await apiGet('/api/master/plans'),o=await apiGet('/api/master/overview');lastItems=d.items||[];const companies=o.items||[];html=table('Catálogo de planos',lastItems,['code','name','description','billing_period','price','currency','employee_limit','branch_limit','admin_limit','terminal_limit','trial_days','status','version'],['Código','Plano','Descrição','Ciclo','Preço','Moeda','Limite colaboradores','Limite filiais','Limite gestores','Limite terminais','Dias de teste','Status','Versão'])+companySelect(companies);if(selectedCompany){const subs=await apiGet('/api/master/companies/'+encodeURIComponent(selectedCompany)+'/subscriptions');html+=table('Assinaturas da empresa',subs.items||[],['plan_name','billing_period','status','price_locked','currency','trial_ends_at','current_period_end'],['Plano','Ciclo','Status','Preço travado','Moeda','Fim do teste','Fim do ciclo'])}html+=`<p class="sub">Consulta apenas. Planos novos iniciam inativos. Edição, ativação e criação de testes permanecem desabilitadas.</p>`}
else if(i===3||i===4){o=await apiGet('/api/master/overview');const companies=o.items||[];html=companySelect(companies);if(selectedCompany){if(i===3&&tabIndex===1){const d=await apiGet('/api/master/companies/'+encodeURIComponent(selectedCompany)+'/subscriptions');lastItems=(d.items||[]).filter(x=>x.status==='trial');html+=tabs()+table('Assinaturas em teste',lastItems,['plan_name','billing_period','status','price_locked','currency','trial_ends_at','created_at'],['Plano','Ciclo','Status','Preço travado','Moeda','Fim do teste','Criado'])+'<p class="sub">Somente leitura. Não é criado teste ou assinatura nesta tela; planos permanecem inativos por padrão.</p>'}else if(i===4&&tabIndex===2){html+=tabs()+unavailable('A API não oferece relatórios agregados financeiros nem série histórica.') }else{const suffix=i===3?'contracts':'invoices';const d=await apiGet('/api/master/companies/'+encodeURIComponent(selectedCompany)+'/'+suffix);lastItems=d.items||[];const filtered=tabFilter(lastItems);html+=tabs()+ (i===3?table('Contratos',filtered,['title','contract_number','status','starts_at','ends_at','renewal','created_at'],['Contrato','Número','Status','Início','Fim','Renovação','Criado']):table(configs[i][3][tabIndex],filtered,['invoice_number','status','amount','currency','due_at','paid_at','created_at'],['Fatura','Status','Valor','Moeda','Vencimento','Pagamento registrado em','Criado']))+`<p class="sub">${i===3?'Contratos novos só podem ser rascunhos pela API; criação/edição desativada.':'Valores e status exibidos conforme API. Nenhum pagamento foi iniciado nem marcado como pago.'}</p>`}}else html+=`<p class="sub">Nenhuma empresa disponível.</p>`}
else if(i===5){const d=await apiGet('/api/master/support/tickets');lastItems=d.items||[];const filtered=tabFilter(lastItems);html=tabs()+table('Chamados',filtered,['protocol','company_name','subject','category','priority','status','created_at'],['Protocolo','Empresa','Assunto','Categoria','Prioridade','Status','Criado']);if(filtered.length){const first=filtered[0];const detail=await apiGet('/api/master/support/tickets/'+encodeURIComponent(first.id)+'?company_id='+encodeURIComponent(first.company_id));html+=table('Detalhes do chamado selecionado',[detail.ticket].filter(Boolean),['protocol','subject','description','category','priority','status','assigned_to','created_at','updated_at'],['Protocolo','Assunto','Descrição','Categoria','Prioridade','Status','Responsável ID','Criado','Atualizado'])+table('Histórico de mensagens (somente leitura)',detail.messages||[],['author_type','body','internal_note','created_at'],['Autor','Mensagem','Nota interna','Data'])}html+='<p class="sub">Leitura somente. Criar chamados ou mensagens e atualizar status está desabilitado; mensagens não são entregues.</p>'}
else if(i===6){const d=await apiGet('/api/master/monitoring');lastItems=d.items||[];html=tabs()+`<p class="sub">Janela ${cell(d.window)} · Apurado ${cell(d.as_of)} · ${esc(d.definitions?.events||'')}</p>`;if(tabIndex===0){html+=table('Monitoramento por empresa',lastItems,['name','slug','status','events.events_24h','events.pending_24h','events.review_24h','events.rejected_24h','devices.total','devices.online','devices.last_seen_at'],['Empresa','Identificador','Status','Eventos 24h','Pendentes','Em revisão','Rejeitados','Terminais','Online','Última atividade'])}else{html+=companySelect(lastItems);if(selectedCompany){const detail=await apiGet('/api/master/companies/'+encodeURIComponent(selectedCompany)+'/monitoring');html+=table('Eventos por tipo/estado',detail.events||[],['event_type','validation_status','count','last_event_at'],['Tipo','Estado da validação','Quantidade','Último evento'])+table('Dispositivos da empresa',detail.devices||[],['label','branch_name','status','online','last_seen_at','app_version'],['Terminal','Filial','Status','Online','Última conexão','Versão'])}}html+=`<p class="sub">${esc(d.definitions?.online||'Somente leitura; sem comandos ou correções.')}</p>`}
else if(i===7){const d=await apiGet('/api/master/devices');lastItems=d.items||[];html=tabs()+(tabIndex===2?unavailable('Não existe rota de atualizações de firmware/versão no backend integrado.'):table(configs[i][3][tabIndex],tabFilter(lastItems),['company_name','label','branch_id','status','online','last_seen_at','app_version','created_at'],['Empresa','Terminal','Filial ID','Status','Online','Última conexão','Versão','Criado']))+`<p class="sub">${esc(d.note||'Consulta somente leitura.')}</p>`}
else if(i===8){const d=await apiGet('/api/master/onboarding');lastItems=d.items||[];const filtered=tabFilter(lastItems);html=tabs()+table(configs[i][3][tabIndex],filtered,['company_name','status','progress','task_count','completed_tasks','target_date','created_at'],['Empresa','Status','Progresso %','Tarefas','Concluídas','Prazo','Criado']);if(filtered.length)html+=unavailable('A API não oferece uma rota para listar as tarefas de implantação.');html+='<p class="sub">Projetos e tarefas consultados. Criação, conclusão e edição de tarefas desabilitadas.</p>'}
else if(i===9){const d=await apiGet('/api/master/settings');lastItems=d.items||[];html=table('Configurações globais',lastItems,['setting_key','value','version','updated_at'],['Chave','Valor','Versão','Atualizada'])+`<p class="sub">${esc(d.note||'Configurações ainda não afetam regras das empresas.')}; edição não conectada nesta tela.</p><p class="sub">Chaves liberadas pela API: ${esc((d.editable_keys||[]).join(', ')||'nenhuma')}.</p>`}

content.innerHTML=`<div class="page-heading"><div class="page-title"><span class="title-icon">${esc(c[2])}</span><div><h1>${esc(c[0])}</h1><p>${esc(c[1])}</p></div></div><div class="actions"><button class="demo-button" id="refresh">↻ Atualizar</button></div></div>${html}<div class="footnote-demo">Somente leitura. Nenhuma alteração, cobrança, marcação, mensagem ou comunicação foi executada.</div>`;
$('#refresh').onclick=()=>loadData(i);const select=$('#company-select');if(select)select.onchange=()=>{selectedCompany=select.value;tabIndex=0;loadData(i)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tabIndex=Number(b.dataset.tab);loadData(i)});const search=$('#table-search');if(search)search.oninput=()=>{document.querySelectorAll('#content tbody tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(search.value.toLowerCase())})};
