async function supportFileData(file){if(file.size>20*1024*1024)throw Error('Cada anexo deve ter no máximo 20 MB.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=()=>reject(Error('Não foi possível ler o arquivo.'));r.readAsDataURL(file)})}
