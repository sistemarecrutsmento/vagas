<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#50001f"><meta name="robots" content="noindex,nofollow"><title>Configurar acesso Master · Certus</title><style>
:root{--wine:#50001f;--wine-dark:#3d0018;--gold:#c5a45e;--bg:#f5f4f5;--ink:#262126;--muted:#716970;--line:#e9e6e8;--red:#913b45;--red-bg:#fae9eb;--green:#286a4b;--green-bg:#eaf4ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 5%,#efe3e7,transparent 35%),var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.card{width:min(100%,460px);background:#fff;border:1px solid var(--line);border-top:4px solid var(--wine);border-radius:14px;padding:28px;box-shadow:0 14px 38px #30001612}.logo{width:210px;max-height:56px;object-fit:contain;display:block;margin:0 auto 24px}.eyebrow{margin:0 0 5px;color:#705e65;font-size:12px;letter-spacing:.06em;text-transform:uppercase}h1{font-size:23px;line-height:1.25;margin:0 0 8px;color:var(--wine-dark)}.intro{color:var(--muted);margin:0 0 20px}.label{display:grid;gap:6px;margin:15px 0;font-weight:650;color:#50464c}.label input{min-height:46px;width:100%;padding:11px 12px;border:1px solid #d8d1d4;border-radius:8px;font:inherit}.hint{font-size:12px;font-weight:400;color:var(--muted)}button{width:100%;min-height:46px;margin-top:7px;border:1px solid var(--wine);border-radius:8px;background:var(--wine);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#6a1035}button:disabled{opacity:.6;cursor:wait}.notice{padding:11px 13px;border-radius:8px;margin:0 0 15px;line-height:1.5}.notice[hidden]{display:none}.notice.error{background:var(--red-bg);color:#71343a}.notice.success{background:var(--green-bg);color:var(--green)}.notice.info{background:#f3f1f2;color:#50464c}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.footer{margin:17px 0 0;color:var(--muted);font-size:12px;text-align:center}#form[hidden],#expired[hidden]{display:none!important}
</style></head><body><main class="card"><img class="logo" src="./certus-logo-color.png" alt="Certus by VagasIO"><p class="eyebrow">Certus · Administração</p><h1>Configurar acesso Master</h1><p class="intro">Cadastre seu e-mail e senha para acessar o Portal Master.</p><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><form id="form" hidden autocomplete="on"><label class="label">Seu nome<input name="display_name" autocomplete="name" maxlength="160" required></label><label class="label">E-mail<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label class="label">Senha<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required><span class="hint">Use pelo menos 14 caracteres.</span></label><label class="label">Confirme a senha<input name="confirm_password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><button id="submit" type="submit">Criar acesso</button></form><section id="expired" hidden><div class="notice error">Este link não está mais disponível. Peça um novo convite ao responsável pelo Certus.</div></section><p class="footer">Este link só pode ser usado uma vez.</p></main><script>(()=>{'use strict';const form=document.querySelector('#form'),notice=document.querySelector('#notice'),expired=document.querySelector('#expired'),button=document.querySelector('#submit'),key=location.hash.slice(1);history.replaceState(null,'',location.pathname+location.search);function show(text,type){notice.textContent=text;notice.className=`notice ${type}`;notice.hidden=false}if(!key||key.length<32||key.length>200){expired.hidden=false}else form.hidden=false;form.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(form),password=String(d.get('password')),confirm=String(d.get('confirm_password'));if(password!==confirm)return show('As senhas não coincidem.','error');if(password.length<14)return show('A senha deve ter pelo menos 14 caracteres.','error');button.disabled=true;button.textContent='Criando acesso…';try{const r=await fetch('https://certus-api.onrender.com/api/master/setup',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({setup_code:key,email:d.get('email'),display_name:d.get('display_name'),password})});const result=await r.json().catch(()=>({}));if(!r.ok)throw Error(result.error||'Não foi possível criar o acesso.');form.reset();form.hidden=true;expired.hidden=true;show('Acesso criado. Você já pode entrar no Portal Master.','success');}catch(err){show(err.message,'error');if(/link expirou|já foi utilizado|já está configurado/i.test(err.message)){form.hidden=true;expired.hidden=true}}finally{button.disabled=false;button.textContent='Criar acesso'}})})();</script></body></html>
