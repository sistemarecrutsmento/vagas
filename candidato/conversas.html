<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Chat — Vagas.io</title>
  <link rel="stylesheet" href="conversas.css?v=3" />
  <link rel="manifest" href="/candidato/manifest.json">
  <meta name="theme-color" content="#722F37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vagas.io">
  <link rel="apple-touch-icon" href="/candidato/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/candidato/candidato-shell.css?v=candidato-shell-v15">
</head>
<body>
  <div class="chat-shell" id="chat-shell">
    <!-- Esquerda: lista -->
    <aside class="conv-list" id="conv-list">
      <div class="conv-list-head">
        <h1>💬 Conversas</h1>
        <p>Fale com o recrutador sobre cada vaga</p>
      </div>
      <div class="conv-list-items" id="conv-items">
        <div class="conv-vazio">
          <div class="icon">⏳</div>
          <p>Carregando conversas...</p>
        </div>
      </div>
    </aside>

    <!-- Direita: conversa ativa -->
    <section class="conv-panel" id="conv-panel">
      <div class="conv-empty" id="conv-empty">
        <div class="icon">💬</div>
        <h3>Selecione uma conversa</h3>
        <p>Escolha uma vaga na lista à esquerda pra começar a falar com o recrutador.</p>
      </div>
    </section>
  </div>

  <script src="chat-uploader.js?v=2"></script>
  <script src="conversas.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/candidato/sw.js', { scope: '/candidato/' })
          .then(r => console.log('[PWA] SW registrado:', r.scope))
          .catch(e => console.warn('[PWA] SW falhou:', e.message));
      });
    }
  </script>
  <script src="candidato-shell.js?v=candidato-shell-v15"></script>
</body>
</html>
