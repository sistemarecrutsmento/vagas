<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Vagas Favoritas — Vagas.io</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f7; color:#222; }
    :root { --vinho:#722F37; --vinho-escuro:#5C252C; --borda:#e0e0e0; }
    header { background:var(--vinho); color:#fff; position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(0,0,0,.15); }
    .header-inner { max-width:1100px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
    .logo { font-weight:800; font-size:22px; color:#fff; text-decoration:none; }
    .btn-voltar { background:transparent; color:rgba(255,255,255,.85); border:0; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .btn-voltar:hover { color:#fff; }
    .content { max-width:1100px; margin:0 auto; padding:32px 20px; }
    .page-title { font-size:26px; font-weight:700; margin-bottom:4px; }
    .page-sub { font-size:14px; color:#888; margin-bottom:24px; }
    .fav-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
    .fav-card { background:#fff; border:1px solid #e8e8e8; border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:10px; }
    .fav-card-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .fav-titulo { font-size:16px; font-weight:700; color:#1a1a1a; flex:1; }
    .fav-empresa { font-size:13px; color:#888; }
    .fav-loc { font-size:12px; color:#666; }
    .fav-meta { display:flex; gap:6px; flex-wrap:wrap; }
    .chip { background:#f0f0f0; color:#555; padding:3px 9px; border-radius:12px; font-size:11px; }
    .chip-tag { background:#e8f4fd; color:#1565c0; }
    .fav-acoes { display:flex; gap:8px; margin-top:4px; }
    .btn-primary { flex:1; text-align:center; padding:9px; background:var(--vinho); color:#fff; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; border:0; cursor:pointer; }
    .btn-primary:hover { background:var(--vinho-escuro); }
    .btn-desfav { background:#fff; color:#c62828; border:1px solid #c62828; border-radius:8px; padding:9px 12px; font-size:13px; cursor:pointer; }
    .btn-desfav:hover { background:#ffeaea; }
    .score-badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; }
    .score-alto { background:#d4edda; color:#155724; }
    .score-medio { background:#fff3cd; color:#856404; }
    .score-baixo { background:#f8d7da; color:#721c24; }
    .empty { text-align:center; padding:80px 20px; color:#999; }
    .empty .ico { font-size:56px; margin-bottom:16px; }
    .spinner { display:inline-block; width:20px; height:20px; border:2px solid #ddd; border-top-color:var(--vinho); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:24px; right:24px; background:#333; color:#fff; padding:12px 20px; border-radius:8px; font-size:13px; z-index:999; opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.show { opacity:1; }
  </style>
  <link rel="manifest" href="/candidato/manifest.json">
  <meta name="theme-color" content="#722F37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vagas.io">
  <link rel="apple-touch-icon" href="/candidato/icons/icon-180.png">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="../candidato/" class="logo">Vagas<span style="font-weight:300">io</span></a>
      <button class="btn-voltar" onclick="history.back()">← Voltar</button>
    </div>
  </header>

  <div class="content">
    <h1 class="page-title">⭐ Minhas Vagas Favoritas</h1>
    <p class="page-sub">Vagas salvas para conferir depois ou acompanhar</p>
    <div class="fav-grid" id="grid">
      <div class="empty"><div class="spinner"></div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "https://recrutamento-api-novo.onrender.com";
    let scores = {};

    function getToken() { return localStorage.getItem('candidato_token') || localStorage.getItem('token'); }

    async function carregarFavoritos() {
      const token = getToken();
      if (!token) { location.href = 'index.html'; return; }

      const r = await fetch(`${API}/api/candidato/favoritos`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (r.status === 401) { location.href = 'index.html'; return; }
      const d = await r.json();
      renderFavoritos(d.favoritos || []);

      // Carrega scores em background
      for (const f of (d.favoritos || [])) {
        carregarScore(f.id, token);
      }
    }

    async function carregarScore(vagaId, token) {
      try {
        const r = await fetch(`${API}/api/candidato/vagas/${vagaId}/match`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) return;
        const d = await r.json();
        scores[vagaId] = d.score;
        const el = document.getElementById(`score-${vagaId}`);
        if (el) {
          const cls = d.score >= 70 ? 'score-alto' : d.score >= 40 ? 'score-medio' : 'score-baixo';
          el.className = `score-badge ${cls}`;
          el.textContent = `${d.score}% compatível`;
          el.style.display = '';
        }
      } catch {}
    }

    function renderFavoritos(favs) {
      const grid = document.getElementById('grid');
      if (!favs.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <div class="ico">⭐</div>
          <p>Você ainda não tem vagas favoritas.</p>
          <p style="margin-top:12px"><a href="index.html" style="color:var(--vinho);font-weight:600">Explorar vagas →</a></p>
        </div>`;
        return;
      }
      grid.innerHTML = favs.map(f => {
        const tags = (f.tags || []).slice(0, 4);
        return `
          <div class="fav-card" id="fav-${f.id}">
            <div class="fav-card-topo">
              <div>
                <div class="fav-titulo">${esc(f.titulo)}</div>
                <div class="fav-empresa">${esc(f.empresa)}</div>
              </div>
              <span class="score-badge" id="score-${f.id}" style="display:none"></span>
            </div>
            ${f.cidade ? `<div class="fav-loc">📍 ${esc(f.cidade)}${f.estado ? ', '+f.estado.toUpperCase() : ''}</div>` : ''}
            <div class="fav-meta">
              ${f.tipo_contrato ? `<span class="chip">${esc(f.tipo_contrato)}</span>` : ''}
              ${f.nivel ? `<span class="chip">${esc(f.nivel)}</span>` : ''}
              ${f.area ? `<span class="chip">${esc(f.area)}</span>` : ''}
              ${tags.map(t => `<span class="chip chip-tag">${esc(t)}</span>`).join('')}
            </div>
            <div class="fav-acoes">
              ${f.candidatura_id
                ? `<a class="btn-primary" href="candidatura.html?id=${f.candidatura_id}">Ver candidatura →</a>`
                : `<a class="btn-primary" href="vaga.html?id=${f.id}">Ver vaga →</a>`}
              <button class="btn-desfav" onclick="desfavoritar(${f.id})">✕</button>
            </div>
          </div>`;
      }).join('');
    }

    async function desfavoritar(vagaId) {
      const token = getToken();
      const r = await fetch(`${API}/api/candidato/favoritos/${vagaId}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      });
      if (r.ok) {
        document.getElementById(`fav-${vagaId}`)?.remove();
        const restam = document.querySelectorAll('[id^="fav-"]').length;
        if (restam === 0) carregarFavoritos();
        toast('Vaga removida dos favoritos');
      } else {
        toast('Erro ao remover favorito');
      }
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    carregarFavoritos();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/candidato/sw.js', { scope: '/candidato/' })
          .then(r => console.log('[PWA] SW registrado:', r.scope))
          .catch(e => console.warn('[PWA] SW falhou:', e.message));
      });
    }
  </script>
<script src="../_shared/analytics.js"></script>
</body>
</html>
