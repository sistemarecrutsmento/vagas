<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=/candidato/?vaga=__VAGA__&slug=__SLUG__">
<title>Vaga · VagasIO</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;height:100vh;color:#666;}
</style>
</head>
<body>
<p>Carregando…</p>
<script>
  const qs = new URLSearchParams(location.search);
  const v = qs.get('vaga');
  const s = qs.get('slug');
  if (v) {
    const u = '/candidato/?vaga=' + encodeURIComponent(v) + (s ? '&slug=' + encodeURIComponent(s) : '');
    location.replace(u);
  }
</script>
</body>
</html>
