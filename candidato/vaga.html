<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=/candidato/?vaga=__VAGA__&slug=__SLUG__">
<title>Vaga · VagasIO</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;display:flex;align-items:center;justify-content:center;height:100vh;color:#666;}
</style>
  <link rel="manifest" href="/candidato/manifest.json">
  <meta name="theme-color" content="#722F37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vagas.io">
  <link rel="apple-touch-icon" href="/candidato/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/candidato/candidato-shell.css?v=candidato-shell-v16">
</head>
<body>
<p>Carregando…</p>
<script>
  const qs = new URLSearchParams(location.search);
  const v = qs.get('vaga');
  const s = qs.get('slug');
  if (v) {
    // Registrar vaga_visualizada antes do redirect
    if (window.vagiasTrack) window.vagiasTrack('vaga_visualizada', { vaga_id: parseInt(v), metadata: { origem: 'redirect' } });
    const u = '/candidato/?vaga=' + encodeURIComponent(v) + (s ? '&slug=' + encodeURIComponent(s) : '');
    setTimeout(function() { location.replace(u); }, 50);
  }
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/candidato/sw.js', { scope: '/candidato/' })
          .then(r => console.log('[PWA] SW registrado:', r.scope))
          .catch(e => console.warn('[PWA] SW falhou:', e.message));
      });
    }
  </script>
<script src="../_shared/analytics.js"></script>
  <script src="candidato-shell.js?v=candidato-shell-v16"></script>
</body>
</html>
