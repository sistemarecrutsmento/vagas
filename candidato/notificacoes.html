<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Notificações — Candidato · Vagas.io</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg: #f5f5f5; --card: #fff; --border: #e0e0e0; --text: #222; --text-soft: #666; --primary: #7B1F1F; --gold: #D4AF37; }
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
header h1 { margin: 0; font-size: 22px; color: var(--primary); }
header .acoes { margin-left: auto; display: flex; gap: 8px; }
header .acoes button, header .acoes a { background: var(--primary); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; }
header .acoes button.secondary { background: #888; }
main { max-width: 800px; margin: 24px auto; padding: 0 24px; }
.toolbar { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
.feed { display: flex; flex-direction: column; gap: 10px; }
.notif { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 8px; padding: 14px 18px; cursor: pointer; }
.notif:hover { background: #fafafa; }
.notif.nao-lida { border-left-color: var(--primary); background: #fffafa; }
.notif .titulo { font-weight: 600; margin: 0 0 4px; }
.notif .mensagem { color: var(--text-soft); font-size: 14px; margin: 0 0 6px; }
.notif .meta { color: var(--text-soft); font-size: 12px; }
.notif .badge { background: var(--primary); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
.vazio { text-align: center; color: var(--text-soft); padding: 40px; }
</style>
  <link rel="manifest" href="/candidato/manifest.json">
  <meta name="theme-color" content="#722F37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vagas.io">
  <link rel="apple-touch-icon" href="/candidato/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/candidato/candidato-shell.css?v=candidato-shell-v10">
</head>
<body>

<main>
  <div class="toolbar">
    <label>Lidas:
      <select id="filtro-lida" onchange="atualizar()">
        <option value="todas">Todas</option>
        <option value="false">Só não lidas</option>
        <option value="true">Só lidas</option>
      </select>
    </label>
    <span id="contador" style="margin-left:auto;color:#888;font-size:14px"></span>
  </div>
  <div class="feed" id="feed">Carregando…</div>
</main>
<script>
const API = 'https://recrutamento-api-novo.onrender.com';
function getToken() { return localStorage.getItem('candidato_token'); }
let cache = [];

async function atualizar() {
  const lida = document.getElementById('filtro-lida').value;
  const qs = new URLSearchParams();
  if (lida !== 'todas') qs.set('lida', lida);
  qs.set('limit', '50');
  const r = await fetch(API + '/api/notificacoes?' + qs, {
    headers: { 'Authorization': 'Bearer ' + getToken() }
  });
  const d = await r.json();
  cache = d.notificacoes || [];
  render();
}

function render() {
  const feed = document.getElementById('feed');
  document.getElementById('contador').textContent = cache.length + ' notificações';
  if (cache.length === 0) {
    feed.innerHTML = '<div class="vazio">Nenhuma notificação por aqui ainda.</div>';
    return;
  }
  feed.innerHTML = cache.map(n => `
    <div class="notif ${n.lida_em ? '' : 'nao-lida'}" onclick="abrir(${n.id}, '${n.referencia_tipo || ''}', ${n.referencia_id || 'null'})">
      <p class="titulo">${escape(n.titulo)}${!n.lida_em ? '<span class="badge">NOVA</span>' : ''}</p>
      ${n.mensagem ? `<p class="mensagem">${escape(n.mensagem)}</p>` : ''}
      <div class="meta">${formatarData(n.criada_em)} · ${n.tipo}</div>
    </div>
  `).join('');
}

async function abrir(id, tipo, refId) {
  await fetch(API + '/api/notificacoes/' + id + '/lida', {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + getToken() }
  });
  if (tipo === 'candidatura' && refId) {
    window.location.href = 'candidatura.html?id=' + refId;
  } else {
    atualizar();
  }
}

async function marcarTodas() {
  await fetch(API + '/api/notificacoes/marcar-todas-lidas', {
    method: 'PATCH', headers: { 'Authorization': 'Bearer ' + getToken() }
  });
  atualizar();
}

function escape(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function formatarData(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return Math.floor(diff / 60) + 'min atrás';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h atrás';
  return d.toLocaleDateString('pt-BR');
}

if (!getToken()) {
  document.getElementById('feed').innerHTML = '<div class="vazio">Faça login para ver suas notificações. <a href="index.html">Voltar</a></div>';
} else {
  atualizar();
}
setInterval(atualizar, 60_000);
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/candidato/sw.js', { scope: '/candidato/' })
          .then(r => console.log('[PWA] SW registrado:', r.scope))
          .catch(e => console.warn('[PWA] SW falhou:', e.message));
      });
    }
  </script>
  <script src="candidato-shell.js?v=candidato-shell-v10"></script>
</body>
</html>
