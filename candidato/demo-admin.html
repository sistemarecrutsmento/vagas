<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vagas.io — Demo: Painel Administrativo</title>
<style>
  :root {
    --vinho:#722F37; --vinho-escuro:#4A1F25; --dourado:#D4AF37; --dourado-claro:#F5E6A8;
    --cinza:#F5F5F5; --cinza-medio:#999; --cinza-escuro:#1A1A1A; --texto:#1A1A1A;
    --branco:#FFFFFF; --verde:#16A34A; --verde-bg:#DCFCE7; --vermelho:#DC2626; --vermelho-bg:#FEE2E2;
    --laranja:#F59E0B; --laranja-bg:#FEF3C7; --azul:#2563EB; --azul-bg:#DBEAFE; --roxo:#7C3AED; --roxo-bg:#EDE9FE;
    --sombra:0 2px 8px rgba(0,0,0,0.08); --sombra-forte:0 4px 16px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #FAFAFA; color: var(--texto); line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; border: none; }
  a { color: var(--vinho); text-decoration: none; }

  .demo-banner {
    background: linear-gradient(90deg, #FEF3C7, #FDE68A);
    color: #92400E; padding: 10px 20px; text-align: center; font-size: 13px;
    border-bottom: 2px solid #F59E0B; font-weight: 500;
  }
  .demo-banner strong { color: #78350F; }

  .app { max-width: 1100px; margin: 0 auto; background: var(--branco); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

  /* Sidebar */
  .layout { display: flex; min-height: calc(100vh - 50px); }
  .sidebar {
    width: 240px; background: linear-gradient(180deg, var(--vinho) 0%, var(--vinho-escuro) 100%);
    color: var(--branco); padding: 20px 0; flex-shrink: 0;
  }
  .sidebar h2 { padding: 0 20px; color: var(--dourado); font-size: 22px; margin-bottom: 24px; }
  .sidebar h2 span { color: var(--branco); }
  .sidebar-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer;
    transition: all 0.2s; font-size: 14px; color: rgba(255,255,255,0.85);
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.1); color: var(--branco); }
  .sidebar-item.active { background: rgba(212,175,55,0.2); color: var(--dourado); border-left: 3px solid var(--dourado); }
  .sidebar-item .icon { font-size: 18px; }
  .sidebar-item .badge {
    background: var(--vermelho); color: var(--branco); font-size: 11px; padding: 2px 6px;
    border-radius: 10px; margin-left: auto; font-weight: 700;
  }

  .main { flex: 1; padding: 24px 32px; overflow-x: auto; }

  /* Top Bar */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .topbar h1 { color: var(--vinho); font-size: 24px; }
  .topbar-actions { display: flex; gap: 12px; align-items: center; }
  .topbar-actions .user { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .topbar-actions .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--dourado);
    color: var(--cinza-escuro); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }

  /* Tabs (sub-navigation) */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #E5E5E5; margin-bottom: 20px; }
  .tab {
    padding: 12px 20px; background: transparent; color: var(--cinza-medio);
    font-size: 14px; font-weight: 500; border-bottom: 3px solid transparent; transition: all 0.2s;
  }
  .tab:hover { color: var(--vinho); }
  .tab.active { color: var(--vinho); border-bottom-color: var(--vinho); font-weight: 600; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--branco); border-radius: 12px; padding: 20px; box-shadow: var(--sombra);
    border-left: 4px solid var(--vinho); position: relative; overflow: hidden;
  }
  .kpi-card.kpi-verde { border-left-color: var(--verde); }
  .kpi-card.kpi-azul { border-left-color: var(--azul); }
  .kpi-card.kpi-laranja { border-left-color: var(--laranja); }
  .kpi-card.kpi-roxo { border-left-color: var(--roxo); }
  .kpi-top { display: flex; justify-content: space-between; align-items: center; }
  .kpi-icon { font-size: 32px; opacity: 0.4; }
  .kpi-label { font-size: 13px; color: var(--cinza-medio); margin-top: 8px; font-weight: 500; }
  .kpi-valor { font-size: 32px; font-weight: 700; color: var(--cinza-escuro); margin-top: 4px; }
  .kpi-delta { font-size: 12px; margin-top: 8px; display: inline-block; padding: 2px 8px; border-radius: 12px; }
  .kpi-delta.up { background: var(--verde-bg); color: var(--verde); }
  .kpi-delta.down { background: var(--vermelho-bg); color: var(--vermelho); }
  .kpi-delta.flat { background: var(--cinza); color: var(--cinza-medio); }

  /* Cards genéricos */
  .card { background: var(--branco); border-radius: 12px; padding: 20px; box-shadow: var(--sombra); margin-bottom: 16px; }
  .card h3 { color: var(--vinho); font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }

  /* Listas */
  .lista-entrevistas { display: flex; flex-direction: column; gap: 10px; }
  .entrevista-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: var(--cinza); border-radius: 8px; border-left: 3px solid var(--vinho);
  }
  .entrevista-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--vinho), var(--vinho-escuro));
    color: var(--branco); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .entrevista-info { flex: 1; }
  .entrevista-nome { font-size: 14px; font-weight: 600; }
  .entrevista-vaga { font-size: 12px; color: #666; margin-top: 2px; }
  .entrevista-data { font-size: 12px; color: #444; white-space: nowrap; font-weight: 500; }
  .entrevista-badge {
    font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 700;
  }
  .entrevista-rh { background: var(--azul-bg); color: var(--azul); }
  .entrevista-gestor { background: var(--roxo-bg); color: var(--roxo); }

  .atividade-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F0F0F0; }
  .atividade-item:last-child { border-bottom: none; }
  .atividade-icon {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .atividade-icon.avancar { background: var(--verde-bg); color: var(--verde); }
  .atividade-icon.reprovar { background: var(--vermelho-bg); color: var(--vermelho); }
  .atividade-icon.inscricao { background: var(--azul-bg); color: var(--azul); }
  .atividade-icon.entrevista { background: var(--roxo-bg); color: var(--roxo); }
  .atividade-icon.proposta { background: var(--laranja-bg); color: var(--laranja); }
  .atividade-texto { font-size: 13px; flex: 1; }
  .atividade-meta { font-size: 11px; color: var(--cinza-medio); margin-top: 2px; }
  .atividade-tempo { font-size: 11px; color: var(--cinza-medio); white-space: nowrap; }

  /* Tabela */
  .table-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: var(--cinza); }
  th { text-align: left; padding: 12px; font-weight: 600; color: var(--cinza-escuro); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 12px; border-bottom: 1px solid #F0F0F0; }
  tr:hover { background: #FAFAFA; }
  tr { cursor: pointer; }
  .status-badge {
    display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;
  }
  .status-em_andamento { background: var(--azul-bg); color: var(--azul); }
  .status-em_analise { background: var(--laranja-bg); color: var(--laranja); }
  .status-contratado { background: var(--verde-bg); color: var(--verde); }
  .status-rejeitado { background: var(--vermelho-bg); color: var(--vermelho); }
  .status-em_proposta { background: var(--roxo-bg); color: var(--roxo); }

  .candidato-cell { display: flex; align-items: center; gap: 8px; }
  .candidato-cell .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--vinho);
    color: var(--branco); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .filtro-linha { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filtro-linha input, .filtro-linha select {
    padding: 8px 12px; border: 1.5px solid #E5E5E5; border-radius: 8px; font-size: 13px;
  }

  /* Tela de Análise do Candidato */
  .analise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .analise-section { background: var(--branco); border-radius: 12px; padding: 20px; box-shadow: var(--sombra); margin-bottom: 16px; }
  .analise-section h3 { color: var(--vinho); font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .info-item { font-size: 13px; }
  .info-item .label { color: var(--cinza-medio); font-size: 11px; }
  .info-item .value { color: var(--cinza-escuro); font-weight: 500; margin-top: 2px; }

  .timeline { position: relative; padding-left: 30px; }
  .timeline::before { content: ''; position: absolute; left: 12px; top: 8px; bottom: 8px; width: 2px; background: #E5E5E5; }
  .timeline-item { position: relative; padding-bottom: 16px; }
  .timeline-item::before {
    content: ''; position: absolute; left: -23px; top: 4px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--cinza); border: 3px solid var(--branco); box-shadow: 0 0 0 2px var(--cinza-medio);
  }
  .timeline-item.done::before { background: var(--verde); box-shadow: 0 0 0 2px var(--verde); }
  .timeline-item.current::before { background: var(--laranja); box-shadow: 0 0 0 2px var(--laranja); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--laranja); } 50% { box-shadow: 0 0 0 6px rgba(245,158,11,0.3); } }

  /* Botões */
  .btn { padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { transform: translateY(-1px); }
  .btn-aprovar { background: var(--verde); color: var(--branco); }
  .btn-reprovar { background: var(--vermelho); color: var(--branco); }
  .btn-reabrir { background: var(--laranja); color: var(--branco); }
  .btn-novo { background: var(--vinho); color: var(--branco); }
  .btn-outline { background: transparent; color: var(--vinho); border: 1.5px solid var(--vinho); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  .acoes { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .acoes .btn { flex: 1; min-width: 140px; justify-content: center; }

  /* Validação de documentos */
  .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .doc-card {
    background: var(--cinza); border-radius: 8px; padding: 12px; border-left: 3px solid var(--cinza-medio);
  }
  .doc-card.aprovado { border-left-color: var(--verde); background: var(--verde-bg); }
  .doc-card.pendente { border-left-color: var(--laranja); background: var(--laranja-bg); }
  .doc-card.rejeitado { border-left-color: var(--vermelho); background: var(--vermelho-bg); }
  .doc-card .doc-nome { font-size: 13px; font-weight: 600; }
  .doc-card .doc-actions { display: flex; gap: 6px; margin-top: 8px; }

  /* Agenda / Calendário */
  .calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendario .dia-header { font-size: 11px; font-weight: 700; text-align: center; padding: 8px; color: var(--cinza-medio); }
  .calendario .dia {
    aspect-ratio: 1; background: var(--branco); border: 1px solid #F0F0F0; border-radius: 6px;
    padding: 6px; font-size: 12px; position: relative; min-height: 60px;
  }
  .calendario .dia.hoje { background: var(--dourado-claro); border-color: var(--dourado); font-weight: 700; }
  .calendario .dia.vazio { background: transparent; border: none; }
  .calendario .dia .num { font-weight: 600; }
  .calendario .dia .evento {
    background: var(--vinho); color: var(--branco); font-size: 9px; padding: 2px 4px;
    border-radius: 3px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .calendario .dia .evento.gestor { background: var(--roxo); }
  .calendario .dia .evento.outro { background: var(--cinza-medio); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--branco); border-radius: 12px; width: 90%; max-width: 600px;
    max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--sombra-forte);
  }
  .modal h2 { color: var(--vinho); margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }

  .toast {
    position: fixed; top: 20px; right: 20px; background: var(--cinza-escuro); color: var(--branco);
    padding: 12px 20px; border-radius: 8px; z-index: 300; opacity: 0; transition: all 0.3s;
    box-shadow: var(--sombra-forte); font-size: 14px; max-width: 350px;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: var(--verde); }
  .toast.error { background: var(--vermelho); }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--vinho) 0%, var(--vinho-escuro) 100%); }
  .login-card { background: var(--branco); padding: 40px; border-radius: 16px; box-shadow: var(--sombra-forte); max-width: 400px; width: 100%; }
  .login-card h2 { color: var(--vinho); margin-bottom: 8px; text-align: center; font-size: 28px; }
  .login-card .sub { text-align: center; color: var(--cinza-medio); margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 12px; border: 1.5px solid #E5E5E5; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  .login-card input:focus { outline: none; border-color: var(--vinho); }
  .login-card button { width: 100%; padding: 14px; background: var(--vinho); color: var(--branco); border-radius: 8px; font-weight: 600; }
  .login-card .hint { background: var(--dourado-claro); padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 16px; color: #78350F; }
</style>
</head>

</div>

<div class="modal-overlay" id="modal-overlay">

</div>

<div class="toast" id="toast"></div>

function irPara(pageId) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(pageId).style.display = (pageId === 'page-dashboard') ? 'block' : 'block';
  if (pageId === 'page-dashboard') {
    document.getElementById('page-dashboard').style.display = 'block';
    document.getElementById('page-login').style.display = 'none';
  }
  currentPage = pageId;
}

function fazerLogin() {
  document.getElementById('page-login').style.display = 'none';
  document.getElementById('page-dashboard').style.display = 'block';
  currentSection = 'dashboard';
  renderMain();
  mostrarToast('✅ Login realizado!', 'success');
}

function fazerLogout() {
  document.getElementById('page-dashboard').style.display = 'none';
  document.getElementById('page-login').style.display = 'block';
  mostrarToast('👋 Até logo!', '');
}

function setSection(section, el) {
  currentSection = section;
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  renderMain();
}

function irPara(pageId) {
  // pageId é só rótulo de UI; usa o que foi clicado
  const map = {
    'page-dashboard': 'dashboard',
    'page-vagas': 'vagas',
    'page-candidatos': 'candidatos',
    'page-agenda': 'agenda',
    'page-documentos': 'documentos',
    'page-relatorios': 'relatorios',
    'page-config': 'config'
  };
  const section = map[pageId] || 'dashboard';
  const el = (typeof event !== 'undefined' && event && event.currentTarget) || null;
  setSection(section, el);
}

function mostrarToast(msg, tipo = "") {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + tipo;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
//  RENDER PRINCIPAL (troca de seção)
// ============================================================
function renderMain() {
  const main = document.getElementById('main-content');
  switch (currentSection) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'vagas': main.innerHTML = renderVagas(); break;
    case 'candidatos': main.innerHTML = renderCandidatos(); break;
    case 'agenda': main.innerHTML = renderAgenda(); break;
    case 'documentos': main.innerHTML = renderDocumentosSection(); break;
    case 'relatorios': main.innerHTML = renderRelatorios(); break;
    case 'config': main.innerHTML = renderConfig(); break;
  }
  // Re-aplica o estado ativo do sidebar (caso tenha sido setado por outra função)
  if (typeof event !== 'undefined' && event && event.currentTarget && event.currentTarget.classList && event.currentTarget.classList.contains('sidebar-item')) {
    document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
    event.currentTarget.classList.add('active');
  }
}

function renderLinhaCandidatos(lista) {
  if (lista.length === 0) return '<tr><td colspan="7" style="text-align:center; padding: 40px; color: #999;">Nenhum candidato encontrado</td></tr>';
  return lista.map(c => {
    const initials = c.nome.split(' ').slice(0, 2).map(n => n.charAt(0)).join('').toUpperCase();
    const statusLabel = { em_andamento: 'Em Andamento', em_analise: 'Em Análise', em_proposta: 'Em Proposta', contratado: 'Contratado', rejeitado: 'Reprovado' }[c.status];
    return `
      <tr onclick="abrirCandidato(${c.id})">
        <td>
          <div class="candidato-cell">
            <div class="avatar">${initials}</div>
            <div>
              <div style="font-weight: 600;">${c.nome}</div>
              <div style="font-size: 11px; color: #999;">${c.email}</div>
            </div>
          </div>
        </td>
        <td>${c.vaga}</td>
        <td>${c.etapaNome}</td>
        <td><span class="status-badge status-${c.status}">${statusLabel}</span></td>
        <td>${'<span style="color: var(--dourado);">' + '★'.repeat(Math.round(c.nota/2)) + '</span>'}</td>
        <td>${new Date(c.data).toLocaleDateString('pt-BR')}</td>
        <td><button class="btn btn-sm" style="background: var(--vinho); color: white;" onclick="event.stopPropagation(); abrirCandidato(${c.id})">Analisar →</button></td>
      </tr>
    `;
  }).join('');
}

function filtrarCandidatos() {
  const texto = (document.getElementById('filtro-texto')?.value || '').toLowerCase();
  const vaga = document.getElementById('filtro-vaga')?.value || '';
  const status = document.getElementById('filtro-status')?.value || '';
  const filtrados = CANDIDATOS.filter(c =>
    (c.nome.toLowerCase().includes(texto) || c.email.toLowerCase().includes(texto)) &&
    (!vaga || c.vagaId == vaga) &&
    (!status || c.status === status)
  );
  document.getElementById('tabela-candidatos').innerHTML = renderLinhaCandidatos(filtrados);
}

// ============================================================
//  AGENDA
// ============================================================
function renderAgenda() {
  const hoje = new Date(2026, 6, 21); // 21/07/2026
  const mes = hoje.getMonth();
  const ano = hoje.getFullYear();
  const primeiroDia = new Date(ano, mes, 1).getDay();
  const ultimoDia = new Date(ano, mes + 1, 0).getDate();
  const mesNome = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][mes];

  let dias = '';
  for (let i = 0; i < primeiroDia; i++) dias += '<div class="dia vazio"></div>';
  for (let d = 1; d <= ultimoDia; d++) {
    const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const eventos = ENTREVISTAS.filter(e => e.data === dataStr);
    const isHoje = d === hoje.getDate();
    dias += `
      <div class="dia ${isHoje ? 'hoje' : ''}">
        <div class="num">${d}</div>
        ${eventos.map(e => `<div class="evento ${e.tipo}">${e.hora} ${e.candidato.split(' ')[0]}</div>`).join('')}
      </div>
    `;
  }

  return `
    <div class="topbar">
      <h1>📅 Agenda</h1>
      <div class="topbar-actions">
        <button class="btn btn-novo" onclick="mostrarToast('➕ Abrindo nova agenda...', '')">+ Agendar</button>
      </div>
    </div>

    <div class="card">
      <h3>${mesNome} ${ano}</h3>
      <div class="calendario">
        <div class="dia-header">Dom</div><div class="dia-header">Seg</div><div class="dia-header">Ter</div>
        <div class="dia-header">Qua</div><div class="dia-header">Qui</div><div class="dia-header">Sex</div><div class="dia-header">Sáb</div>
        ${dias}
      </div>
    </div>

    <div class="card">
      <h3>📋 Entrevistas Agendadas</h3>
      ${ENTREVISTAS.map(e => `
        <div class="entrevista-item">
          <div class="entrevista-avatar">${e.candidato.charAt(0)}</div>
          <div class="entrevista-info">
            <div class="entrevista-nome">${e.candidato}</div>
            <div class="entrevista-vaga">${e.vaga} • ${e.entrevistador}</div>
          </div>
          <div style="text-align: right;">
            <div class="entrevista-data">📅 ${new Date(e.data).toLocaleDateString('pt-BR')}</div>
            <div class="entrevista-data">🕐 ${e.hora}</div>
          </div>
          <span class="entrevista-badge entrevista-${e.tipo}">${e.tipo === 'rh' ? 'RH' : 'GESTOR'}</span>
          <div style="display: flex; gap: 4px; margin-left: 8px;">
            <button class="btn btn-sm btn-outline" onclick="mostrarToast('✏️ Editando entrevista...', '')">✏️</button>
            <button class="btn btn-sm" style="background: var(--vermelho); color: white;" onclick="mostrarToast('🗑️ Cancelada', 'error')">🗑️</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderDocumentosSection() {
  if (!docsStatus[1]) {
    docsStatus[1] = {};
    DOCUMENTOS_SCHEMA.forEach((d, i) => docsStatus[1][d] = i < 12 ? 'aprovado' : i < 14 ? 'pendente' : 'pendente');
  }
  const stats = {
    aprovados: Object.values(docsStatus[1]).filter(v => v === 'aprovado').length,
    pendentes: Object.values(docsStatus[1]).filter(v => v === 'pendente').length,
    rejeitados: Object.values(docsStatus[1]).filter(v => v === 'rejeitado').length
  };

  return `
    <div class="topbar">
      <h1>📄 Validação de Documentos</h1>
      <div class="topbar-actions">
        <select>
          <option>Camila Silva Queiroz - Gerente Adm.</option>
        </select>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns: repeat(3, 1fr);">
      <div class="kpi-card kpi-verde">
        <div class="kpi-label">Aprovados</div>
        <div class="kpi-valor">${stats.aprovados}/${DOCUMENTOS_SCHEMA.length}</div>
      </div>
      <div class="kpi-card kpi-laranja">
        <div class="kpi-label">Pendentes</div>
        <div class="kpi-valor">${stats.pendentes}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Rejeitados</div>
        <div class="kpi-valor">${stats.rejeitados}</div>
      </div>
    </div>

    <div class="card">
      <h3>📋 Documentos de Contratação</h3>
      <p style="font-size: 13px; color: #666; margin-bottom: 16px;">Aprove todos os documentos abaixo para liberar o avanço da etapa.</p>
      <div class="doc-grid">
        ${DOCUMENTOS_SCHEMA.map(d => {
          const status = docsStatus[1][d];
          return `
            <div class="doc-card ${status}">
              <div class="doc-nome">${status === 'aprovado' ? '✅' : status === 'pendente' ? '⏳' : '❌'} ${d}</div>
              <div style="font-size: 11px; color: #666; margin-top: 4px;">Enviado em 15/07/2026</div>
              <div class="doc-actions">
                <button class="btn btn-sm btn-aprovar" onclick="alterarDoc('${d}', 'aprovado')">✓ Aprovar</button>
                <button class="btn btn-sm" style="background: var(--vermelho); color: white;" onclick="alterarDoc('${d}', 'rejeitado')">✕ Rejeitar</button>
                <button class="btn btn-sm btn-outline">👁</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      ${stats.aprovados === DOCUMENTOS_SCHEMA.length ? `
        <div style="margin-top: 24px; padding: 16px; background: var(--verde-bg); border-radius: 8px; text-align: center;">
          <h3 style="color: var(--verde); margin-bottom: 8px;">🎉 Todos os documentos aprovados!</h3>
          <p style="color: #166534; margin-bottom: 12px;">A etapa de Coleta de Documentos pode ser finalizada.</p>
          <button class="btn btn-aprovar" onclick="mostrarToast('✅ Etapa avançada!', 'success')">✅ Aprovar tudo e avançar etapa</button>
        </div>
      ` : ''}
    </div>
  `;
}

function alterarDoc(doc, novoStatus) {
  docsStatus[1][doc] = novoStatus;
  renderMain();
  mostrarToast('✅ Status atualizado!', 'success');
}

// Init: clique no sidebar
document.querySelectorAll('.sidebar-item').forEach(item => {
  item.addEventListener('click', function() {
    const text = this.textContent.trim().toLowerCase();
    if (text.includes('dashboard')) currentSection = 'dashboard';
    else if (text.includes('vagas')) currentSection = 'vagas';
    else if (text.includes('candidatos')) currentSection = 'candidatos';
    else if (text.includes('agenda')) currentSection = 'agenda';
    else if (text.includes('documentos')) currentSection = 'documentos';
    else if (text.includes('relatórios')) currentSection = 'relatorios';
    else if (text.includes('configurações')) currentSection = 'config';
    else if (text.includes('sair')) { fazerLogout(); return; }
    document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
    this.classList.add('active');
    renderMain();
  });
});
