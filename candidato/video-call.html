<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Videochamada — VagasIO</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:20px;color:#211a20}button{padding:10px 14px;border:0;border-radius:8px;background:#722f37;color:#fff;margin:4px}button:disabled{opacity:.5}.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%;min-height:220px;background:#111;border-radius:10px}#status{padding:12px;background:#f5f2ef;border-radius:8px;margin:12px 0}</style><h1>Entrevista por vídeo</h1><div id="status">Verificando autorização…</div><button id="join" disabled>Entrar</button><button id="leave" disabled>Sair</button><button id="end" disabled>Encerrar para todos</button><div class="videos"><video id="local" autoplay muted playsinline></video><video id="remote" autoplay playsinline></video></div><script src="../_shared/runtime-config.js"></script><script>
const API=window.VAGASIO_API_BASE,id=sessionStorage.getItem('vagasio_video_interview_id');let cfg,room,credential,ws,pc,stream,queue=[],closing=false,reconnectTimer,reconnects=0;
const $=x=>document.getElementById(x),msg=x=>$('status').textContent=x;function token(){return localStorage.getItem('candidato_token')||localStorage.getItem('empresa_token')||localStorage.getItem('admin_token')||''}function decodeJwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(_){return {}}}
async function setup(){if(!id)return msg('Entrevista não identificada. Volte à agenda.');const t=token();if(!t)return msg('Faça login para entrar.');const h={Authorization:'Bearer '+t};let r=await fetch(API+'/api/video/config',{headers:h,cache:'no-store'});if(!r.ok)return msg('Videochamada VagasIO indisponível. Tente novamente.');cfg=await r.json();r=await fetch(API+'/api/video/rooms',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({interview_id:Number(id)})});if(!r.ok)return msg('Sala VagasIO indisponível. Tente novamente.');room=(await r.json()).room.room_id;r=await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/token',{method:'POST',headers:h});if(!r.ok)return msg('Não foi possível autorizar sua entrada. Tente novamente.');credential=await r.json();if(!credential?.token||!credential?.roomId){credential=null;return msg('Autorização da sala inválida. Tente novamente.');}credential.userId=credential.userId||decodeJwt(credential.token).user_id;if(!credential.userId){credential=null;return msg('Identidade da entrevista inválida. Tente novamente.');}$('end').disabled=credential.role!=='recruiter';$('join').disabled=false;msg('Sala pronta. Clique em Entrar.');}
async function drain(){if(!pc||!pc.remoteDescription)return;while(queue.length)try{await pc.addIceCandidate(queue.shift())}catch(_){queue=[]}}
async function connect(){ws=new WebSocket(cfg.signalUrl+'?token='+encodeURIComponent(credential.token));ws.onopen=()=>{reconnects=0;send({type:'join',room:credential.roomId,candidature_id:credential.candidatureId,interview_id:credential.interviewId,user_id:String(credential.userId),role:credential.role});msg('Conectado; aguardando o outro participante…')};ws.onmessage=async e=>{const raw=JSON.parse(e.data),m=raw.data&&typeof raw.data==='object'?{...raw,...raw.data}:raw;if(m.type==='ready'&&credential.role==='recruiter'){await pc.setLocalDescription(await pc.createOffer());send({type:'offer',offer:pc.localDescription})}else if(m.type==='offer'){await pc.setRemoteDescription(m.offer);await drain();await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',answer:pc.localDescription})}else if(m.type==='answer'){await pc.setRemoteDescription(m.answer);await drain()}else if(m.type==='candidate'){if(pc.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch(_){}else queue.push(m.candidate)}else if(m.type==='call-ended'){closing=true;leave();msg('O recrutador encerrou a chamada.')}};ws.onclose=()=>{if(!closing){msg('Conexão perdida. Tentando reconectar…');if(reconnects++<5)reconnectTimer=setTimeout(connect,Math.min(1000*2**reconnects,10000));else msg('Conexão perdida. Clique em Entrar para tentar novamente.')}}}
async function join(){try{if(!credential?.token||!cfg?.signalUrl){return msg('A entrevista ainda não está autorizada. Aguarde a configuração terminar.');}if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream}if(!pc){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send({type:'candidate',candidate:e.candidate});pc.oniceconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.iceConnectionState))msg('Conexão de vídeo instável. Tentando recuperar…')}};closing=false;$('join').disabled=true;$('leave').disabled=false;connect()}catch(e){msg('Câmera/microfone indisponível. Verifique as permissões e tente novamente.')}}function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}function leave(){closing=true;clearTimeout(reconnectTimer);if(ws)ws.close();if(pc)pc.close();pc=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('join').disabled=false;$('leave').disabled=true}async function end(){if(credential?.role!=='recruiter')return;await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/end',{method:'POST',headers:{Authorization:'Bearer '+token()}});send({type:'end-call'});msg('Chamada encerrada.');leave()}$('join').onclick=join;$('leave').onclick=leave;$('end').onclick=end;setup();
</script></html>
