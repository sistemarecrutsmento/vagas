<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrevista — VagasIO</title><style>
:root{--bg:#202124;--panel:#292a2d;--panel2:#303134;--text:#f1f3f4;--muted:#bdc1c6;--red:#ea4335;--blue:#8ab4f8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Roboto,system-ui,sans-serif}body{display:flex;flex-direction:column}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #ffffff10;flex:none}.brand{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}.brand-mark{width:31px;height:31px;border-radius:8px;background:#8ab4f8;color:#202124;display:grid;place-items:center;font-weight:800}.meeting-info{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:14px}.meeting-info strong{color:var(--text);font-weight:500}.top-actions{display:flex;align-items:center;gap:7px}.icon-btn{background:transparent;color:var(--text);border:0;border-radius:50%;width:40px;height:40px;font-size:19px;cursor:pointer}.icon-btn:hover,.icon-btn.active{background:#ffffff18}.exit-top{color:#f28b82;border:1px solid #f28b824d;border-radius:18px;padding:9px 16px;background:transparent;cursor:pointer}.status-line{height:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}.status-line #status{background:transparent;padding:0}.workspace{display:flex;min-height:0;flex:1;padding:0 18px 18px;gap:14px}.stage{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-height:0}.video-card{position:relative;min-height:360px;aspect-ratio:16/10;background:#111;border-radius:12px;overflow:hidden;border:1px solid #ffffff0c}.video-card video{width:100%;height:100%;object-fit:cover;background:#111}.video-card.remote video{background:radial-gradient(circle,#38393d,#121315)}.video-label{position:absolute;left:14px;bottom:13px;background:#202124cf;padding:8px 11px;border-radius:7px;font-size:14px}.video-label small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.video-menu{position:absolute;top:12px;right:12px;background:#202124b8;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:17px}.join-wrap{display:flex;justify-content:center}.join-wrap button{background:#8ab4f8;color:#202124;border:0;border-radius:22px;padding:12px 25px;font-weight:600;cursor:pointer}.join-wrap button:disabled{opacity:.5;cursor:not-allowed}.bottom-bar{display:flex;justify-content:center;align-items:center;gap:11px;height:84px;flex:none}.control{height:56px;min-width:64px;padding:7px 10px;border:0;border-radius:28px;background:#303134;color:var(--text);cursor:pointer}.control:hover,.control.active{background:#444548}.control.off{background:#f28b82;color:#202124}.control-icon{display:block;font-size:20px}.control-label{display:block;font-size:10px;color:var(--muted);margin-top:3px}.control.danger{background:var(--red);color:#fff;min-width:72px}.control.danger .control-label{color:#fff}.side-panel{width:0;overflow:hidden;background:var(--panel);border-radius:12px;transition:width .2s ease}.side-panel.open{width:330px;padding:18px}.side-panel h2{font-size:18px;margin:0 0 18px}.side-panel p{color:var(--muted);font-size:13px;line-height:1.5}.side-panel .panel-section{border-top:1px solid #ffffff16;padding:16px 0}.more-menu{display:none;position:absolute;right:22px;top:53px;background:var(--panel2);border:1px solid #ffffff18;border-radius:9px;padding:8px;z-index:8}.more-menu.open{display:block}.more-menu button{display:block;background:transparent;border:0;color:var(--text);padding:10px 14px;text-align:left;width:170px;border-radius:6px;cursor:pointer}.more-menu button:hover{background:#ffffff12}.focus-layout .video-card:first-child{display:none}.focus-layout .videos{grid-template-columns:1fr}.focus-layout .video-card{max-width:980px;width:100%;margin:auto;aspect-ratio:16/9}
@media(max-width:760px){.topbar{padding:0 12px;height:58px}.meeting-info{display:none}.workspace{padding:0 9px 6px}.videos{grid-template-columns:1fr;gap:8px}.video-card{min-height:0;aspect-ratio:16/9}.video-card:first-child{display:none}.bottom-bar{height:75px;gap:4px}.control{min-width:54px;height:50px;padding:5px}.control-label{font-size:9px}.side-panel.open{position:absolute;right:9px;top:67px;bottom:77px;width:calc(100% - 18px);z-index:7}.status-line{height:32px}}
</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">V</span><span>VagasIO</span></div><div class="meeting-info"><strong>Entrevista por vídeo</strong><span id="meeting-clock">Sala segura</span></div><div class="top-actions"><button class="icon-btn" id="full-screen" type="button" aria-label="Tela cheia">⛶</button><button class="icon-btn" id="more-toggle" type="button" aria-label="Mais opções">⋮</button><button class="exit-top" id="leave-top" type="button">Sair</button><div class="more-menu" id="more-menu"><button id="layout-toggle" type="button">Alternar layout</button></div></div></header><div class="status-line"><div id="status">Verificando autorização…</div></div><main class="workspace"><section class="stage"><section class="videos"><article class="video-card"><video id="local" autoplay muted playsinline></video><div class="video-label">Você<small>Câmera e microfone locais</small></div><button class="video-menu" type="button">⋮</button></article><article class="video-card remote"><video id="remote" autoplay playsinline></video><div class="video-label">Outro participante<small>Aguardando conexão</small></div><button class="video-menu" type="button">⋮</button></article></section><div class="join-wrap"><button id="join" type="button" disabled>Entrar na entrevista</button></div></section><aside class="side-panel" id="side-panel"><h2>Detalhes da reunião</h2><div class="panel-section"><strong>Participantes</strong><p>Você<br>Outro participante</p></div><div class="panel-section"><strong>Chat</strong><p>O chat da entrevista será disponibilizado nesta sala quando estiver habilitado.</p></div></aside></main><nav class="bottom-bar" aria-label="Controles da entrevista"><button id="cam-toggle" class="control" type="button"><span class="control-icon">▣</span><span class="control-label">Câmera</span></button><button id="mic-toggle" class="control" type="button"><span class="control-icon">◉</span><span class="control-label">Microfone</span></button><button id="share-toggle" class="control" type="button"><span class="control-icon">⇧</span><span class="control-label">Compartilhar</span></button><button id="layout-button" class="control" type="button" onclick="document.body.classList.toggle('focus-layout')"><span class="control-icon">▦</span><span class="control-label">Layout</span></button><button id="chat-toggle" class="control" type="button"><span class="control-icon">☷</span><span class="control-label">Detalhes</span></button><button id="leave" class="control danger" type="button" disabled><span class="control-icon">☎</span><span class="control-label">Sair</span></button><button id="end" class="control danger" type="button" disabled hidden>Encerrar</button></nav><script src="../_shared/runtime-config.js"></script><script>const API=window.VAGASIO_API_BASE,id=sessionStorage.getItem('vagasio_video_interview_id');let cfg,room,credential,ws,pc,stream,queue=[],closing=false,reconnectTimer,reconnects=0;
const $=x=>document.getElementById(x),msg=x=>$('status').textContent=x;function token(){return localStorage.getItem('candidato_token')||localStorage.getItem('empresa_token')||localStorage.getItem('admin_token')||''}function decodeJwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(_){return {}}}
async function setup(){if(!id)return msg('Entrevista não identificada. Volte à agenda.');const t=token();if(!t)return msg('Faça login para entrar.');const h={Authorization:'Bearer '+t};let r=await fetch(API+'/api/video/config',{headers:h,cache:'no-store'});if(!r.ok)return msg('Videochamada VagasIO indisponível. Tente novamente.');cfg=await r.json();r=await fetch(API+'/api/video/rooms',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({interview_id:Number(id)})});if(!r.ok)return msg('Sala VagasIO indisponível. Tente novamente.');room=(await r.json()).room.room_id;r=await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/token',{method:'POST',headers:h});if(!r.ok)return msg('Não foi possível autorizar sua entrada. Tente novamente.');credential=await r.json();if(!credential?.token||!credential?.roomId){credential=null;return msg('Autorização da sala inválida. Tente novamente.');}credential.userId=credential.userId||decodeJwt(credential.token).user_id;if(!credential.userId){credential=null;return msg('Identidade da entrevista inválida. Tente novamente.');}$('end').disabled=credential.role!=='recruiter';$('join').disabled=false;msg('Sala pronta. Clique em Entrar.');}
async function drain(){if(!pc||!pc.remoteDescription)return;while(queue.length)try{await pc.addIceCandidate(queue.shift())}catch(_){queue=[]}}
async function connect(){ws=new WebSocket(cfg.signalUrl+'?token='+encodeURIComponent(credential.token));ws.onopen=()=>{reconnects=0;send({type:'join',room:credential.roomId,candidature_id:credential.candidatureId,interview_id:credential.interviewId,user_id:String(credential.userId),role:credential.role});msg('Conectado; aguardando o outro participante…')};ws.onmessage=async e=>{const raw=JSON.parse(e.data),m=raw.data&&typeof raw.data==='object'?{...raw,...raw.data}:raw;if(m.type==='ready'&&credential.role==='recruiter'){await pc.setLocalDescription(await pc.createOffer());send({type:'offer',offer:pc.localDescription})}else if(m.type==='offer'){await pc.setRemoteDescription(m.offer);await drain();await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',answer:pc.localDescription})}else if(m.type==='answer'){await pc.setRemoteDescription(m.answer);await drain()}else if(m.type==='candidate'){if(pc.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch(_){}else queue.push(m.candidate)}else if(m.type==='call-ended'){closing=true;leave();msg('O recrutador encerrou a chamada.')}};ws.onclose=()=>{if(!closing){msg('Conexão perdida. Tentando reconectar…');if(reconnects++<5)reconnectTimer=setTimeout(connect,Math.min(1000*2**reconnects,10000));else msg('Conexão perdida. Clique em Entrar para tentar novamente.')}}}
async function join(){try{if(!credential?.token||!cfg?.signalUrl){return msg('A entrevista ainda não está autorizada. Aguarde a configuração terminar.');}if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream}if(!pc){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&send({type:'candidate',candidate:e.candidate});pc.oniceconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.iceConnectionState))msg('Conexão de vídeo instável. Tentando recuperar…')}};closing=false;$('join').disabled=true;$('leave').disabled=false;connect()}catch(e){msg('Câmera/microfone indisponível. Verifique as permissões e tente novamente.')}}function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}function leave(){closing=true;clearTimeout(reconnectTimer);if(ws)ws.close();if(pc)pc.close();pc=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('join').disabled=false;$('leave').disabled=true}async function end(){if(credential?.role!=='recruiter')return;await fetch(API+'/api/video/rooms/'+encodeURIComponent(room)+'/end',{method:'POST',headers:{Authorization:'Bearer '+token()}});send({type:'end-call'});msg('Chamada encerrada.');leave()}
let screenStream=null;
function bindMediaControls(){
 const cam=document.getElementById('cam-toggle'), mic=document.getElementById('mic-toggle'), share=document.getElementById('share-toggle');
 cam.onclick=()=>{const t=stream?.getVideoTracks?.()[0];if(!t)return; t.enabled=!t.enabled;cam.classList.toggle('off',!t.enabled);cam.querySelector('.control-label').textContent=t.enabled?'Câmera':'Câmera desligada';};
 mic.onclick=()=>{const t=stream?.getAudioTracks?.()[0];if(!t)return; t.enabled=!t.enabled;mic.classList.toggle('off',!t.enabled);mic.querySelector('.control-label').textContent=t.enabled?'Microfone':'Microfone desligado';};
 share.onclick=async()=>{try{if(screenStream){const old=stream?.getVideoTracks?.()[0];const sender=pc?.getSenders?.().find(s=>s.track&&s.track.kind==='video');if(sender&&old)await sender.replaceTrack(old);screenStream.getTracks().forEach(t=>t.stop());screenStream=null;share.classList.remove('active');share.querySelector('.control-label').textContent='Compartilhar tela';return;}screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});const track=screenStream.getVideoTracks()[0];const sender=pc?.getSenders?.().find(s=>s.track&&s.track.kind==='video');if(sender)await sender.replaceTrack(track);share.classList.add('active');share.querySelector('.control-label').textContent='Parar compartilhamento';track.onended=()=>share.click();}catch(_){msg('Compartilhamento de tela cancelado.');}};
}

const panel=document.getElementById('side-panel'), chatBtn=document.getElementById('chat-toggle');
document.getElementById('leave-top').onclick=leave;document.getElementById('full-screen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('more-toggle').onclick=()=>document.getElementById('more-menu').classList.toggle('open');document.getElementById('layout-toggle').onclick=()=>document.body.classList.toggle('focus-layout');chatBtn.onclick=()=>{panel.classList.toggle('open');chatBtn.classList.toggle('active',panel.classList.contains('open'));};
$('join').onclick=join;$('leave').onclick=leave;$('end').onclick=end;bindMediaControls();$('leave').disabled=true;setup();

</script></body></html>
