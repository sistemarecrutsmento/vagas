<!DOCTYPE html>
<html><body>
<h1>Test Login Direto</h1>
<pre id="r">aguardando...</pre>
<script>
const r = document.getElementById('r');
async function run() {
  try {
    r.innerHTML = 'Chamando API...';
    const resp = await fetch('https://recrutamento-api-novo.onrender.com/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: 'fabio08dejesusjunior@gmail.com', senha: '089339' })
    });
    const data = await resp.json();
    r.innerHTML = 'STATUS: ' + resp.status + '\nRESPOSTA: ' + JSON.stringify(data, null, 2).substring(0, 200);
    document.title = resp.ok ? 'SUCESSO' : 'FALHOU';
  } catch (e) {
    r.innerHTML = 'ERRO: ' + e.message;
    document.title = 'ERRO';
  }
}
run();
</script>
</body></html>
