<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VagasIO</title></head>
<body style="font-family:Arial,sans-serif;text-align:center;padding:48px;color:#722F37">
  <p>Carregando portal...</p>
  <script>
    // Rota dinâmica dos portais de empresa no GitHub Pages.
    // /candidato/{slug}/ usa exatamente o mesmo index.html universal.
    const path = location.pathname.replace(/\/+$/, '');
    const isCandidateCompanyPortal = /^\/candidato\/[a-z0-9-]+$/i.test(path);
    if (isCandidateCompanyPortal) {
      fetch('/candidato/index.html', { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('portal indisponível'); return r.text(); })
        .then(html => { document.open(); document.write(html); document.close(); })
        .catch(() => { document.body.innerHTML = '<p>Não foi possível carregar o portal de vagas.</p>'; });
    } else {
      document.body.innerHTML = '<h1>VagasIO</h1><p>Página não encontrada.</p><p><a href="/">Voltar ao início</a></p>';
    }
  </script>
</body>
</html>
